# Dependency update PRs. `05-security.md` §1 named "Dependabot weekly" as a
# supply-chain control; nothing implemented it, so the line had been decorative
# since it was written.
#
# ## What this adds that osv-scanner does not
#
# `osv` (security.yml) tells you a lockfile contains a known-vulnerable version
# and fails the PR. It never proposes the upgrade. So the control that existed
# could report a problem indefinitely without anything moving, and the two are
# complements rather than duplicates: osv is the gate, this is the hand.
#
# ## Weekly, and why not daily
#
# Daily on a three-ecosystem monorepo is a PR firehose that gets muted, and a
# muted bot is worse than none — the same disease `05-security.md` §5 records
# for a required check that could not pass. Weekly, grouped, with a small open-PR
# ceiling, is a volume a single maintainer can actually review.
#
# ## The interaction with `minimumReleaseAge` that has to be got right
#
# `pnpm-workspace.yaml` sets `minimumReleaseAge: 1440` — pnpm refuses any npm
# release younger than 24 hours, because the compromised version is usually the
# newest one. Dependabot does not read that setting, so left alone it would open
# PRs bumping to a version pnpm then refuses to install, and the PR fails at
# `pnpm install` with an error about the release age that reads like a broken
# lockfile. `cooldown` below is the Dependabot-side equivalent and is set to the
# same 24 hours (plus a margin for slow registry propagation) so the two agree.
# If one is changed, change the other.
version: 2

updates:
  # ---- npm / pnpm (apps/web, packages/ts/*) ------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 2
    groups:
      # One PR for the routine noise, separate PRs for anything that can break a
      # build on its own. A grouped update that fails tells you nothing about
      # which member broke it, which matters most for the framework packages.
      npm-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom", "typescript", "eslint"]
        update-types: ["minor", "patch"]
      # React and react-dom are one release, and `ui-visual` enforces it:
      # "Incompatible React versions: the `react` and `react-dom` packages must
      # have the exact same version". Split across two PRs, EACH one is red on
      # its own and neither can go green first — the pair deadlocks, which is
      # what happened to #579/#580 on the first run. They travel together, types
      # included, so the group is installable at every point.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
    commit-message:
      prefix: "chore"
      include: scope
    labels: ["dependencies"]

  # ---- Python / uv (services/*, packages/py/*) ---------------------------
  #
  # `uv.lock` is the committed lockfile. Dependabot's `uv` support reads
  # pyproject.toml + uv.lock, which is the shape this repo uses.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 2
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        # The scientific stack is where a minor bump most often changes numerical
        # output, and this product's whole claim is reproducible results. Those
        # move one at a time so a shifted expectation value has one suspect.
        exclude-patterns: ["qiskit*", "pennylane*", "cirq*", "amazon-braket*", "qibo*", "qulacs*", "numpy", "scipy"]
        update-types: ["minor", "patch"]
    ignore:
      # ruff 0.16 turns a bare `[tool.ruff]` config (line-length only, no
      # explicit `select`) into 527 violations on this tree — TRY004, RUF059,
      # PLR171, BLE001, RET501 and friends, none of which existed as errors
      # under 0.15. Adopting it is a repo-wide lint sweep touching ~200 files,
      # which is its own reviewable change and not something to ride in on a
      # dependency bump.
      #
      # pyproject.toml already pins `ruff>=0.14,<0.16` and says exactly this in
      # a comment sitting on the line above. Dependabot rewrote that line to
      # `>=0.16.2,<0.17` anyway — correctly, because it cannot read comments.
      # A pin whose only defence is a comment is not defended; this is the half
      # that Dependabot can actually see (leona#619).
      #
      # Remove this entry when the lint sweep lands, not before.
      - dependency-name: "ruff"
        versions: [">=0.16"]
    commit-message:
      prefix: "chore"
      include: scope
    labels: ["dependencies"]

  # ---- GitHub Actions ----------------------------------------------------
  #
  # The highest-value ecosystem here and the least obvious. Every `uses:` in this
  # repository is pinned to a full commit SHA on purpose — see the osv-scanner
  # install comment in security.yml, and `aquasecurity/trivy-action`'s March 2026
  # credential stealer, which reached everyone tracking a moving tag. A SHA pin
  # is safe and it is also invisible: nothing tells you the action is a year out
  # of date. This is what re-proposes the pin, with the new SHA, as a reviewable
  # diff.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 2
    groups:
      # ONE PR for the whole ecosystem, and the reason is `blast-radius`, not tidiness.
      #
      # Every action lives in `.github/workflows/`, which is a blast-radius path
      # (CODEOWNERS), so `check-blast-radius.mjs` requires a `Blast-radius:` line
      # in the PR body. Dependabot does not write one and cannot be taught to, so
      # EVERY actions PR fails a REQUIRED check and none of them can merge — five
      # did on the first run (#573-#577). The check is doing its job; the fix is
      # not to exempt the bot from it.
      #
      # A human adds the line and pushes (or reopens) to re-fire the event, since
      # the workflow reads the body from the event payload and a later edit alone
      # changes nothing. That is a fine weekly chore for ONE PR and an absurd one
      # for five, so: one group, majors included. Majors are the whole point here
      # — a SHA pin is invisible when it goes stale, and splitting them out would
      # just recreate the pile.
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: scope
    labels: ["dependencies"]

  # ---- The sandbox rootfs ------------------------------------------------
  #
  # `infra/sandbox/Dockerfile` is the base image for untrusted code execution.
  # Paired with the weekly `container_scan` job added to sandbox-image.yml: that
  # job reports a vulnerable base, this proposes the bump that fixes it.
  # Promotion to `:latest` stays manual behind docs/runbooks/sandbox-image.md —
  # merging a Dockerfile bump is not a deploy, and nothing here changes that.
  - package-ecosystem: docker
    directory: "/infra/sandbox"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    cooldown:
      default-days: 2
    commit-message:
      prefix: "chore"
      include: scope
    labels: ["dependencies"]
