# Nightly eval baseline (Phase 2 step 7). Runs the corpus through the real
# pipeline and records the honest pass rate. INERT until its secrets exist:
# a provider key (OPENAI_API_KEY + DEEPSEEK_API_KEY — the owner-confirmed
# providers — or ANTHROPIC_API_KEY) is required for a real baseline; without one
# the job is skipped, never faked. The ≥60% target in 08-phases.md is a
# calibration goal, not a release gate — this workflow does not block merges.
name: bench

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly
  workflow_dispatch: {}

jobs:
  eval-baseline:
    runs-on: ubuntu-latest
    # Only run when the LLM key is configured; otherwise there is no honest number.
    #
    # Both slugs, deliberately, until the org move lands. This job is about to move
    # from `EshMis/majorana` to `Leona-Quantum/leona` (ai-ops#46 + #70). A straight
    # swap merged before the transfer would make this job SKIP in the window between
    # the two — and a skipped job reports success, so the gap would be invisible.
    # Drop `EshMis/majorana` once the transfer is confirmed.
    if: ${{ github.repository == 'EshMis/majorana' || github.repository == 'Leona-Quantum/leona' }}
    # Was a throwaway Neon branch until 2026-07-27. The baseline needs a real
    # database, not production's data — a fresh migrated + seeded Postgres is
    # closer to what it was actually using, since a Neon branch was reset on
    # every run anyway.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pg
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: majorana_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BENCH_DATABASE_URL: postgresql://pg:pg@localhost:5432/majorana_bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: guard on provider keys
        # The openai profile needs BOTH keys (gpt-5.5 plans/verifies,
        # deepseek-v4-pro generates/writes back) — starting with one would fail
        # mid-run. Anthropic alone is the alternate complete profile.
        run: |
          if { [ -z "${{ secrets.OPENAI_API_KEY }}" ] || [ -z "${{ secrets.DEEPSEEK_API_KEY }}" ]; } && [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "No complete LLM provider profile — skipping the real baseline run."
            echo "skip=true" >> "$GITHUB_ENV"
          fi
      - if: ${{ env.skip != 'true' }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - if: ${{ env.skip != 'true' }}
        run: uv sync --all-packages --frozen
      - if: ${{ env.skip != 'true' }}
        name: migrate + seed
        env:
          DATABASE_URL_DIRECT: ${{ env.BENCH_DATABASE_URL }}
          DATABASE_URL: ${{ env.BENCH_DATABASE_URL }}
        run: |
          uv run --package majorana-api alembic -c db/alembic.ini upgrade head
          uv run --package majorana-api python db/seeds/seed.py --skip-if-populated
      - if: ${{ env.skip != 'true' }}
        name: run corpus → report.json
        env:
          DATABASE_URL: ${{ env.BENCH_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          uv run --package majorana-evals python -m majorana_evals \
            --corpus evals/corpus --out evals/report.json
          cat evals/report.json
      # A zero here means one of two entirely different things, and this workflow
      # could not tell them apart: the model had a bad night, or nothing ran at all.
      # It reported `success` on every run from 2026-07-27 onward while passing 0 of
      # 31 cases each time — every case dying at `sandbox_provider_failed` because
      # the VERCEL_TOKEN secret is rejected 403. Six weeks of green over an
      # instrument that measured nothing. This step fails only when the report
      # contains no quality signal AT ALL (nothing executed, or nothing judged); a
      # genuinely bad pass rate still passes, because the >=60% target is a
      # calibration goal and never a merge gate.
      #
      # AFTER the upload, deliberately: a failing guard must not suppress the
      # artifact, which is the only evidence of WHY the run measured nothing.
      - if: ${{ env.skip != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-report
          path: evals/report.json
      # Records the guard's EXIT CODE rather than the step's pass/fail, because the
      # two are not the same question. `3` means the report was read and holds no
      # measurement; `0` means it does; anything else means the guard itself could not
      # run. Only `3` may start the fallback: a crashed reporter that started a second
      # provider-backed corpus run would spend real money and then blame the Vercel
      # lane for its own failure. Greptile caught that on PR 831 — which is fitting,
      # since failing to tell a dead instrument from a real zero is the defect this
      # whole guard exists for.
      #
      # The `--self-test` that used to be chained here has moved to `ci`, so this step
      # asks exactly one question. If the step is killed before writing the output, the
      # value is empty, the fallback is skipped and the job fails — the safe direction.
      - if: ${{ env.skip != 'true' }}
        name: the report is a measurement, not a dead harness
        id: signal
        continue-on-error: true
        run: |
          set +e
          uv run python scripts/check_bench_signal.py evals/report.json
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      # The second lane, on the owner's ai-ops#257 answer ("if you could do both").
      #
      # It runs ONLY when the primary lane produced no measurement, so a healthy night
      # costs exactly one corpus run and no extra model spend. What it buys is that a
      # rejected Vercel credential stops meaning SIX WEEKS WITH NO NUMBER: the local
      # subprocess sandbox needs no Vercel token, so the quality question still gets an
      # answer on the night it is asked.
      #
      # It deliberately does NOT rescue the job. The step above is what fails, and this
      # one cannot un-fail it — a green tick over a dead Vercel lane is the exact defect
      # PR 829 was written to end, and a fallback that turned the alarm off would
      # reintroduce it in a form nobody would look for. The run is red, AND there is a
      # number. The two are not alternatives.
      #
      # The number it produces is NOT interchangeable with the primary one: the local
      # runner is a subprocess, not a Firecracker microVM, so it does not test the
      # isolation boundary a user actually gets. The report's own `note` records
      # `sandbox=local`, and the job summary says so in as many words, because a figure
      # whose boundary is unstated is the thing that gets quoted six months later.
      - if: ${{ env.skip != 'true' && steps.signal.outputs.code == '3' }}
        name: fallback lane — measure on the local sandbox, without a Vercel credential
        continue-on-error: true
        env:
          DATABASE_URL: ${{ env.BENCH_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run --package majorana-evals python -m majorana_evals \
            --corpus evals/corpus --out evals/report-local.json --sandbox local
          uv run python scripts/check_bench_signal.py evals/report-local.json

      - if: ${{ env.skip != 'true' && steps.signal.outputs.code == '3' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-report-local
          path: evals/report-local.json

      - if: ${{ env.skip != 'true' }}
        name: say which lane the number came from
        run: uv run python scripts/bench_summary.py evals/report.json evals/report-local.json >> "$GITHUB_STEP_SUMMARY"

      # Last, so the summary above is written whichever way this goes. The job's verdict
      # is the PRIMARY lane's and nothing else.
      # Fails on ANY non-zero code, and says which of the two happened. A guard that
      # could not run is a worse state than a nightly that measured nothing, not a
      # milder one, so it must never pass quietly for want of a matching branch.
      - if: ${{ env.skip != 'true' && steps.signal.outputs.code != '0' }}
        name: the primary lane did not produce a measurement
        run: |
          if [ "${{ steps.signal.outputs.code }}" = "3" ]; then
            echo "The Vercel-sandbox lane produced no measurement. See the guard's step for why."
            echo "A fallback local-sandbox number may exist in the eval-report-local artifact;"
            echo "it does not test the isolation boundary users get, and does not clear this."
          else
            echo "The signal guard itself did not run (exit '${{ steps.signal.outputs.code }}')."
            echo "Nothing is known about the night's quality either way, and no fallback ran."
          fi
          exit 1
