# Nightly eval baseline (Phase 2 step 7). Runs the corpus through the real
# pipeline and records the honest pass rate. INERT until its secrets exist:
# a provider key (OPENAI_API_KEY + DEEPSEEK_API_KEY — the owner-confirmed
# providers — or ANTHROPIC_API_KEY) is required for a real baseline; without one
# the job is skipped, never faked. The ≥60% target in 08-phases.md is a
# calibration goal, not a release gate — this workflow does not block merges.
name: bench

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly
  workflow_dispatch: {}

jobs:
  eval-baseline:
    runs-on: ubuntu-latest
    # Only run when the LLM key is configured; otherwise there is no honest number.
    #
    # Both slugs, deliberately, until the org move lands. This job is about to move
    # from `EshMis/majorana` to `Leona-Quantum/leona` (ai-ops#46 + #70). A straight
    # swap merged before the transfer would make this job SKIP in the window between
    # the two — and a skipped job reports success, so the gap would be invisible.
    # Drop `EshMis/majorana` once the transfer is confirmed.
    if: ${{ github.repository == 'EshMis/majorana' || github.repository == 'Leona-Quantum/leona' }}
    # Was a throwaway Neon branch until 2026-07-27. The baseline needs a real
    # database, not production's data — a fresh migrated + seeded Postgres is
    # closer to what it was actually using, since a Neon branch was reset on
    # every run anyway.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pg
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: majorana_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BENCH_DATABASE_URL: postgresql://pg:pg@localhost:5432/majorana_bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: guard on provider keys
        # The openai profile needs BOTH keys (gpt-5.5 plans/verifies,
        # deepseek-v4-pro generates/writes back) — starting with one would fail
        # mid-run. Anthropic alone is the alternate complete profile.
        run: |
          if { [ -z "${{ secrets.OPENAI_API_KEY }}" ] || [ -z "${{ secrets.DEEPSEEK_API_KEY }}" ]; } && [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "No complete LLM provider profile — skipping the real baseline run."
            echo "skip=true" >> "$GITHUB_ENV"
          fi
      - if: ${{ env.skip != 'true' }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - if: ${{ env.skip != 'true' }}
        run: uv sync --all-packages --frozen
      - if: ${{ env.skip != 'true' }}
        name: migrate + seed
        env:
          DATABASE_URL_DIRECT: ${{ env.BENCH_DATABASE_URL }}
          DATABASE_URL: ${{ env.BENCH_DATABASE_URL }}
        run: |
          uv run --package majorana-api alembic -c db/alembic.ini upgrade head
          uv run --package majorana-api python db/seeds/seed.py --skip-if-populated
      - if: ${{ env.skip != 'true' }}
        name: run corpus → report.json
        env:
          DATABASE_URL: ${{ env.BENCH_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          uv run --package majorana-evals python -m majorana_evals \
            --corpus evals/corpus --out evals/report.json
          cat evals/report.json
      - if: ${{ env.skip != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-report
          path: evals/report.json
