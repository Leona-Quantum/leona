# Phase 1 gates (contracts + migrations landed; import-linter and authz suite
# arrive with their steps — plans/rebuild/03-repo-structure.md §4).
# Job names ts/py/db are required checks on dev+prod — do not rename.
# Contracts chain (ADR-0008): models are truth → py job verifies openapi.json is
# current → ts job regenerates schema.d.ts and fails on diff.
name: ci
on:
  pull_request:
  # Phase 5/6 VQE work is intentionally validated before a PR exists. This
  # branch-only trigger must be removed when feature/vqe is retired.
  push:
    branches:
      - feature/vqe

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test
      - name: Next.js production build
        run: pnpm --filter @majorana/web build
      - name: contracts-gen is current
        run: |
          pnpm --filter @majorana/contracts-gen gen
          git diff --exit-code packages/ts/contracts-gen
      - name: catalog bootstrap manifest is valid and current
        run: |
          node --test 'scripts/catalog-bootstrap/*.test.mjs'
          node scripts/generate-catalog-bootstrap-manifest.mjs --check
      - name: atlas VQE corpus bundle is current (ADR-0027)
        run: node scripts/generate-atlas-vqe-corpus.mjs --check

  # UI a11y gate (roadmap 04 §5 step 2, slice a): render the real @majorana/ui
  # components to static HTML from source and assert zero WCAG A/AA violations via
  # @axe-core/playwright. Own job (needs a chromium download) so the required ts/py/db
  # checks stay untouched; not a required check yet. The screenshot visual-diff slice
  # lands separately.
  ui-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: install chromium
        run: pnpm --filter @majorana/ui-visual exec playwright install --with-deps chromium
      - name: axe (WCAG A/AA over rendered @majorana/ui stories)
        run: pnpm --filter @majorana/ui-visual run a11y
      - name: authenticated Atlas VQE happy/failure browser contracts
        run: pnpm --filter @majorana/web run e2e:vqe

  py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: H2 VQE registry review manifest is current (ADR-0030)
        run: |
          uv run python scripts/generate-h2-canonical-circuit.py --check
          uv run python scripts/generate-h2-vqe-registry-manifest.py --check
          uv run python scripts/check-phase5-vqe-snapshot.py
      - name: openapi.json is current
        run: uv run python -m majorana_contracts.export --check
      # Authz invariant (02-architecture §4): DB access only via the repository layer
      - name: import-linter
        run: uv run lint-imports
      - name: no raw queries outside repository layer
        run: uv run python scripts/check_raw_queries.py

  # The standalone workflow_dispatch qualification becomes callable after the
  # workflow exists on the default branch. Until feature/vqe is merged, an
  # explicitly tagged branch commit can exercise the same Linux/amd64 boundary.
  vqe-interchange:
    if: >-
      github.event_name == 'push'
      && contains(github.event.head_commit.message, '[phase77-qualify]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build fixed Linux/amd64 runtime
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file runtimes/vqe/interchange/Dockerfile \
            --tag majorana-vqe-interchange:qualification \
            --load \
            .
      - name: Run with the declared hardening boundary
        run: |
          set -euo pipefail
          mkdir -p phase77-evidence
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --pids-limit 128 \
            --memory 2g \
            --cpus 2 \
            majorana-vqe-interchange:qualification \
            > phase77-evidence/runtime.json
      - name: Bind evidence to source and container identities
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_digest="$(
            docker image inspect majorana-vqe-interchange:qualification \
              --format '{{.Id}}'
          )"
          adapter_sha256="$(sha256sum runtimes/vqe/interchange/adapter.py | cut -d' ' -f1)"
          jq \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg image_digest "$image_digest" \
            --arg adapter_sha256 "$adapter_sha256" \
            '
              .status = "linux_amd64_adapter_verified"
              | .source.implementation_source_commit = $source_commit
              | if .source.adapter_sha256 == $adapter_sha256
                then .
                else error("runtime adapter digest does not match checked-out source")
                end
              | .container = {
                  architecture: "amd64",
                  hardened_invocation: {
                    capabilities: "all_dropped",
                    filesystem: "read_only_with_tmpfs_tmp",
                    network: "none",
                    no_new_privileges: true,
                    non_root_uid: 65532,
                    pids_limit: 128
                  },
                  image_digest: $image_digest,
                  os: "linux",
                  python_base_digest:
                    "sha256:2986c55feb36e6cae00fa1fefb454283e4b33f35e75ff8bdd123b134130be301"
                }
            ' phase77-evidence/runtime.json \
            > phase77-evidence/linux_amd64_conversion_evidence.json
          jq -e '
            .runtime.machine == "x86_64"
            and .qiskit.exact_content_match == true
            and .openfermion_jordan_wigner.max_abs_matrix_difference
              <= .openfermion_jordan_wigner.tolerance
            and .qiskit_pennylane_equivalence.max_abs_hamiltonian_matrix_difference
              <= .qiskit_pennylane_equivalence.tolerance
            and (
              1 - .qiskit_pennylane_equivalence.statevector_overlap_absolute
              <= .qiskit_pennylane_equivalence.tolerance
            )
            and .public_execution == "blocked"
            and .performance_claims == "blocked"
            and .human_review == "unreviewed"
          ' phase77-evidence/linux_amd64_conversion_evidence.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: phase77-linux-amd64-evidence
          path: phase77-evidence/linux_amd64_conversion_evidence.json
          if-no-files-found: error
          retention-days: 90

  # Migration gate (04-database.md §4): up→down→up + seed; B-D3 budget (<60 s)
  # enforced by `timeout`.
  #
  # The migration gate runs against an EMPTY throwaway Postgres, not the Neon
  # branch. It used to use the Neon branch, but that branch is cut from the
  # project default — which is production `main` — and the 2026-07-19 catalog
  # cutover put catalog data there. Several catalog migrations are deliberately
  # one-way once that data exists (0013 refuses outright while a system workspace
  # is present; 0019 narrows a CHECK the data no longer satisfies), so
  # `downgrade base` became impossible and `db` failed on every PR, including
  # docs-only ones. Reversibility is a property of the schema, so it belongs on an
  # empty database; the live suites below keep the Neon branch, where a real
  # pooled endpoint is the point.
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pg
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: majorana_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # --all-extras pulls the optional `qiskit` extra: the pipeline e2e drives the
      # REAL deterministic QASM epilogue through LocalSubprocessSandbox (sys.executable
      # -I), which imports qiskit at runtime — the canned Bell program is real qiskit.
      - run: uv sync --all-packages --all-extras --frozen
      # Plain `postgresql://` on purpose: db.py upgrades the scheme to psycopg
      # itself, and asyncpg is not a dependency.
      - name: migrate up→down→up (B-D3 <60s) + seed
        env:
          DATABASE_URL_DIRECT: postgresql://pg:pg@localhost:5432/majorana_migrations
          DATABASE_URL: postgresql://pg:pg@localhost:5432/majorana_migrations
        run: |
          timeout 60 bash -c '
            set -e
            uv run --package majorana-api alembic -c db/alembic.ini upgrade head
            uv run --package majorana-api alembic -c db/alembic.ini downgrade base
            uv run --package majorana-api alembic -c db/alembic.ini upgrade head
          '
          uv run --package majorana-api python db/seeds/seed.py
      - uses: neondatabase/create-branch-action@v5
        id: neon
        with:
          project_id: twilight-wildflower-01313590
          branch_name: ci-pr${{ github.event.number }}-run${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: reset the disposable Neon branch schema
        env:
          DATABASE_URL_DIRECT: ${{ steps.neon.outputs.db_url }}
        run: |
          psql "$DATABASE_URL_DIRECT" \
            --set=ON_ERROR_STOP=1 \
            --command='DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'
      - name: migrate the Neon branch for the live suites
        env:
          DATABASE_URL_DIRECT: ${{ steps.neon.outputs.db_url }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
        run: uv run --package majorana-api alembic -c db/alembic.ini upgrade head
      # Authz suite (Phase 1 step 4): entity × role × cross-workspace against
      # the same throwaway branch. Required-check status rides on this db job.
      - name: authz suite
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
        run: uv run pytest services/api/tests/authz -q
      # Pipeline spine E2E (Phase 2 step 1): run -> job -> events -> SSE replay.
      # --all-extras keeps qiskit installed (a prior `uv run --package` step can
      # prune it) so the sandbox subprocess can import it for the QASM epilogue.
      - name: pipeline e2e
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
        run: uv run --all-extras pytest services/api/tests/test_pipeline_e2e.py -q
      # Catalog-free database, on the throwaway Postgres rather than the Neon
      # branch. These fixtures PROVISION the system catalog authority themselves,
      # inserting the importer with a deterministic uuid and
      # workos_user_id='system:catalog-importer'. Production now has that identity
      # under a different uuid, so on a branch cut from `main` the insert's
      # ON CONFLICT (id) misses and the users_workos_user_id_key UNIQUE fires
      # instead — 9 errors. They need a database where the catalog does not
      # already exist, which the Neon branch can no longer be. Separate DB from
      # the migration gate's so the seed rows stay out of the queue tests.
      # (authz and pipeline-e2e above do not touch the catalog authority, so they
      # stay on Neon, where a real pooled endpoint is the point.)
      - name: create the catalog-free live database
        run: PGPASSWORD=pg psql -h localhost -U pg -d postgres -c 'CREATE DATABASE majorana_live'
      - name: repository concurrency and integrity
        env:
          DATABASE_URL_DIRECT: postgresql://pg:pg@localhost:5432/majorana_live
          DATABASE_URL: postgresql://pg:pg@localhost:5432/majorana_live
        run: |
          uv run --package majorana-api alembic -c db/alembic.ini upgrade head
          uv run --all-extras pytest \
            services/api/tests/test_catalog_provenance_live.py \
            services/api/tests/test_job_queue_live.py \
            services/api/tests/test_run_terminal_live.py \
            services/api/tests/test_vqe_repo_live.py \
            services/worker/tests/test_vqe_execution_live.py \
            -q
      - uses: neondatabase/delete-branch-action@v3
        if: always()
        with:
          project_id: twilight-wildflower-01313590
          branch: ci-pr${{ github.event.number }}-run${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
