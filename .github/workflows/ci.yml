# Phase 1 gates (contracts landed; import-linter, authz suite, migration up/down
# vs Neon branch arrive with their steps — plans/rebuild/03-repo-structure.md §4).
# Job names ts/py are required checks on dev+prod — do not rename.
# Contracts chain (ADR-0008): models are truth → py job verifies openapi.json is
# current → ts job regenerates schema.d.ts and fails on diff.
name: ci
on:
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test
      - name: contracts-gen is current
        run: |
          pnpm --filter @majorana/contracts-gen gen
          git diff --exit-code packages/ts/contracts-gen

  py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: openapi.json is current
        run: uv run python -m majorana_contracts.export --check
