# Phase 1 gates (contracts + migrations landed; import-linter and authz suite
# arrive with their steps — plans/archive/rebuild/03-repo-structure.md §4, archived;
# the live repo layout is the current authority).
# Job names ts/py/db are required checks on dev+prod — do not rename.
# Contracts chain (ADR-0008): models are truth → py job verifies openapi.json is
# current → ts job regenerates schema.d.ts and fails on diff.
#
# `merge_group` is required alongside `pull_request`: a merge queue re-validates
# required checks against its own trial-merge ref (`gh-readonly-queue/...`), and a
# required check with no merge_group trigger never reports there, which stalls the
# queue forever (ai-ops#46/#70 merge-queue-prerequisites lane). None of ts/py/db
# carries an `if:` or reads `github.event.pull_request.*`, so all three run
# unchanged under both events — no other change needed in this file.
name: ci
on:
  pull_request:
  merge_group:

# A push to an open PR supersedes the run already in flight: that run is testing a
# commit that can no longer be merged, so letting it finish only holds a runner and
# delays the run that matters. Cancelling weakens no gate — the required ts/py/db
# checks are re-reported by the new run against the new head, which is the commit
# branch protection actually reads. `github.ref` is refs/pull/<n>/merge here, so
# each PR gets its own group and PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test
      - name: contracts-gen is current
        run: |
          pnpm --filter @majorana/contracts-gen gen
          git diff --exit-code packages/ts/contracts-gen
      - name: catalog bootstrap manifest is valid and current
        run: |
          node --test 'scripts/catalog-bootstrap/*.test.mjs'
          node scripts/generate-catalog-bootstrap-manifest.mjs --check

  # UI a11y gate (roadmap 04 §5 step 2, slice a): render the real @majorana/ui
  # components to static HTML from source and assert zero WCAG A/AA violations via
  # @axe-core/playwright. Own job (needs a chromium download) so the required ts/py/db
  # checks stay untouched; not a required check yet. The screenshot visual-diff slice
  # lands separately.
  ui-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: install chromium
        run: pnpm --filter @majorana/ui-visual exec playwright install --with-deps chromium
      # `a11y` runs every spec in the package, not only axe: the Atlas name-plate check
      # rides in the same job because it needs the same Chromium and the same
      # render-from-source step.
      - name: axe over the @majorana/ui stories, plus the Atlas render checks
        run: pnpm --filter @majorana/ui-visual run a11y

  # Form submission gate (ai-ops issue 123): apps/web has six user-facing forms
  # (contact, welcome, account settings, workspace sharing, QPU credentials,
  # studio's custom-gate builder) plus a seventh the audit's count of six
  # missed — the project-sharing dialog reachable from the Studio sidebar.
  # None had ever been submitted by any automated check; ui-visual explicitly
  # renders @majorana/ui from source with no Next and no auth (its own
  # AGENTS.md), so it could not have covered this either. Own job for the
  # same reason ui-visual is one: a jsdom + esbuild + React Testing Library
  # harness (tests/forms/) that the required `ts` job's `test` script does
  # not pull in. Not a required check yet — same posture ui-visual started
  # in; promote alongside it if the owner wants that.
  form-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: submit every apps/web form and assert on the result
        run: pnpm --filter @majorana/web run test:forms

  py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # This step was 177s of the job's 223s — 79%, and the pacing item for the
      # whole required-check gate, so PR-to-green was effectively "how long does
      # pytest take".
      #
      # `--dist loadfile` is NOT a tuning knob, do not drop it for a bare `-n auto`.
      # Measured, both ways, before this landed: with the default `--dist load`,
      # which spreads individual tests across workers,
      # test_roles_and_lowering.py::test_a_measured_circuit_gains_a_result_in_every_framework[pennylane]
      # FAILS while passing serially — module-level framework state leaks between
      # workers when parametrized cases of the same file land on different ones.
      # `loadfile` keeps every test in a file on one worker, which restores the
      # isolation the suite was written against.
      #
      # The guard that this stays honest is the count: after `uv sync
      # --all-packages --frozen`, serial and parallel both report 2312 passed /
      # 419 skipped. A parallel run that quietly collected FEWER tests is the
      # failure mode worth fearing here — it would look like a speedup — so the
      # count is what to re-check if this line is ever edited, not the clock.
      #
      # What it is actually worth, measured on this runner rather than projected:
      # 177s -> 140s, and the job 223s -> 186s. Locally the same change is 79.7s
      # -> 30.7s (2.6x), and the gap is the point — `ubuntu-latest` is 4 vCPU,
      # and under `loadfile` the floor is the slowest SINGLE file, which no
      # amount of extra workers moves. Do not quote the local number as the CI
      # number. Further gain here means splitting the dominant file, not adding
      # `-n` workers.
      - run: uv run pytest -q -n auto --dist loadfile
      # The framework-native sandbox suites EXECUTE generated code through
      # LocalSubprocessSandbox, so they need the SDK extras that the sync above
      # deliberately leaves out. Without this step they skip — and they are the
      # tests that prove a published circuit is runnable at all, so skipping them
      # is the difference between a gate and a green tick.
      #
      # MAJORANA_REQUIRE_SDKS=1 makes a missing SDK a FAILURE rather than a skip,
      # so this step cannot quietly become a no-op if the extras stop resolving.
      - name: framework-native execution (needs the SDK extras)
        env:
          MAJORANA_REQUIRE_SDKS: "1"
        run: >
          uv run --all-extras pytest
          packages/py/frameworks
          services/worker/tests/test_circuit_lowering.py
          -q
      - name: openapi.json is current
        run: uv run python -m majorana_contracts.export --check
      # Authz invariant (02-architecture §4): DB access only via the repository layer
      - name: import-linter
        run: uv run lint-imports
      - name: no raw queries outside repository layer
        run: uv run python scripts/check_raw_queries.py
      # Migration 0050: run_events/audit_log/usage_events are append-only by
      # trigger, with one deliberate, transaction-scoped bypass for test
      # cleanup. This is what keeps that bypass from spreading into product code.
      - name: append-only bypass confined to its two allowed locations
        run: uv run python scripts/check_append_only_bypass.py

  # Migration gate (04-database.md §4): up→down→up + seed; B-D3 budget (<60 s)
  # enforced by `timeout`.
  #
  # The migration gate runs against an EMPTY throwaway Postgres, not the Neon
  # branch. It used to use the Neon branch, but that branch is cut from the
  # project default — which is production `main` — and the 2026-07-19 catalog
  # cutover put catalog data there. Several catalog migrations are deliberately
  # one-way once that data exists (0013 refuses outright while a system workspace
  # is present; 0019 narrows a CHECK the data no longer satisfies), so
  # `downgrade base` became impossible and `db` failed on every PR, including
  # docs-only ones. Reversibility is a property of the schema, so it belongs on an
  # empty database.
  #
  # Every live suite runs against this container. Two of them used to run against
  # a throwaway Neon branch instead, "where a real pooled endpoint is the point" —
  # that reason expired on 2026-07-27 when production moved to Cloud SQL and
  # stopped having a pooled endpoint at all. Both were checked against a plain
  # migrated Postgres 17 before the branch steps were removed.
  #
  # postgres:17 matches production. It was 16 while production was Neon's 17,
  # which is the sort of gap that surfaces as a mystery on the day it matters.
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pg
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: majorana_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      # --all-extras pulls the optional `qiskit` extra: the pipeline e2e drives the
      # REAL deterministic QASM epilogue through LocalSubprocessSandbox (sys.executable
      # -I), which imports qiskit at runtime — the canned Bell program is real qiskit.
      - run: uv sync --all-packages --all-extras --frozen
      # Plain `postgresql://` on purpose: db.py upgrades the scheme to psycopg
      # itself, and asyncpg is not a dependency.
      - name: migrate up→down→up (B-D3 <60s) + seed
        env:
          DATABASE_URL_DIRECT: postgresql://pg:pg@localhost:5432/majorana_migrations
          DATABASE_URL: postgresql://pg:pg@localhost:5432/majorana_migrations
        run: |
          timeout 60 bash -c '
            set -e
            uv run --package majorana-api alembic -c db/alembic.ini upgrade head
            uv run --package majorana-api alembic -c db/alembic.ini downgrade base
            uv run --package majorana-api alembic -c db/alembic.ini upgrade head
          '
          uv run --package majorana-api python db/seeds/seed.py
      # A third database, separate from the migration gate's so the seed rows
      # stay out of these suites, and separate from majorana_live below because
      # that one must NOT have the catalog authority (see its comment).
      - name: create the live-suite database
        run: PGPASSWORD=pg psql -h localhost -U pg -d postgres -c 'CREATE DATABASE majorana_authz'
      - name: migrate the live-suite database
        env:
          DATABASE_URL_DIRECT: postgresql://pg:pg@localhost:5432/majorana_authz
          DATABASE_URL: postgresql://pg:pg@localhost:5432/majorana_authz
        run: uv run --package majorana-api alembic -c db/alembic.ini upgrade head
      - name: create the majorana_api test role
        run: |
          PGPASSWORD=pg psql -h localhost -U pg -d majorana_authz -c "
          do \$\$ begin
            if not exists (select 1 from pg_roles where rolname = 'majorana_api') then
              create role majorana_api login password 'ci-only-not-a-secret';
              grant app_rw to majorana_api;
            end if;
          end \$\$;
          "
      # Authz suite (Phase 1 step 4): entity × role × cross-workspace.
      # Required-check status rides on this db job.
      #
      # **Runs as `majorana_api`, not as `pg`** (ai-ops#150). ADR-0004 names this suite
      # "the load-bearing control replacing RLS", and for its entire git history it ran
      # as the CI superuser — proving the authorization LOGIC while never once
      # exercising it under the PRIVILEGE SET the application actually has. Production
      # has connected as `majorana_api` (member of `app_rw` and nothing else) since
      # 2026-08-17, so those were two different claims and only the first was being made.
      #
      # `DATABASE_URL_OWNER` is for TEARDOWN only — `repo_test_helpers.
      # delete_committed_tenants` deletes from four tables `app_rw` deliberately holds no
      # DELETE on, because production never deletes them. Test BODIES run restricted,
      # which is the entire point; cleaning up afterwards is not part of the claim.
      - name: authz suite
        env:
          DATABASE_URL: postgresql://majorana_api:ci-only-not-a-secret@localhost:5432/majorana_authz
          DATABASE_URL_OWNER: postgresql://pg:pg@localhost:5432/majorana_authz
        run: uv run pytest services/api/tests/authz -q
      # RLS suite (ai-ops#143; docs/adr/0028-rls-defense-in-depth.md).
      #
      # Migrations and the seed above run as `pg`, the CI Postgres superuser, because
      # DDL needs the owner. The authz suite and the live suites do NOT any more — they
      # connect as `majorana_api`, same as this one (ai-ops#150); this comment said
      # "everything above ... runs as pg" and stopped being true when they were flipped.
      #
      # A superuser bypasses row-level security
      # unconditionally, so running the RLS suite the same way would report every
      # policy in db/migrations/versions/0053 as working while proving nothing
      # (see 0052's own note on testing a privilege change as a superuser, and
      # 0053's and this suite's module docstrings). `majorana_api` here mirrors
      # production's connecting role exactly: LOGIN, member of `app_rw` — created
      # by migration 0052, already applied to `majorana_authz` above — and
      # nothing else, so NOSUPERUSER/NOBYPASSRLS are the created-role defaults
      # rather than something this step has to set.
      #
      # Idempotent by construction (`if not exists`) for the same reason 0052's
      # own role-creation block is: this workflow runs the `db` job on every PR
      # against the same long-lived Postgres SERVICE CONTAINER for the run, and
      # roles are cluster-wide, not per-database.
      - name: RLS suite
        env:
          # The non-superuser role every assertion in this suite depends on —
          # test_connecting_role_cannot_bypass_rls checks this dynamically rather
          # than trusting the step above.
          DATABASE_URL: postgresql://majorana_api:ci-only-not-a-secret@localhost:5432/majorana_authz
          # Owns the tables (this job's migrations ran as `pg`), so only this ONE
          # meta-test (test_deliberately_broken_policy_is_caught) can ALTER POLICY
          # to prove the suite's cross-tenant assertions would catch a weakened
          # policy. Every other test in the suite ignores this var entirely.
          DATABASE_URL_OWNER: postgresql://pg:pg@localhost:5432/majorana_authz
        run: uv run pytest services/api/tests/rls -q
      # Pipeline spine E2E (Phase 2 step 1): run -> job -> events -> SSE replay.
      # --all-extras keeps qiskit installed (a prior `uv run --package` step can
      # prune it) so the sandbox subprocess can import it for the QASM epilogue.
      - name: pipeline e2e
        env:
          DATABASE_URL: postgresql://pg:pg@localhost:5432/majorana_authz
        run: uv run --all-extras pytest services/api/tests/test_pipeline_e2e.py -q
      # Catalog-free database. These fixtures PROVISION the system catalog
      # authority themselves, inserting the importer with a deterministic uuid
      # and workos_user_id='system:catalog-importer'. Production has that
      # identity under a different uuid, so against any copy of production data
      # the insert's ON CONFLICT (id) misses and the users_workos_user_id_key
      # UNIQUE fires instead — 9 errors. That is why this database is its own,
      # and it is why it must never be seeded either.
      - name: create the catalog-free live database
        run: PGPASSWORD=pg psql -h localhost -U pg -d postgres -c 'CREATE DATABASE majorana_live'
      # Every `*_live.py` suite, and the list is guarded: seven of these existed
      # on disk and were named by no workflow at all, so they had never once run
      # here — see services/api/tests/test_live_suite_is_wired_to_ci.py. They run
      # in one invocation, against one database, on purpose: that is also what
      # keeps them honest about the state they leave behind for each other.
      # Also restricted, and for the same reason as the authz suite above
      # (ai-ops#150) — these 27 files had never run as anything but the superuser
      # either, and they are four times its size. `DATABASE_URL_DIRECT` stays `pg`
      # because alembic needs the OWNER to run DDL; only the suites' own connection
      # moves. Measured before flipping: 244 tests collected under both roles, so this
      # is the same coverage evaluated under production's privileges, not less of it.
      - name: repository concurrency and integrity
        env:
          DATABASE_URL_DIRECT: postgresql://pg:pg@localhost:5432/majorana_live
          DATABASE_URL: postgresql://majorana_api:ci-only-not-a-secret@localhost:5432/majorana_live
          DATABASE_URL_OWNER: postgresql://pg:pg@localhost:5432/majorana_live
        run: |
          uv run --package majorana-api alembic -c db/alembic.ini upgrade head
          uv run --all-extras pytest \
            services/api/tests/test_append_only_triggers_live.py \
            services/api/tests/test_artifact_cap_race_live.py \
            services/api/tests/test_artifact_versions_live.py \
            services/api/tests/test_catalog_attestation_live.py \
            services/api/tests/test_catalog_bootstrap_import_live.py \
            services/api/tests/test_catalog_import_live.py \
            services/api/tests/test_catalog_provenance_live.py \
            services/api/tests/test_catalog_public_read_live.py \
            services/api/tests/test_catalog_staging_live.py \
            services/api/tests/test_conversation_events_batch_live.py \
            services/api/tests/test_conversation_turns_live.py \
            services/api/tests/test_folder_ordering_live.py \
            services/api/tests/test_job_queue_live.py \
            services/api/tests/test_membership_cap_race_live.py \
            services/api/tests/test_project_artifact_ledgers_live.py \
            services/api/tests/test_project_routes_live.py \
            services/api/tests/test_project_shares_http_live.py \
            services/api/tests/test_project_sharing_tier_live.py \
            services/api/tests/test_projects_live.py \
            services/api/tests/test_provider_credentials_live.py \
            services/api/tests/test_qpu_spend_allowance_live.py \
            services/api/tests/test_run_allowance_race_live.py \
            services/api/tests/test_run_terminal_live.py \
            services/api/tests/test_submission_backstop_race_live.py \
            services/api/tests/test_usage_allowance_live.py \
            services/api/tests/test_usage_spend_live.py \
            services/api/tests/test_workspace_cap_race_live.py \
            services/worker/tests/test_orphaned_runs_live.py \
            -q
