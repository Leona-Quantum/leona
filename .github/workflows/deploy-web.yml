# Deploy the website to Cloud Run.
#
# ## This is the only way the website is deployed
#
# GCP migration (ai-ops `desk/leona/plans/gcp-migration-20260912/PLAN.md`).
# Visitors reach leonaqt.com through Cloudflare -> the Google load balancer ->
# the `majorana-web` Cloud Run service this workflow deploys. DNS moved on
# 2026-09-20 and Vercel was retired on 2026-09-21: its Git integration is
# disconnected, so a push no longer builds anything there. A run that deploys
# nothing when it should have is therefore an outage in the making, not a
# difference between two stacks — which is why a missing credential and
# WEB_SIGN_IN=0 fail the run below instead of warning.
#
# ## The shape is deploy.yml's, on purpose
#
# Smoke-test before anybody is served -> deploy dark -> shift traffic, the same
# sequence the api has used since July, because the failure it prevents is the
# same one: a revision that builds, deploys, and cannot serve. A web deploy that
# only checked "did a deployment record appear" is exactly what was in place on
# 2026-08-14 when a silent Vercel failure went unnoticed for hours.
#
# ## Why the smoke test runs on a twin, not on majorana-web
#
# It used to probe a dark revision of `majorana-web` at its tagged run.app URL.
# That stops being possible the moment the load balancer goes in front
# (infra/web-lb/40-serve.sh): ingress becomes `internal-and-cloud-load-balancing`,
# ingress belongs to the SERVICE rather than to a revision or a tag, and every
# run.app URL the service has then refuses a GitHub runner, token or no token.
# The load balancer is no way in either — the origin lock refuses anything that
# is not Cloudflare, which is its job. Left alone, the first deploy after the
# load balancer went live would have failed its smoke test, never shifted, and
# frozen the website at the revision then serving.
#
# So the image is deployed first to `majorana-web-verify`: private, IAM-gated,
# scaled to zero, the same identity, and the SAME settings — composed once below
# and handed to both deploys, because two copies of "what production is
# configured with" is a rule that gets broken with both copies in plain sight.
# infra/web-lb/07-verify-twin.sh creates it and explains the rest.
#
# ## The flag this workflow must never pass to majorana-web
#
# `--no-allow-unauthenticated`. On an existing service gcloud does not read that
# as "leave it private", it REMOVES the allUsers binding (confirmed in
# surface/run/deploy.py, not inferred) — the binding 40-serve.sh adds because the
# load balancer reaches Cloud Run as an ordinary unauthenticated caller. Passed
# here, the first deploy after the cutover would have turned the whole site into
# a 403 for every visitor. Public-ness is 40-serve.sh's decision and this file
# leaves it alone; what it does assert, on every deploy, is that ingress stays
# restricted to the load balancer, so the service is never both public and
# reachable around Cloudflare.
name: deploy-web

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-web-cloud-run
  cancel-in-progress: false

env:
  GCP_PROJECT: majorana-core
  GCP_REGION: us-west1
  SERVICE: majorana-web
  # /repository* since 2026-09-24 (infra/web-lb/25-atlas-bulkhead.sh).
  ATLAS_SERVICE: majorana-web-atlas
  VERIFY_SERVICE: majorana-web-verify
  VERIFY_AUDIENCE: majorana-web-verify
  # No project roles at all; reads the website's own secrets and nothing else
  # (infra/web-lb/05-runtime-identity.sh). Without it the service inherits the
  # default compute account, which holds roles/editor on the project.
  RUNTIME_SA: majorana-web-runtime@majorana-core.iam.gserviceaccount.com
  # Public values: the live sign-in redirect prints both. The redirect URI names
  # the production host on purpose — sign-in only ever completes there.
  WORKOS_CLIENT_ID: client_01KX3TN2Y37QDVCWG1M7M5WRG8
  WORKOS_REDIRECT_URI: https://leonaqt.com/auth/callback

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }

      # scripts/web-build-needed.sh decides; checked by
      # scripts/check-web-build-needed.mjs in the web lint. Exit 0 means SKIP.
      #
      # Note what this does NOT test: the list is a blacklist of paths the web
      # app does not build from, named individually, so a package added later is
      # unrecognised and therefore BUILDS. "Python-only, so skip" is not the rule
      # and guessing it will mislead you — packages/py/notebooks postdates the
      # list and triggers a full build.
      - name: should this commit deploy the web app
        id: expect
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "expected=yes" >> "$GITHUB_OUTPUT"
            echo "manual run: deploying regardless of changed paths"
            exit 0
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "expected=yes" >> "$GITHUB_OUTPUT"
            echo "no usable base sha: deploying"
            exit 0
          fi
          if WEB_BUILD_BASE="$BEFORE" WEB_BUILD_HEAD="${{ github.sha }}" \
               bash scripts/web-build-needed.sh; then
            echo "expected=no" >> "$GITHUB_OUTPUT"
            echo "SKIP: nothing the web app builds from changed"
          else
            echo "expected=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: load web sizing
        if: steps.expect.outputs.expected == 'yes'
        run: |
          for key in WEB_MIN_INSTANCES WEB_MAX_INSTANCES WEB_CONCURRENCY WEB_ATLAS_MIN_INSTANCES WEB_ATLAS_MAX_INSTANCES WEB_ATLAS_CONCURRENCY WEB_XFF_TRUSTED_HOPS WEB_SIGN_IN; do
            grep -qE "^${key}=[0-9]+$" infra/fleet.env || {
              echo "::error::${key} is missing from infra/fleet.env or is not a plain integer"
              exit 1
            }
          done
          grep -E '^WEB_[A-Z_]+=[0-9]+$' infra/fleet.env >> "$GITHUB_ENV"

      - name: check deploy credentials
        id: creds
        if: steps.expect.outputs.expected == 'yes'
        run: echo "have=${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}" >> "$GITHUB_OUTPUT"

      # A warning while Vercel still served the site; an error now, because
      # nothing else deploys it and a skipped deploy leaves the site frozen.
      - if: steps.expect.outputs.expected == 'yes' && steps.creds.outputs.have != 'true'
        run: |
          echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_DEPLOY_SERVICE_ACCOUNT not set —"
          echo "::error::the web app was NOT deployed, and nothing else deploys it."
          echo "::error::Deploy by hand: docs/runbooks/web-cloud-run.md"
          exit 1

      - name: tag
        id: tag
        if: steps.creds.outputs.have == 'true'
        run: echo "tag=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.creds.outputs.have == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: steps.creds.outputs.have == 'true'

      # NEXT_PUBLIC_* and the CSP are baked into the bundle by `next build`, so
      # they are build args in cloudbuild.web.yaml rather than service settings.
      # Changing one of those means a rebuild, not a `run services update`.
      #
      # The browser-side Sentry DSN arrives here, in the commit that puts the load
      # balancer in front, as the note this replaces asked: before that it would
      # have reported from a service no visitor reaches. It is read from Secret
      # Manager rather than written into this file — it is not a secret (every
      # browser receives it), but a DSN in a workflow is a string the secret
      # scanners are right to stop on. WEB_SENTRY_DSN and not SENTRY_DSN: that
      # one is the api's, a different Sentry project.
      #
      # _PUBLIC_ENV defaults to `spike` in cloudbuild.web.yaml, which is what a
      # hand-run build should say. This one is production and says so; left at
      # the default, every browser error would be filed under an environment
      # nobody watches.
      - name: build image
        if: steps.creds.outputs.have == 'true'
        run: |
          browser_dsn=$(gcloud secrets versions access latest --secret WEB_SENTRY_DSN --project "$GCP_PROJECT")
          [ -n "$browser_dsn" ] || { echo "::error::WEB_SENTRY_DSN read back empty"; exit 1; }
          echo "::add-mask::${browser_dsn}"
          gcloud builds submit --config cloudbuild.web.yaml \
            --ignore-file=.gcloudignore.web \
            --substitutions=_TAG="${{ steps.tag.outputs.tag }}",_SHA="${{ github.sha }}",_PUBLIC_ENV=production,_SENTRY_DSN="${browser_dsn}",_WORKOS_REDIRECT_URI="${WORKOS_REDIRECT_URI}" \
            --project "$GCP_PROJECT" --region "$GCP_REGION" .

      # ## MAJORANA_PUBLIC_CATALOG_API, found by comparing the two stacks
      #
      # Vercel production set it; the first Cloud Run deploys did not, because it
      # was stored write-only in Vercel and read back empty. With it off, entry pages
      # render from the committed corpus instead of the API's catalog, and every
      # benchmark entry silently loses its "Circuit structure" and "Fault-tolerant
      # cost" sections — a page that returns 200, renders, and is missing content
      # nobody would think to count. Found by diffing heading counts against
      # production (`scripts/compare-web-stacks.mjs`), not by reading a config.
      #
      # Note that --set-env-vars REPLACES the whole set, so a value added by hand
      # with `gcloud run services update` is wiped by the next deploy. That is why
      # it belongs here rather than on the service.
      #
      # ## Two secrets, and the one that is NOT the obvious one
      #
      # SENTRY_DSN comes from WEB_SENTRY_DSN, not from the secret called
      # SENTRY_DSN. They are different Sentry projects: the one named SENTRY_DSN
      # holds the PYTHON dsn the api and worker use (Sentry project
      # ...8593979392), and the website's own is ...1999164416. Reusing the
      # obvious name would have sent every website error into the api's project —
      # no failure, no warning, just errors filed under the wrong service.
      # Confirmed by hashing both against leona-secrets/observability.env rather
      # than by reading the names.
      #
      # MAJORANA_TRUSTED_CALLER_TOKEN is what stops this renderer's server-side
      # catalog fetches being metered on the shared anonymous bucket. PLAN.md
      # listed a fixed egress IP via Cloud NAT as the answer to that and graded it
      # "hard (subtle)"; the token already exists and identifies the caller
      # directly, so the NAT is not needed for this.
      #
      # LEONA_DEPLOY_ENV is set at RUNTIME as well as at build time because
      # lib/lab-direction.ts and lib/public-demo.ts read it per request.
      #
      # ## Composed once, used twice
      #
      # The twin's smoke test is only evidence about majorana-web if the two run
      # the same settings. So the strings are built here, once, and both deploys
      # below read them; there is no second copy to keep in step.
      #
      # Secret names carry a WEB_ prefix (see the SENTRY_DSN note above for what
      # an unqualified name costs). WEB_DEVELOPER_EMAILS and WEB_CONTACT_FALLBACK
      # are addresses rather than secrets, and live in Secret Manager to stay out
      # of a public workflow file; production on Vercel set both, and without
      # them developer accounts resolve to the free tier and the contact form
      # offers no way through. infra/web-lb/06-sign-in-secrets.sh creates them.
      #
      # WEB_SIGN_IN (infra/fleet.env) is explicit rather than "on if the secret
      # exists": a deploy that quietly configures itself from whatever is lying
      # in Secret Manager is a deploy nobody reviewed. At 1 a missing secret
      # fails the deploy, loudly, before anybody is served the revision.
      - name: compose the runtime settings
        if: steps.creds.outputs.have == 'true'
        run: |
          vars="LEONA_DEPLOY_ENV=production,LEONA_XFF_TRUSTED_HOPS=${WEB_XFF_TRUSTED_HOPS},LEONA_GIT_COMMIT_SHA=${{ github.sha }},MAJORANA_ENV=production,MAJORANA_PUBLIC_CATALOG_API=true"
          secrets="SENTRY_DSN=WEB_SENTRY_DSN:latest,MAJORANA_TRUSTED_CALLER_TOKEN=TRUSTED_CALLER_TOKEN:latest,LEONA_DEVELOPER_EMAILS=WEB_DEVELOPER_EMAILS:latest,CONTACT_FALLBACK=WEB_CONTACT_FALLBACK:latest"
          if [ "$WEB_SIGN_IN" = "1" ]; then
            vars="${vars},WORKOS_CLIENT_ID=${WORKOS_CLIENT_ID},WORKOS_REDIRECT_URI=${WORKOS_REDIRECT_URI}"
            secrets="${secrets},WORKOS_API_KEY=WEB_WORKOS_API_KEY:latest,WORKOS_COOKIE_PASSWORD=WEB_WORKOS_COOKIE_PASSWORD:latest"
          else
            echo "::error::WEB_SIGN_IN=0 in infra/fleet.env — this revision could not sign anybody in, and it would serve leonaqt.com. Not deploying it."
            exit 1
          fi
          {
            echo "WEB_ENV_VARS=${vars}"
            echo "WEB_SECRETS=${secrets}"
            echo "WEB_IMAGE=us-west1-docker.pkg.dev/${GCP_PROJECT}/majorana/web:${{ steps.tag.outputs.tag }}"
          } >> "$GITHUB_ENV"

      # Private, IAM-gated, never public: --no-allow-unauthenticated is right on
      # THIS service and wrong on majorana-web (see the header).
      - name: deploy the twin
        id: twin
        if: steps.creds.outputs.have == 'true'
        run: |
          gcloud run deploy "$VERIFY_SERVICE" \
            --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --image "$WEB_IMAGE" \
            --no-allow-unauthenticated --ingress all \
            --service-account "$RUNTIME_SA" \
            --port 8080 --min-instances 0 --max-instances 2 \
            --set-env-vars "$WEB_ENV_VARS" \
            --set-secrets "$WEB_SECRETS" \
            --set-custom-audiences "$VERIFY_AUDIENCE"
          url=$(gcloud run services describe "$VERIFY_SERVICE" \
            --project "$GCP_PROJECT" --region "$GCP_REGION" --format='value(status.url)')
          [ -n "$url" ] || { echo "::error::no URL for ${VERIFY_SERVICE}"; exit 1; }
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "twin at ${url}"

      - id: idtoken
        name: identity token for the private service
        if: steps.creds.outputs.have == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: majorana-web-verify
          id_token_include_email: true

      # Every assertion here is one the 2026-08-14 and 2026-08-16 incidents
      # taught: a deployment record existing is not a page rendering, and one
      # route rendering is not every kind of route rendering. `/repository` and
      # the 404 page are named individually because each has 500'd in production
      # while every other signal was green.
      - name: smoke-test the twin
        if: steps.creds.outputs.have == 'true'
        env:
          URL: ${{ steps.twin.outputs.url }}
          TOKEN: ${{ steps.idtoken.outputs.id_token }}
        run: |
          fail=0
          probe() { # path expected-status [grep-pattern]
            body=$(mktemp)
            code=$(curl -sS --max-time 45 -o "$body" -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" "${URL}$1")
            if [ "$code" != "$2" ]; then
              echo "::error::$1 returned ${code}, expected $2"
              fail=1
            elif [ -n "${3:-}" ] && ! grep -q "$3" "$body"; then
              echo "::error::$1 returned $2 but did not contain '$3' — it rendered the wrong thing"
              fail=1
            else
              echo "ok  $1 -> ${code} ($(wc -c < "$body") bytes)"
            fi
            rm -f "$body"
          }
          probe / 200 '<title>'
          probe /repository 200 '<title>'
          probe /pricing 200 '<title>'
          probe /this-route-does-not-exist 404 '<title>'
          # A RECORD PAGE, and its negative control. Per-request, uncached, and it
          # reads the session — the one kind of route that returned 500 for an
          # hour on 2026-08-16 while every prerendered page above was fine
          # (scripts/check-live-pages.mjs has the account). That script asks the
          # same two questions of the public name after the shift, but since
          # 2026-09-20 Cloudflare's Bot Fight Mode challenges a GitHub runner
          # there (measured: 4 of 4 requests, 403 cf-mitigated: challenge), so
          # here, before anybody is served, is the only place a runner can ask.
          probe /repository/bell-state-qiskit 200 '<title>'
          probe /repository/a-slug-this-corpus-will-never-publish 404 '<title>'
          probe /opengraph-image 200 ''
          # The locale cookie is leona.locale.v2 (lib/public-locale.ts). Sending
          # the wrong cookie name renders English and passes a lang="en" check,
          # which is indistinguishable from the rewrite being broken — so the
          # assertion is on lang="ja" and the cookie name comes from that file.
          ja=$(mktemp)
          code=$(curl -sS --max-time 45 -o "$ja" -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" -H 'Cookie: leona.locale.v2=ja' "${URL}/")
          if [ "$code" != "200" ] || ! grep -q 'lang="ja"' "$ja"; then
            echo "::error::the Japanese locale rewrite did not render (status ${code})"
            fail=1
          else
            echo "ok  / with leona.locale.v2=ja -> lang=\"ja\""
          fi
          rm -f "$ja"
          # Sign-in, asserted because of how it failed on 2026-09-17: with the
          # WorkOS settings mounted, the five probes above split — the three
          # prerendered pages were 200 and everything that runs the AuthKit
          # middleware was 500, because NEXT_PUBLIC_WORKOS_REDIRECT_URI is inlined
          # at BUILD time and the image had been built without it. A redirect to
          # WorkOS carrying our client id is the smallest thing that proves the
          # build argument, the four runtime values and the secret mounts at once.
          if [ "$WEB_SIGN_IN" = "1" ]; then
            loc=$(curl -sS --max-time 45 -o /dev/null -w '%{http_code} %{redirect_url}' \
              -H "Authorization: Bearer ${TOKEN}" "${URL}/auth/sign-in")
            case "$loc" in
              "307 https://api.workos.com/"*"client_id=${WORKOS_CLIENT_ID}"*"redirect_uri=https%3A%2F%2Fleonaqt.com%2Fauth%2Fcallback"*)
                echo "ok  /auth/sign-in -> WorkOS, with production's client id and callback" ;;
              *) echo "::error::/auth/sign-in did not redirect to WorkOS as production does: ${loc%%\?*}"
                 fail=1 ;;
            esac
          fi
          # The contact form's only working path today is the mailto fallback
          # (ai-ops 146 is open); unset, the form offers nothing and says nothing.
          contact=$(curl -sS --max-time 45 -H "Authorization: Bearer ${TOKEN}" "${URL}/api/contact")
          if jq -e '(.configured == true) or ((.mailto // "") | startswith("mailto:"))' <<<"$contact" >/dev/null 2>&1; then
            echo "ok  /api/contact offers a way through"
          else
            echo "::error::/api/contact is neither configured nor offering a mailto fallback"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1

      # No --allow-unauthenticated flag in either direction: see the header. What
      # IS asserted on every deploy is the ingress restriction, so there is no
      # deploy after which this service is reachable around Cloudflare.
      #
      # --no-traffic, then the shift below: a revision whose container cannot
      # start fails HERE, with the previous revision still serving everybody.
      #
      # TWO services from one image since 2026-09-24: `majorana-web` serves
      # everything except the Atlas, and `majorana-web-atlas` serves
      # `/repository*` (the url map routes by path — infra/web-lb/25-atlas-bulkhead.sh).
      # One service capped at four instances was a single capacity pool for the
      # whole site, and an Atlas crawler used all of it: Cloud Run refused ~83%
      # of every request, the home page included, for eight hours
      # (ai-ops/desk/leona/plans/incidents/2026-09-24-gcp-web-429.md). Both get
      # the same image, identity and settings, and differ only in sizing, which
      # comes from infra/fleet.env. The atlas service must already exist — it is
      # created by 25-atlas-bulkhead.sh with ingress restricted from birth, and
      # `--no-traffic` cannot create a service — so its absence fails the run
      # rather than letting this step invent one with defaults.
      - name: deploy majorana-web and majorana-web-atlas (no traffic)
        id: dark
        if: steps.creds.outputs.have == 'true'
        run: |
          serving() { # <service>
            gcloud run services describe "$1" \
              --project "$GCP_PROJECT" --region "$GCP_REGION" --format=json \
              | jq -r '[.status.traffic[] | select((.percent // 0) > 0) | .revisionName] | first // ""'
          }
          gcloud run services describe "$ATLAS_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --format='value(metadata.name)' >/dev/null 2>&1 || {
            echo "::error::${ATLAS_SERVICE} does not exist. Run infra/web-lb/25-atlas-bulkhead.sh (it creates it with ingress restricted), then re-run this workflow."
            exit 1
          }
          previous=$(serving "$SERVICE")
          previous_atlas=$(serving "$ATLAS_SERVICE")
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          echo "previous_atlas=${previous_atlas}" >> "$GITHUB_OUTPUT"

          deploy_dark() { # <service> <min> <max> <concurrency>
            gcloud run deploy "$1" \
              --project "$GCP_PROJECT" --region "$GCP_REGION" \
              --image "$WEB_IMAGE" \
              --ingress internal-and-cloud-load-balancing \
              --service-account "$RUNTIME_SA" \
              --port 8080 \
              --min-instances "$2" \
              --max-instances "$3" \
              --concurrency "$4" \
              --set-env-vars "$WEB_ENV_VARS" \
              --set-secrets "$WEB_SECRETS" \
              --no-traffic
          }
          deploy_dark "$SERVICE" "$WEB_MIN_INSTANCES" "$WEB_MAX_INSTANCES" "$WEB_CONCURRENCY"
          deploy_dark "$ATLAS_SERVICE" "$WEB_ATLAS_MIN_INSTANCES" "$WEB_ATLAS_MAX_INSTANCES" "$WEB_ATLAS_CONCURRENCY"
          echo "deployed dark; previously serving: ${previous:-<none>} / ${previous_atlas:-<none>}"

      # Both shifts back to back, so the window in which the two services serve
      # different builds (and a page from one asks the other for a chunk it
      # does not have) is two API calls long rather than a whole deploy.
      - name: shift web traffic
        if: steps.creds.outputs.have == 'true'
        run: |
          for svc in "$SERVICE" "$ATLAS_SERVICE"; do
            gcloud run services update-traffic "$svc" \
              --project "$GCP_PROJECT" --region "$GCP_REGION" --to-latest
          done

      # The shift is the only step between a revision that served nobody and one
      # that serves everybody, so it gets its own readback rather than being
      # trusted because the command exited 0.
      #
      # Read from the control plane, because there is no data-plane route from a
      # runner any more: the run.app URL refuses by ingress and the load balancer
      # refuses by origin lock. What a visitor meets is verify-web-cache.yml's
      # question, asked through the public name once this run completes.
      #
      # The second assertion is the dangerous pair, checked where it would be
      # created: a service that is public AND reachable directly is the whole
      # site with no Cloudflare, no rate limit and no origin lock in front of it.
      # The third is the one that makes the bulkhead a bulkhead: both services
      # must be serving the same image, or a page from one references chunks
      # the other cannot serve.
      - name: the shifted revisions are the ones serving
        if: steps.creds.outputs.have == 'true'
        run: |
          fail=0
          images=""
          for svc in "$SERVICE" "$ATLAS_SERVICE"; do
            json=$(gcloud run services describe "$svc" \
              --project "$GCP_PROJECT" --region "$GCP_REGION" --format=json)
            serving=$(jq -r '[.status.traffic[] | select((.percent // 0) > 0) | .revisionName] | first // ""' <<<"$json")
            latest=$(jq -r '.status.latestCreatedRevisionName // ""' <<<"$json")
            if [ -z "$latest" ] || [ "$serving" != "$latest" ]; then
              echo "::error::${svc}: traffic is on ${serving:-<none>}, not the revision just built (${latest:-<none>})"
              fail=1
            fi
            ingress=$(jq -r '.metadata.annotations["run.googleapis.com/ingress"] // ""' <<<"$json")
            public=$(gcloud run services get-iam-policy "$svc" \
              --project "$GCP_PROJECT" --region "$GCP_REGION" --format=json \
              | jq -r '[.bindings[]? | select(.role=="roles/run.invoker") | .members[]] | map(select(.=="allUsers" or .=="allAuthenticatedUsers")) | length')
            if [ "$public" != "0" ] && [ "$ingress" != "internal-and-cloud-load-balancing" ]; then
              echo "::error::${svc} is public with ingress '${ingress}' — it is reachable around Cloudflare. Restrict ingress NOW: infra/web-lb/40-serve.sh"
              fail=1
            fi
            image=$(jq -r '.spec.template.spec.containers[0].image // ""' <<<"$json")
            images="${images}${image}"$'\n'
            echo "${svc}: serving ${latest}; ingress ${ingress}; public through the load balancer: $([ "$public" != "0" ] && echo yes || echo 'not yet'); image ${image##*/}"
          done
          if [ "$(printf '%s' "$images" | grep -c . )" -ne 2 ] || [ "$(printf '%s' "$images" | sort -u | grep -c .)" -ne 1 ]; then
            echo "::error::the two web services are not on one image:"; printf '%s' "$images"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1

      - name: roll web traffic back on failure
        if: failure() && steps.creds.outputs.have == 'true' && (steps.dark.outputs.previous != '' || steps.dark.outputs.previous_atlas != '')
        run: |
          rollback() { # <service> <revision>
            [ -n "$2" ] || return 0
            echo "::warning::rolling ${1} back to ${2}"
            gcloud run services update-traffic "$1" \
              --project "$GCP_PROJECT" --region "$GCP_REGION" \
              --to-revisions "${2}=100"
          }
          rollback "$SERVICE" "${{ steps.dark.outputs.previous }}"
          rollback "$ATLAS_SERVICE" "${{ steps.dark.outputs.previous_atlas }}"
