# Deploy the website to Cloud Run.
#
# ## What this is, and what still runs beside it
#
# GCP migration phase 2 (ai-ops `desk/leona/plans/gcp-migration-20260912/PLAN.md`).
# Vercel still builds and serves leonaqt.com; this builds and serves the same
# commit on Cloud Run so the two can be compared before DNS moves, and so the
# cutover is a DNS change rather than a first deploy. Both stacks run through the
# cutover and its 30-day rollback window — that is deliberate, and it is why
# nothing here removes a Vercel workflow.
#
# ## The shape is deploy.yml's, on purpose
#
# Dark revision -> smoke-test the dark revision -> shift traffic, the same
# sequence the api has used since July, because the failure it prevents is the
# same one: a revision that builds, deploys, and cannot serve. A web deploy that
# only checked "did a deployment record appear" is exactly what was in place on
# 2026-08-14 when a silent Vercel failure went unnoticed, and what
# web-deploy-watch.yml exists to catch after the fact.
#
# ## Reaching a private service from CI
#
# majorana-web takes no unauthenticated traffic. `verify---majorana-web-*.run.app`
# — the dark revision's own URL — is a different host from the service URL, so an
# identity token minted for one is rejected by the other. The service carries the
# custom audience `majorana-web` so a single token opens both; `id_token_audience`
# below is that string and not a URL for that reason. Confirmed 2026-09-16 with a
# real request to each host, not inferred.
name: deploy-web

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-web-cloud-run
  cancel-in-progress: false

env:
  GCP_PROJECT: majorana-core
  GCP_REGION: us-west1
  SERVICE: majorana-web
  CUSTOM_AUDIENCE: majorana-web

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }

      # The same script Vercel's Ignored Build Step runs, and the same one
      # web-deploy-watch.yml reuses to decide whether a build was owed. A second
      # copy of "does the web app build from this path" would drift from the
      # first, and the drifted copy would read as current. Exit 0 means SKIP.
      #
      # Note what this does NOT test: the list is a blacklist of paths the web
      # app does not build from, named individually, so a package added later is
      # unrecognised and therefore BUILDS. "Python-only, so skip" is not the rule
      # and guessing it will mislead you — packages/py/notebooks postdates the
      # list and triggers a full build.
      - name: should this commit deploy the web app
        id: expect
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "expected=yes" >> "$GITHUB_OUTPUT"
            echo "manual run: deploying regardless of changed paths"
            exit 0
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "expected=yes" >> "$GITHUB_OUTPUT"
            echo "no usable base sha: deploying"
            exit 0
          fi
          if VERCEL_GIT_PREVIOUS_SHA="$BEFORE" VERCEL_GIT_COMMIT_SHA="${{ github.sha }}" \
               bash scripts/vercel-ignore-build.sh; then
            echo "expected=no" >> "$GITHUB_OUTPUT"
            echo "SKIP: nothing the web app builds from changed"
          else
            echo "expected=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: load web sizing
        if: steps.expect.outputs.expected == 'yes'
        run: |
          for key in WEB_MIN_INSTANCES WEB_MAX_INSTANCES WEB_XFF_TRUSTED_HOPS; do
            grep -qE "^${key}=[0-9]+$" infra/fleet.env || {
              echo "::error::${key} is missing from infra/fleet.env or is not a plain integer"
              exit 1
            }
          done
          grep -E '^WEB_[A-Z_]+=[0-9]+$' infra/fleet.env >> "$GITHUB_ENV"

      - name: check deploy credentials
        id: creds
        if: steps.expect.outputs.expected == 'yes'
        run: echo "have=${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.expect.outputs.expected == 'yes' && steps.creds.outputs.have != 'true'
        run: |
          echo "::warning::GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_DEPLOY_SERVICE_ACCOUNT not set —"
          echo "::warning::the web app was NOT deployed to Cloud Run. Vercel is unaffected."
          echo "::warning::Deploy by hand: docs/runbooks/web-cloud-run.md"

      - name: tag
        id: tag
        if: steps.creds.outputs.have == 'true'
        run: echo "tag=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.creds.outputs.have == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: steps.creds.outputs.have == 'true'

      # NEXT_PUBLIC_* and the CSP are baked into the bundle by `next build`, so
      # they are build args in cloudbuild.web.yaml rather than service settings.
      # Changing one of those means a rebuild, not a `run services update`.
      - name: build image
        if: steps.creds.outputs.have == 'true'
        run: |
          gcloud builds submit --config cloudbuild.web.yaml \
            --ignore-file=.gcloudignore.web \
            --substitutions=_TAG="${{ steps.tag.outputs.tag }}",_SHA="${{ github.sha }}" \
            --project "$GCP_PROJECT" --region "$GCP_REGION" .

      # --no-traffic --tag verify: the revision is reachable at its own hostname
      # and serves nobody until the shift step below. LEONA_DEPLOY_ENV is set at
      # RUNTIME as well as at build time because lib/lab-direction.ts and
      # lib/public-demo.ts read it per request.
      - name: deploy web (no traffic)
        id: dark
        if: steps.creds.outputs.have == 'true'
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --image "us-west1-docker.pkg.dev/${GCP_PROJECT}/majorana/web:${{ steps.tag.outputs.tag }}" \
            --no-allow-unauthenticated \
            --port 8080 \
            --min-instances "$WEB_MIN_INSTANCES" \
            --max-instances "$WEB_MAX_INSTANCES" \
            --set-env-vars "LEONA_DEPLOY_ENV=production,LEONA_XFF_TRUSTED_HOPS=${WEB_XFF_TRUSTED_HOPS},LEONA_GIT_COMMIT_SHA=${{ github.sha }}" \
            --no-traffic --tag verify

          previous=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT" --region "$GCP_REGION" --format=json \
            | jq -r '[.status.traffic[] | select((.percent // 0) > 0) | .revisionName] | first // ""')
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

          url=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT" --region "$GCP_REGION" --format=json \
            | jq -r '.status.traffic[] | select(.tag=="verify") | .url')
          [ -n "$url" ] || { echo "::error::no URL for the verify tag"; exit 1; }
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "dark revision at ${url}, previously serving: ${previous:-<none>}"

      - id: idtoken
        name: identity token for the private service
        if: steps.creds.outputs.have == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: majorana-web
          id_token_include_email: true

      # Every assertion here is one the 2026-08-14 and 2026-08-16 incidents
      # taught: a deployment record existing is not a page rendering, and one
      # route rendering is not every kind of route rendering. `/repository` and
      # the 404 page are named individually because each has 500'd in production
      # while every other signal was green.
      - name: smoke-test the dark revision
        if: steps.creds.outputs.have == 'true'
        env:
          URL: ${{ steps.dark.outputs.url }}
          TOKEN: ${{ steps.idtoken.outputs.id_token }}
        run: |
          fail=0
          probe() { # path expected-status [grep-pattern]
            body=$(mktemp)
            code=$(curl -sS --max-time 45 -o "$body" -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" "${URL}$1")
            if [ "$code" != "$2" ]; then
              echo "::error::$1 returned ${code}, expected $2"
              fail=1
            elif [ -n "${3:-}" ] && ! grep -q "$3" "$body"; then
              echo "::error::$1 returned $2 but did not contain '$3' — it rendered the wrong thing"
              fail=1
            else
              echo "ok  $1 -> ${code} ($(wc -c < "$body") bytes)"
            fi
            rm -f "$body"
          }
          probe / 200 '<title>'
          probe /repository 200 '<title>'
          probe /pricing 200 '<title>'
          probe /this-route-does-not-exist 404 '<title>'
          probe /opengraph-image 200 ''
          # The locale cookie is leona.locale.v2 (lib/public-locale.ts). Sending
          # the wrong cookie name renders English and passes a lang="en" check,
          # which is indistinguishable from the rewrite being broken — so the
          # assertion is on lang="ja" and the cookie name comes from that file.
          ja=$(mktemp)
          code=$(curl -sS --max-time 45 -o "$ja" -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" -H 'Cookie: leona.locale.v2=ja' "${URL}/")
          if [ "$code" != "200" ] || ! grep -q 'lang="ja"' "$ja"; then
            echo "::error::the Japanese locale rewrite did not render (status ${code})"
            fail=1
          else
            echo "ok  / with leona.locale.v2=ja -> lang=\"ja\""
          fi
          rm -f "$ja"
          [ "$fail" -eq 0 ] || exit 1

      - name: shift web traffic
        if: steps.creds.outputs.have == 'true'
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project "$GCP_PROJECT" --region "$GCP_REGION" --to-latest

      # The shift is the only step between a revision that served nobody and one
      # that serves everybody, so it gets its own readback rather than being
      # trusted because the command exited 0.
      - name: the shifted revision is the one serving
        if: steps.creds.outputs.have == 'true'
        env:
          TOKEN: ${{ steps.idtoken.outputs.id_token }}
        run: |
          serving=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT" --region "$GCP_REGION" --format=json \
            | jq -r '[.status.traffic[] | select((.percent // 0) > 0) | .revisionName] | first // ""')
          latest=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT" --region "$GCP_REGION" --format='value(status.latestCreatedRevisionName)')
          if [ "$serving" != "$latest" ]; then
            echo "::error::traffic is on ${serving:-<none>}, not the revision just built (${latest})"
            exit 1
          fi
          url=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT" --region "$GCP_REGION" --format='value(status.url)')
          code=$(curl -sS --max-time 45 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" "${url}/")
          [ "$code" = "200" ] || { echo "::error::the service URL returned ${code} after the shift"; exit 1; }
          echo "serving ${latest} at ${url}"

      - name: roll web traffic back on failure
        if: failure() && steps.creds.outputs.have == 'true' && steps.dark.outputs.previous != ''
        run: |
          echo "::warning::rolling traffic back to ${{ steps.dark.outputs.previous }}"
          gcloud run services update-traffic "$SERVICE" \
            --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --to-revisions "${{ steps.dark.outputs.previous }}=100"
