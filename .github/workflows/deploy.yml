# Deploys the api + worker Cloud Run services on every merge to `dev`.
#
# Web self-deploys via Vercel (ADR-0011); api and worker did not, and the gap
# caused three separate incidents — most recently a worker crash-looping against
# a constraint from a migration its image predated, which Cloud Run reports as a
# perfectly healthy service. This workflow is the deterministic replacement for
# the "remember to redeploy after a migration" rule in docs/runbooks/deploys.md.
#
# It also applies the migration itself (`migrate database`, below), added
# 2026-07-20 after #91 shipped code to production against the previous schema.
# Schema first, then rollout — so a migration that fails deploys nothing.
#
# Workload Identity Federation and the two repo secrets were provisioned
# 2026-07-19 (docs/runbooks/deploys.md § Automated deploy — how auth is wired).
# The credential check below is kept as a guard: if the secrets are ever cleared
# or the WIF pool is deleted, this logs why it skipped rather than failing every
# merge with an opaque auth error.
#
# Auth is scoped to refs/heads/dev by the provider's attribute condition, so
# workflow_dispatch works only from `dev`.
name: deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

# One deploy at a time; a newer merge waits rather than racing an older image
# into production. Never cancel in progress — a half-shifted traffic split is
# worse than a queued deploy.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  GCP_PROJECT: majorana-core
  GCP_REGION: us-west1
  IMAGE_REPO: us-west1-docker.pkg.dev/majorana-core/majorana/api
  # The production database since 2026-07-27. Both Cloud Run services mount it
  # as a Unix socket; this workflow reaches it through the Auth Proxy.
  CLOUDSQL_INSTANCE: majorana-core:us-west1:majorana-pg

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Load infra/fleet.env into the job environment so every `gcloud run
      # deploy` below passes the numbers from that file rather than a literal
      # copied beside it. The whole point of the file is that changing the
      # worker count is ONE edit; a literal here would quietly make it two, and
      # the second one is the one people forget.
      #
      # Filtered to KEY=INTEGER lines on purpose: $GITHUB_ENV rejects a comment
      # line, and fleet.env is mostly comments — the reasoning for each number is
      # the part worth keeping next to it.
      #
      # The keys are checked before they are exported, not after. An unmatched
      # line does not fail the grep — it just does not export — and the failure
      # then lands as `--min-instances ""` or `DB_POOL_SIZE=` further down, where
      # gcloud reads it as "clear this setting" and ships a revision nobody sized.
      - name: load fleet sizing
        run: |
          for key in WORKER_INSTANCES WORKER_POOL_SIZE WORKER_MAX_OVERFLOW API_MAX_INSTANCES API_CPU API_MEMORY_MI API_CONCURRENCY; do
            grep -qE "^${key}=[0-9]+$" infra/fleet.env || {
              echo "::error::${key} is missing from infra/fleet.env or is not a plain integer"
              exit 1
            }
          done
          grep -E '^[A-Z_]+=[0-9]+$' infra/fleet.env >> "$GITHUB_ENV"

      - name: check deploy credentials
        id: creds
        run: echo "have=${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.creds.outputs.have != 'true'
        run: |
          echo "::warning::GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_DEPLOY_SERVICE_ACCOUNT not set —"
          echo "::warning::api + worker were NOT deployed. Deploy by hand (docs/runbooks/deploys.md)"
          echo "::warning::or complete the one-time setup in that runbook (owner action)."

      - name: tag
        if: steps.creds.outputs.have == 'true'
        id: tag
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # token_format: access_token was added 2026-07-19 to fix the "user is
      # forbidden from accessing the bucket [majorana-core_cloudbuild]" failure.
      # It did NOT fix it — the run after this change failed identically. The
      # actual cause was an IAM gap: `gcloud builds submit` runs an anti-squatting
      # ownership check that calls buckets.List at *project* scope, and the deploy
      # SA held only bucket-scoped roles. Fixed by the custom project role
      # `cloudbuildStagingLister` (storage.buckets.list), not by anything here.
      #
      # The line is kept because it is harmless and the deploy is green with it,
      # but it is unproven, not load-bearing. If you are trimming this workflow,
      # this is a safe thing to try removing — just watch the run.
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        if: steps.creds.outputs.have == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: steps.creds.outputs.have == 'true'

      # Python toolchain, needed only by the migrate step below. Mirrors ci.yml's
      # `db` job so the two run alembic through an identical uv environment.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: steps.creds.outputs.have == 'true'
        with:
          python-version: "3.12"

      - name: install python packages
        if: steps.creds.outputs.have == 'true'
        run: uv sync --all-packages --frozen

      # Apply the schema BEFORE anything is built or rolled out.
      #
      # This step is why the workflow's uv toolchain exists. Until 2026-07-20
      # nothing applied migrations to production — `alembic upgrade head` ran only
      # in ci.yml and bench.yml, against throwaway databases — so merging a PR that
      # carried a migration deployed the code and left the schema behind. #91 did
      # exactly that: new code writing mode='auto' went live against revision 0019,
      # whose ck_mode_enum rejects that value, and every run would have 500'd.
      #
      # Running first (before `build image`) means a migration failure costs a
      # Cloud Build run of nothing and touches neither Cloud Run service. The
      # rollback step below is irrelevant to this step for the same reason:
      # at this point nothing has been deployed to roll back.
      #
      # Because the schema lands before the new image does, every migration must
      # still be readable by the *currently running* revision for the length of the
      # deploy — expand now, contract in a later release. A migration that drops or
      # renames something the live code still uses will break production in the
      # window between this step and the traffic shift.
      #
      # Production moved to Cloud SQL on 2026-07-27, and that instance has NO
      # authorized networks — nothing reaches it by IP, from a GitHub runner or
      # anywhere else. The Cloud SQL Auth Proxy is the only way in: it
      # authenticates as the deploy service account (roles/cloudsql.client) over
      # the Admin API and forwards a local port.
      #
      # Pinned to an exact version AND an exact SHA-256, checked before the file
      # is made executable. This step puts a binary on a runner that holds a
      # credential able to deploy production, so "latest" would mean trusting
      # whatever that URL serves on the day it runs.
      #
      # What the hash does and does not buy: it was taken from two independent
      # downloads of v2.24.1 on 2026-07-27 (36,553,843 bytes, a statically
      # linked x86-64 ELF). Google publishes no .sha256 sidecar at this path, so
      # this pins the artifact against future change — it is not an independent
      # attestation of what Google built. Bump both fields together, never one.
      - name: start the Cloud SQL Auth Proxy
        if: steps.creds.outputs.have == 'true'
        env:
          PROXY_VERSION: v2.24.1
          PROXY_SHA256: fae2766aac9d614a2bdef2f2a7778f3d054f3acd5ff07a81a9e300bd471512eb
        run: |
          curl -fsSL -o cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          echo "${PROXY_SHA256}  cloud-sql-proxy" | sha256sum -c - || {
            echo "::error::the Cloud SQL Auth Proxy binary does not match its pinned"
            echo "::error::SHA-256. Do NOT update the hash to make this pass without"
            echo "::error::establishing why the artifact changed."
            exit 1
          }
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 --health-check --http-address 127.0.0.1 \
            "$CLOUDSQL_INSTANCE" &
          # The proxy answers /startup only once it is ready to accept
          # connections. Polling it beats `sleep 5`: a slow start would otherwise
          # fail the migration with a connection error that reads like a broken
          # database.
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9090/startup >/dev/null 2>&1; then
              echo "proxy ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the Cloud SQL Auth Proxy never became ready; the migration"
          echo "::error::below cannot reach the database. See docs/runbooks/database.md."
          exit 1

      # DATABASE_URL_SECRET is the Secret Manager entry name; DATABASE_URL_DIRECT is
      # the env var alembic reads (db/migrations/env.py). Since the Cloud SQL move
      # it holds a 127.0.0.1:5432 URL that resolves through the proxy started
      # above — a TCP connection straight to Postgres, with no PgBouncer in front
      # of it, which is what DDL needs.
      - name: migrate database
        if: steps.creds.outputs.have == 'true'
        run: |
          # stderr goes to a file, not into db_url: a gcloud warning on the happy
          # path would otherwise be concatenated into the connection string.
          if ! db_url=$(gcloud secrets versions access latest \
            --secret=DATABASE_URL_SECRET --project "$GCP_PROJECT" 2>/tmp/secret.err); then
            echo "::error::could not read DATABASE_URL_SECRET: $(cat /tmp/secret.err)"
            echo "::error::if this is a permission error, the deploy service account needs"
            echo "::error::roles/secretmanager.secretAccessor on that secret — see"
            echo "::error::docs/runbooks/deploys.md § Automated deploy for the exact grant."
            exit 1
          fi
          test -n "$db_url" || { echo "::error::DATABASE_URL_SECRET is empty"; exit 1; }
          echo "::add-mask::$db_url"
          export DATABASE_URL_DIRECT="$db_url"
          echo "schema before: $(uv run --package majorana-api \
            alembic -c db/alembic.ini current 2>&1 | tail -1)"
          uv run --package majorana-api alembic -c db/alembic.ini upgrade head
          echo "schema after:  $(uv run --package majorana-api \
            alembic -c db/alembic.ini current 2>&1 | tail -1)"

      # One image serves both services; the entrypoint differs. .gcloudignore keeps
      # the upload to what the Dockerfile actually copies (~4 MiB rather than 732 MB
      # of apps/node_modules). The checkout is already a clean tree of this commit,
      # so the runbook's git-worktree dance is unnecessary here.
      - name: build image
        if: steps.creds.outputs.have == 'true'
        run: |
          gcloud builds submit --config cloudbuild.api.yaml \
            --substitutions=_TAG="${{ steps.tag.outputs.tag }}" \
            --project "$GCP_PROJECT" --region "$GCP_REGION"

      # Never point traffic at an unverified revision: deploy dark under a tag,
      # smoke-test the tag URL, then shift.
      - name: deploy api (no traffic)
        if: steps.creds.outputs.have == 'true'
        id: api
        run: |
          # --max-instances is stated for the same reason the worker's scaling
          # flags are: the connection budget in docs/runbooks/database.md is only
          # arithmetic if every term in it is pinned somewhere a reader can find.
          # It comes from infra/fleet.env via the "load fleet sizing" step above,
          # which is also where db.py reads it for that budget — one number, not
          # two that have to be kept equal.
          #
          # --cpu / --memory / --concurrency are new as of infra/pin-api-cloud-run-shape
          # (2026-08-14). Before this, the API's per-instance shape was NOT
          # declared anywhere in the repo: this command never passed those
          # flags, so `gcloud run deploy --image` silently preserved whatever
          # the previous revision had, and the real numbers lived only in
          # whichever manual `gcloud` invocation last touched the service.
          # Pinned here from the live values read via `gcloud run services
          # describe majorana-api`: 1 vCPU, 512Mi, concurrency 80 — see
          # infra/fleet.env for the per-key reasoning.
          #
          # --min-instances is deliberately still absent. Production scales to
          # zero today — no min-instances has ever been set on this service —
          # and this is a pin-what's-live change, not a behaviour change; see
          # the PR that introduced this comment for a minScale recommendation.
          #
          # --cpu-boost is the last piece of this service's per-instance shape
          # that was live and undeclared: `run.googleapis.com/startup-cpu-boost:
          # 'true'` is set on the running revision and appears nowhere in this
          # repo. It is a boolean, so it has no place in infra/fleet.env (the
          # loader takes KEY=INTEGER only) and is stated here instead. It
          # matters more on this service than on most: with no min-instances the
          # API scales to zero, so a burst arriving at an idle service pays a
          # cold start, and the boost is what keeps that start from being the
          # slowest request anyone sees. Verified live, 2026-08-14, alongside the
          # cpu/memory/concurrency values above.
          #
          # --update-env-vars, never --set-env-vars: neither service's env is
          # fully declared here yet (DATABASE_URL and the MAJORANA_* runtime
          # settings are live-service state), so --set would wipe them and the
          # revision would come up unable to reach the database.
          gcloud run deploy majorana-api --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --image "$IMAGE_REPO:${{ steps.tag.outputs.tag }}" \
            --set-cloudsql-instances "$CLOUDSQL_INSTANCE" \
            --max-instances "$API_MAX_INSTANCES" \
            --cpu "$API_CPU" --memory "${API_MEMORY_MI}Mi" --concurrency "$API_CONCURRENCY" \
            --cpu-boost \
            --update-env-vars MAJORANA_SERVICE=api \
            --no-traffic --tag verify
          # Parse the URL out with jq rather than a --format projection. Two
          # earlier attempts failed here (2026-07-19):
          #   .filter(tag:verify).extract(url) emits a Python list repr,
          #     ['https://...'], and `tr -d '[]'` left the single quotes behind, so
          #     curl got a quoted URL and rejected it without sending a request.
          #   --filter is not accepted by `describe` at all — it is a list-command
          #     flag, so the step died with "unrecognized arguments".
          # jq on the JSON output returns a bare string and is checked by the
          # `test -n` below. jq is already a dependency of the smoke-test step.
          url=$(gcloud run services describe majorana-api \
            --project "$GCP_PROJECT" --region "$GCP_REGION" --format=json \
            | jq -r '.status.traffic[] | select(.tag=="verify") | .url')
          test -n "$url" || { echo "no verify tag URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: smoke-test the dark revision
        if: steps.creds.outputs.have == 'true'
        run: |
          url="${{ steps.api.outputs.url }}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$url/health")
          test "$code" = "200" || { echo "health returned $code"; exit 1; }
          # Auth must still be closed: an unauthenticated /v1/me is a 401, never a 200.
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$url/v1/me")
          test "$code" = "401" || { echo "/v1/me returned $code, expected 401"; exit 1; }
          count=$(curl -sS "$url/v1/catalog/entries?view=list" | jq 'length')
          test "$count" -gt 0 || { echo "catalog returned $count entries"; exit 1; }
          # A publicly cacheable catalog GET must be marked `public` and must NOT
          # carry the caller-trust verdict. The verdict describes the CALLER, so a
          # shared cache replaying a stored response would attach one caller's
          # verdict to another; the middleware strips it from exactly the
          # responses it marks public (app.py's `_anon_rate_limit`).
          #
          # THIS USED TO BE `curl -sSI`, AND THAT IS A HEAD REQUEST. These routes
          # answer HEAD with **405**, a 405 carries no Cache-Control, and the
          # middleware therefore leaves the verdict on it — so the assertion below
          # passed on a Method Not Allowed and never once looked at the catalog
          # response it names. It would have gone on passing with the header
          # removed from every GET route in the service. Verified against the
          # running service, 2026-08-15: `curl -sSI .../v1/catalog/entries` is
          # `HTTP/2 405` with `x-majorana-caller-trust: anonymous`.
          headers=$(curl -sS -D - -o /dev/null "$url/v1/catalog/entries?view=list" | tr -d '\r')
          grep -qiE '^cache-control:.*\bpublic\b' <<<"$headers" || {
            echo "::error::a public catalog GET is not marked publicly cacheable"
            printf '%s\n' "$headers" | grep -i '^cache-control:' || echo "  (no Cache-Control at all)"
            exit 1
          }
          # `if` rather than `grep ... && { ... }`, for legibility and to match the
          # `||` block above — not because the `&&` form is broken. It is not:
          # this step runs under `bash -e`, and errexit exempts a failing command
          # that is not the last of an AND-OR list, so a grep finding nothing does
          # NOT abort the step. Checked rather than assumed, because the
          # neighbouring `||` form and this one behave differently for reasons
          # that are easy to get backwards.
          if grep -qi '^x-majorana-caller-trust:' <<<"$headers"; then
            echo "::error::a publicly cacheable response carries the caller-trust verdict"
            echo "a shared cache would replay one caller's verdict to another"
            exit 1
          fi
          # And the mechanism itself must still be alive, asserted where it is
          # supposed to appear: a 404 sets no Cache-Control, so nothing strips the
          # verdict, and an unauthenticated caller must read `anonymous`.
          #
          # Deliberately NOT asserting `trusted` anywhere here. This job holds no
          # token, so the only way to make that pass would be to hand the deploy
          # pipeline the catalog secret — and a gate that needs a secret to go
          # green is a gate that gets deleted the first time the secret rotates.
          # Only the renderer can prove the trusted path, and it does, in
          # `lib/trusted-caller.ts::reportCallerTrust`.
          trust=$(curl -sS -D - -o /dev/null "$url/v1/catalog/entries/deploy-smoke-no-such-slug" \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="x-majorana-caller-trust"{print $2}')
          test "$trust" = "anonymous" || {
            echo "::error::caller-trust header was '$trust', expected 'anonymous'"
            echo "an empty value means the trusted-caller mechanism is not running"
            exit 1
          }
          echo "dark revision healthy: $count catalog entries, publicly cacheable, verdict alive"

      - name: shift api traffic
        if: steps.creds.outputs.have == 'true'
        run: |
          gcloud run services update-traffic majorana-api \
            --project "$GCP_PROJECT" --region "$GCP_REGION" --to-latest

      # The worker takes no traffic, so there is no dark-revision step — but the
      # --command override must be preserved or the image starts the API instead.
      #
      # The scaling flags are repeated on every deploy on purpose. This worker is
      # a database poller: nothing sends it an HTTP request, so a queued job
      # cannot wake a scaled-to-zero instance, and a throttled instance does not
      # get CPU between requests it never receives. Those settings were correct
      # in production but were unowned live-service state that `gcloud run deploy
      # --image` merely happened to preserve — one console edit or one
      # service-replacing command away from a silent outage with a green deploy.
      # State the repo depends on, in the repo.
      #
      # --set-cloudsql-instances is stated for the same reason. It is the only
      # route to the database now: the instance has no authorized networks, so a
      # revision without this attachment does not fail over to something slower,
      # it cannot connect at all.
      - name: deploy worker
        if: steps.creds.outputs.have == 'true'
        id: worker
        run: |
          # How many workers run is NOT decided here — it is WORKER_INSTANCES in
          # infra/fleet.env, loaded into the environment by the "load fleet
          # sizing" step, and read by db.py's connection-budget arithmetic from
          # the same file. One number, one edit, no second copy to forget.
          #
          # The queue supports any count. `claim_job` and
          # `claim_pending_dead_letter` are `FOR UPDATE SKIP LOCKED` with lease
          # tokens and heartbeats; `recover_stale_jobs` repeats its predicates on
          # both UPDATEs, so a row another worker already moved no longer
          # matches; the orphan reaper's `close_orphaned_run` writes
          # deterministic uuid5 event ids onto a `fail_run_from_dead_letter` that
          # no-ops on an already-terminal run, so a double reap completes one
          # sequence rather than two. `worker_id` is "$hostname:$pid", so
          # instances never collide on a lease.
          #
          # min == max on purpose. Cloud Run autoscales on request concurrency
          # and this service serves only a static liveness responder, so it
          # receives no request traffic and would never scale up on its own no
          # matter what the maximum said. Parallel workers have to be always-on,
          # which is real money: roughly $15-25/month each. That cost is the
          # reason the default went back to 1 on 2026-08-01 — the queue is empty
          # at today's usage, so the parallelism was being paid for and not used.
          #
          # DB_POOL_SIZE/DB_MAX_OVERFLOW come from the same file. They are not
          # defaults in code: without them the worker is a 5+5 process, and
          # several of those plus the API blows the instance's 50-connection
          # ceiling. The worker holds at most two sessions at once (handler +
          # heartbeat).
          gcloud run deploy majorana-worker --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --image "$IMAGE_REPO:${{ steps.tag.outputs.tag }}" \
            --command majorana-worker \
            --set-cloudsql-instances "$CLOUDSQL_INSTANCE" \
            --update-env-vars MAJORANA_SERVICE=worker,DB_POOL_SIZE=$WORKER_POOL_SIZE,DB_MAX_OVERFLOW=$WORKER_MAX_OVERFLOW \
            --min-instances "$WORKER_INSTANCES" --max-instances "$WORKER_INSTANCES" --no-cpu-throttling
          rev=$(gcloud run services describe majorana-worker \
            --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --format="value(status.latestCreatedRevisionName)")
          test -n "$rev" || { echo "could not resolve the new worker revision"; exit 1; }
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      # A crash-looping worker is the exact failure this workflow exists to stop,
      # and Cloud Run will not report it: the poll loop dies inside a container
      # that stays "healthy". Read the log directly and fail the deploy on errors.
      #
      # Scoped to the revision this run just created, not the service. A 2-minute
      # window over the whole service also catches the *outgoing* revision, which
      # is draining and — if it was crash-looping — is exactly what this deploy is
      # replacing. Unscoped, the sicker the thing we just fixed was, the more
      # certainly it fails the deploy that fixed it.
      # This step also carries the LLM gate. The worker preflights its configured
      # models against the provider's served list at startup and reports a
      # definitive mismatch as a structured severity=ERROR line, which lands here.
      #
      # `value(textPayload)` alone was not enough: a structured log entry arrives
      # as jsonPayload, so the projection returned an empty string and `-n` read
      # a real alarm as silence. Both payload shapes are read now — an alarm the
      # gate cannot see is not a gate.
      - name: worker is actually running
        if: steps.creds.outputs.have == 'true'
        run: |
          sleep 45
          logs=$(gcloud logging read \
            'resource.type="cloud_run_revision"
             AND resource.labels.service_name="majorana-worker"
             AND resource.labels.revision_name="${{ steps.worker.outputs.revision }}"
             AND severity>=ERROR' \
            --project "$GCP_PROJECT" --freshness=2m --limit 20 \
            --format="value(textPayload,jsonPayload.message)")
          if [ -n "$logs" ]; then
            echo "revision ${{ steps.worker.outputs.revision }} logged errors after deploy:"
            echo "$logs"
            exit 1
          fi
          echo "revision ${{ steps.worker.outputs.revision }} clean for 45s after deploy"

      # The gate every other step in this workflow is a proxy for: one real run,
      # on the stack that was just deployed, end to end.
      #
      # Everything above proves the pieces are up. Nothing above proves they work
      # together, and the two most expensive defects of the last month both lived
      # exactly in that gap: a worker crash-looping against a schema its image
      # predated (Cloud Run reported a healthy service), and #164's allowance
      # check building a Settings object that validates the *API's* configuration
      # inside the *worker*, which raised on every AUTO run that resolved to
      # EXECUTE. Local tests passed. CI passed. The smoke test above passed.
      # Only a live run touches that line.
      #
      # mode=auto, deliberately, even though execute is what we want. An explicit
      # mode is passthrough in the worker's resolver — it never reaches
      # `_assert_execute_allowance`, which is the line #164 broke. AUTO is the
      # path a real user's message takes, so AUTO is the path this gate takes.
      #
      # The success condition is therefore two things, not one: the run reached
      # `succeeded`, AND it resolved to `execute`. A run that answers
      # conversationally also reports `succeeded` without ever entering the
      # sandbox, so status alone would let a chat reply certify a broken
      # execution path.
      #
      # The credential is narrow by construction: DEPLOY_PROBE_TOKEN may create a
      # run, read that run, and read its events — every other route answers 403
      # (services/api/src/majorana_api/auth/deps.py, and the test that enumerates
      # the router to prove it). It is read from Secret Manager here rather than
      # held as a GitHub secret so there is one copy of it in the world.
      #
      # A missing secret FAILS. It must: a gate that skips itself when its
      # credential disappears is not a gate, and this workflow already has a
      # skip-with-a-warning path that exists for a different reason (no deploy
      # credentials at all, i.e. nothing was deployed to test).
      - name: a real run finishes on the deployed stack
        if: steps.creds.outputs.have == 'true'
        env:
          DEADLINE_SECONDS: "600"
        run: |
          if ! probe=$(gcloud secrets versions access latest \
            --secret=DEPLOY_PROBE_TOKEN --project "$GCP_PROJECT" 2>/tmp/probe.err); then
            echo "::error::could not read DEPLOY_PROBE_TOKEN: $(cat /tmp/probe.err)"
            echo "::error::the post-deploy run gate cannot authenticate. Provision the secret"
            echo "::error::(docs/runbooks/deploys.md § Post-deploy synthetic run) — do not"
            echo "::error::delete this step to make the deploy green."
            exit 1
          fi
          test -n "$probe" || { echo "::error::DEPLOY_PROBE_TOKEN is empty"; exit 1; }
          echo "::add-mask::$probe"

          api=$(gcloud run services describe majorana-api \
            --project "$GCP_PROJECT" --region "$GCP_REGION" --format='value(status.url)')
          test -n "$api" || { echo "::error::could not resolve the api URL"; exit 1; }

          # Idempotency-Key is the deploy tag: re-running this workflow for the
          # same commit re-reads the run it already created instead of spending
          # another one.
          created=$(curl -sS -X POST "$api/v1/runs" \
            -H "Authorization: Bearer $probe" \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: deploy-${{ steps.tag.outputs.tag }}" \
            -d '{"task_prompt":"Build a 2-qubit Bell state circuit, run it, and report the measurement counts.","framework":"qiskit","mode":"auto","shots":128,"seed":7,"timeout_s":120}')
          # `|| true` throughout the polling: the runner's default shell is
          # `bash -e -o pipefail`, so one transient curl or one unparseable body
          # would abort the step and report a network blip as a broken deploy.
          # Every read is allowed to come back empty and be retried; the deadline
          # is what ends the loop.
          run_id=$(printf '%s' "$created" | jq -r '.id // empty' || true)
          if [ -z "$run_id" ]; then
            echo "::error::POST /v1/runs did not return a run id"
            printf '%s\n' "$created" | head -c 2000
            exit 1
          fi
          echo "submitted run $run_id"

          deadline=$(( $(date +%s) + DEADLINE_SECONDS ))
          status=""
          mode=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            sleep 10
            body=$(curl -sS "$api/v1/runs/$run_id" -H "Authorization: Bearer $probe" || true)
            status=$(printf '%s' "$body" | jq -r '.status // empty' || true)
            mode=$(printf '%s' "$body" | jq -r '.mode // empty' || true)
            case "$status" in
              succeeded|failed|cancelled) break ;;
              "") echo "::warning::could not read run status; retrying" ;;
              *) echo "  $status ($mode)" ;;
            esac
          done

          if [ "$status" != "succeeded" ] || [ "$mode" != "execute" ]; then
            if [ "$status" = "succeeded" ]; then
              echo "::error::the run succeeded but resolved to mode '$mode', not 'execute' —"
              echo "::error::nothing entered the sandbox, so this deploy is UNVERIFIED. If the"
              echo "::error::stack is otherwise healthy this is an intent-router misclassification"
              echo "::error::of the probe prompt, not an outage."
            else
              echo "::error::post-deploy run $run_id ended '${status:-no terminal status before the deadline}'"
              echo "::error::(mode '${mode:-unknown}') — the deployed stack cannot complete a run."
            fi
            # Whole events, not a summary. A failing check's output is the only
            # input the next person has, and the payload fields are flattened
            # into the envelope by the events contract — a projection down to
            # {type} would throw away the stage, the error code and the numbers.
            echo "last events:"
            curl -sS "$api/v1/runs/$run_id/events" -H "Authorization: Bearer $probe" \
              | jq -c '.[-20:][]? | del(.run_id)' || true
            exit 1
          fi
          echo "run $run_id succeeded in mode $mode on the deployed stack"

      - name: rollback api on failure
        if: failure() && steps.creds.outputs.have == 'true'
        run: |
          echo "::error::deploy failed — check whether api traffic needs rolling back:"
          echo "::error::gcloud run services update-traffic majorana-api --to-revisions <previous>=100"
          gcloud run revisions list --service majorana-api \
            --project "$GCP_PROJECT" --region "$GCP_REGION" --limit 5 || true

      # The catalog is DATA, and this workflow until now deployed only CODE. A
      # merge that changes corpus content therefore reached the deploy and not
      # the visitor: production serves /repository from GET /v1/catalog/entries,
      # whose rows live in Postgres, and nothing moved them. Closing that gap
      # meant a human creating a throwaway Cloud Run job against the production
      # database — so it was skipped, and two corrected author names sat
      # un-imported for eight days while the map showed them and the catalog did
      # not.
      #
      # Runs on EVERY deploy, not only when manifest.json changed. Convergent
      # rather than event-driven: a sync gated on "did this push touch the
      # manifest" is stale forever the first time an event is missed — a dropped
      # dispatch, a re-run of an older ref, a workflow_dispatch — and nothing
      # downstream would ever say so. Re-running when nothing changed is cheap by
      # construction: the importer compares hashes and writes nothing when
      # content has not moved, attestation only fills gaps, and publishing an
      # already-public record is a documented no-op.
      #
      # Placed after `rollback api on failure` deliberately, and last overall.
      # That step is advisory and fires on ANY earlier failure; a catalog
      # refusal is not a reason to tell an operator to consider rolling back a
      # healthy API, and putting this after it means that by the time this can
      # fail, that step has already been evaluated and skipped.
      #
      # WHAT THIS DOES NOT CHANGE — ADR-0019's gate is intact. Alembic and
      # application startup still never insert or publish catalog data. What is
      # imported is still a pinned manifest release, because CI's drift guard
      # refuses any corpus edit whose regenerated manifest is not committed in
      # the same PR. The attestation is still a human's: --attested-by-standing
      # can only continue a grant a person already made by hand, refuses when
      # nobody holds it, and — via plan_re_attestation — still refuses outright
      # when a record's provenance claim has moved. See
      # docs/runbooks/system-catalog.md § Updating the published corpus.
      # PARKED 2026-08-12, first run, and the reason is a finding rather than a bug.
      # The step refused on its first production run with:
      #
      #   2 accounts hold the catalog reviewer grant
      #   (019f5b84-d1ab-72a3-9c68-41416325b3f4, 019fb3ae-39f8-78b6-a04a-dfdfb847952f)
      #
      # Neither carries the `retired-workos-env:` marker, so this is not the
      # env-switch duplicate the rule already resolves — two live accounts hold
      # ADMIN on the catalog workspace, and choosing one silently is precisely
      # what `pick_standing_reviewer` refuses to do. Deciding which is the real
      # reviewer, and revoking the other's grant, is a production database
      # decision and owner-only. See OWNER_TODO and
      # `plans/catalog-sync-pipeline.md`.
      #
      # Behind a variable rather than deleted, because the code is reviewed and
      # correct and the blocker is data: `gh variable set CATALOG_SYNC_ENABLED
      # --body true` re-arms it in one command once the grant is unambiguous.
      # The step below this one prints the parked state on EVERY deploy, so a
      # disabled sync cannot become the silent staleness this whole feature
      # exists to end.
      #
      # UPDATE 2026-08-12, later the same day: THE REVIEWER HALF IS SETTLED, and
      # the deploy is what settled it. `pick_standing_reviewer` gained a
      # signature-count narrowing, and the read-only report below has printed the
      # same answer on every deploy since:
      #
      #   019f5b84-d1ab-72a3-9c68-41416325b3f4  signed=1153
      #   019fb3ae-39f8-78b6-a04a-dfdfb847952f  signed=0
      #   VERDICT: exactly one eligible account has signed
      #
      # One of the two grants was never used, so there is nothing to choose
      # between: `--attested-by-standing` continues the account that signed, and
      # revoking the other is tidying rather than a precondition.
      #
      # It stays parked on a DIFFERENT blocker, which is why the flag has not
      # moved. Records whose provenance claim moved cannot inherit the grant made
      # about the old claim, and a human has to look at each and re-sign it by
      # name. Until that happens, turning this on runs the import — which resets
      # a changed record's review_state to DRAFT and takes it off /repository —
      # and then exits at the attest step before `publish-bootstrap` ever runs.
      # So the flip does not merely go red: it leaves the corpus staged and
      # unpublished, which is worse for a reader than the staleness it fixes.
      # The order is signature first, flag second. `attest-plan` below names
      # exactly which records are waiting.
      - name: sync the published catalog
        if: steps.creds.outputs.have == 'true' && vars.CATALOG_SYNC_ENABLED == 'true'
        run: |
          set -euo pipefail
          # `|| exit 1` rather than relying on `set -e`: bash disables errexit
          # inside the left operand of `||`, which is exactly how the parked
          # step below invokes this — so a failed preamble would otherwise fall
          # through and run the command without a DATABASE_URL. Caught by
          # running it: the guarded form printed past its own guard.
          . scripts/catalog-admin-env.sh || exit 1

          # No manifest freshness check here on purpose. Verifying it against the
          # TypeScript corpus means bundling apps/web with esbuild, which would
          # pull the whole JS toolchain — and a second install — into the
          # production deploy path. CI already refuses any PR whose regenerated
          # manifest is not committed, and the manifest's OWN integrity is
          # re-verified at import: BootstrapManifestSource recomputes the
          # whole-manifest checksum and every per-item sha256 before staging.
          if ! uv run --package majorana-api python -m majorana_api.catalog_admin \
            sync-bootstrap --attested-by-standing; then
            echo "::error::the catalog sync refused. THE CODE ROLLOUT ABOVE SUCCEEDED and"
            echo "::error::production is serving the new revision — what did not happen is"
            echo "::error::the corpus content reaching /repository."
            echo "::error::"
            echo "::error::NOTHING WAS PARTIALLY PUBLISHED, AND THE LISTING IS STILL SHORTER."
            echo "::error::Both are true and the second is the one that surprises people. No"
            echo "::error::record is serving half-attested content — but the import ran before"
            echo "::error::the refusal, and staging a new version resets review_state to DRAFT,"
            echo "::error::so every record whose content changed in this deploy has dropped OUT"
            echo "::error::OF THE BROWSE LISTING until it is attested. Direct links to those"
            echo "::error::records keep working. Expect the /repository count to fall, and do"
            echo "::error::not read that as a second failure."
            echo "::error::"
            echo "::error::The usual cause is a record whose provenance claim moved, which"
            echo "::error::needs a person: docs/runbooks/system-catalog.md § When"
            echo "::error::attest-bootstrap refuses. The identities are printed above, in"
            echo "::error::full — re-sign exactly those and the next deploy converges."
            exit 1
          fi

      # A skipped step is silent, and silence about a stale catalog is the exact
      # failure this feature was built to end — so the off state announces
      # itself every time rather than only in the file that turned it off.
      #
      # It also ANSWERS the question that parked it. The refusal that stopped the
      # sync hands its reader two bare UUIDs, and the evidence separating them
      # lives in the database that same reader is told not to reach from a laptop
      # — so "decide which of these is the real reviewer" was an owner action
      # with no supported way to gather the facts. `catalog_admin reviewers` is
      # read-only: it writes nothing and attests nothing, and the whole block is
      # guarded so a failure inside it can never redden a deploy the way the
      # sync's first run did.
      - name: the catalog sync is parked
        if: steps.creds.outputs.have == 'true' && vars.CATALOG_SYNC_ENABLED != 'true'
        run: |
          echo "::warning::catalog sync is PARKED (CATALOG_SYNC_ENABLED is not 'true')."
          echo "::warning::Corpus CONTENT changes in this deploy have NOT reached"
          echo "::warning::/repository — the catalog DB is serving its previous rows."
          echo "::warning::WHAT IS BLOCKING IT IS NOT NAMED HERE, ON PURPOSE. The two"
          echo "::warning::reports below compute it from the database on THIS run — who"
          echo "::warning::could sign, and whether anything would refuse. Read their"
          echo "::warning::VERDICT lines; they are the answer, and this text is not."
          echo "::warning::A blocker written into this echo is a sentence nobody"
          echo "::warning::re-reads when the state moves. The last one sat here for"
          echo "::warning::hours naming a resolved problem, contradicted by its own"
          echo "::warning::report six lines below. test_catalog_parked_step_names_no_blocker"
          echo "::warning::exists to keep it out."
          echo "::warning::Order, which does not depend on the state: signatures FIRST,"
          echo "::warning::then  gh variable set CATALOG_SYNC_ENABLED --body true"
          echo "::warning::Flipping first imports, drops changed records to DRAFT and"
          echo "::warning::exits before publishing. docs/runbooks/system-catalog.md."
          echo "--- who holds the grant (read-only; never fails this deploy) ---"
          (
            set -euo pipefail
            . scripts/catalog-admin-env.sh || exit 1
            uv run --package majorana-api python -m majorana_api.catalog_admin reviewers
            # The second half of the same question, and the half that is still
            # open. `reviewers` says whether an unattended run can name a
            # signatory; this says whether it would have anything to refuse.
            # Read-only in the same way — it resolves artifacts, reads claim
            # hashes and prints; it grants nothing and attests nothing — so it
            # belongs in the same guarded subshell and can never redden a deploy.
            #
            # It runs here rather than being something an operator invokes,
            # because the whole difficulty was that the refused set could only be
            # learned by causing the refusal, from inside a deployment boundary
            # nobody can reach from a laptop.
            echo "--- what the attest step would do (read-only) ---"
            uv run --package majorana-api python -m majorana_api.catalog_admin attest-plan
          ) || echo "::warning::could not read the catalog diagnostics; the warning above stands."
          exit 0
