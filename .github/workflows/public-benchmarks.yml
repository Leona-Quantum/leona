# DRAFT — proposal 1 ("Publish Nala's scores on the public benchmarks"), owner-approved
# 2026-09-20. NOT enabled to spend money: no `schedule` trigger, and deliberately no
# provider secrets wired in below, so `workflow_dispatch` on this file as shipped can only
# run the zero-cost stub controls — it cannot make a paid call even if someone clicks
# "Run workflow" without reading this comment.
#
# What a REAL run needs before it can happen (all deliberately left undone here, per the
# owner's ai-ops#217-style gate on widening what touches credentials or spends money):
#   1. This file needs `env:` wiring for whichever of OPENAI_API_KEY/DEEPSEEK_API_KEY or
#      ANTHROPIC_API_KEY the owner approves spending against (see bench.yml for the pattern
#      this repo already uses) — a separate, reviewed change, not silently added here.
#   2. The owner approves the per-run price — see evals/public-benchmarks/PRICING.md and
#      the PR that introduced this file for the estimate and its assumptions.
#   3. `--live` replaces `--stub canonical` in the `run` step below.
# "Re-run on every model change": once (1)-(3) land, point this workflow's trigger at
# whatever already signals a model change in this repo (e.g. a push touching
# packages/py/llm/src/majorana_llm/models.py) instead of relying on someone remembering to
# click Run — not done here since that is itself a scope decision, not a mechanical step.
#
# This workflow does not gate merges or deploys, the same reasoning as bench.yml and
# live-llm.yml: a public benchmark having a bad day (or costing money) must not block an
# unrelated PR.
name: public-benchmarks

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Which benchmark to run"
        required: true
        default: "qiskit-human-eval"
        type: choice
        options:
          - qiskit-human-eval
          - qcircuiteval
      stub:
        description: "canonical (positive control) or garbage (negative control) — zero spend either way"
        required: true
        default: "canonical"
        type: choice
        options:
          - canonical
          - garbage

concurrency:
  group: public-benchmarks
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pg
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: majorana_public_benchmarks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --all-extras --frozen
      - name: migrate
        env:
          DATABASE_URL_DIRECT: postgresql://pg:pg@localhost:5432/majorana_public_benchmarks
          DATABASE_URL: postgresql://pg:pg@localhost:5432/majorana_public_benchmarks
        run: uv run --package majorana-api alembic -c db/alembic.ini upgrade head
      - name: run the benchmark (stub — zero spend; see the header comment for what a real run needs)
        env:
          DATABASE_URL: postgresql://pg:pg@localhost:5432/majorana_public_benchmarks
          MAJORANA_LLM_PROVIDER: openai
        run: |
          uv run --package majorana-evals python -m majorana_evals.public_benchmarks run \
            --benchmark "${{ inputs.benchmark }}" \
            --stub "${{ inputs.stub }}" \
            --out public-benchmark-report.json \
            --markdown-out public-benchmark-report.md
          cat public-benchmark-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-benchmark-report
          path: |
            public-benchmark-report.json
            public-benchmark-report.md
