# The sandbox rootfs for untrusted, LLM-generated code. Procedure and rationale:
# docs/runbooks/sandbox-image.md.
#
# Why this workflow exists: PR #262 added five packages to infra/sandbox/Dockerfile
# and shipped three agent lanes that depended on them. Nothing built the image, so
# the lanes were live and inert for a day — every run failed with
# ModuleNotFoundError inside the sandbox. A merged Dockerfile change was not a
# shipped Dockerfile change, and no check said so.
#
# `build` gates the PR. There is deliberately NO publish job: the image is pushed
# from a laptop via docs/runbooks/sandbox-image.md step 1, which mints a
# short-lived OIDC token with `vercel vcr login docker` rather than storing a
# long-lived registry credential in this repo.
#
# One existed until 2026-08-16 and had never once succeeded. It needed
# `VERCEL_TOKEN` and `VERCEL_TEAM_ID` as repository secrets; neither was ever
# set, so `docker login` ran with empty values and failed with `Must provide
# --username with --password-stdin` — an error that never mentions a secret. It
# survived because nothing ever dispatched it: the only run in the repo's
# history was the one that found this. Deleted by owner ruling (ai-ops#118) in
# preference to setting the secrets, on the grounds that a second, broken route
# to a deploy is worse than one obvious route, and `latest` is the live rootfs
# for untrusted code — moving it IS the deploy, so it stays a deliberate human
# act behind the runbook's step 4 (run a circuit, do not just import).
#
# `container_scan` is the third job, added because `05-security.md` §1 claimed a
# weekly rebuild+scan that did not exist while §5 conceded "the container half is
# genuinely uncovered" — two sections of one gate contradicting each other, and
# §5 was the true one. The schedule below is what makes the rebuild half real: a
# rootfs that is never rebuilt accumulates unpatched base-image CVEs silently,
# and this is the rootfs that runs untrusted LLM-generated code.
name: sandbox-image
on:
  pull_request:
    paths:
      - "infra/sandbox/**"
      - ".github/workflows/sandbox-image.yml"
      # The compiler kernel is executed by the `build` job below, inside the
      # image this workflow produces. A change to it is a change to what this
      # rootfs has to be able to run, so it has to re-run the check.
      - "packages/py/frameworks/src/majorana_frameworks/optimizer_kernel.py"
  schedule:
    # Weekly, Monday 04:00 UTC — an hour after the gitleaks full-history scan in
    # security.yml so the two long jobs do not contend for runners.
    - cron: "0 4 * * 1"
  # Kept, with no inputs, so the rebuild-and-scan below can be run on demand —
  # e.g. the morning an advisory lands, rather than waiting for Monday. It used
  # to carry a `tag` input for the deleted publish job, which meant a manual run
  # skipped `container_scan` and did nothing else useful.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs on every PR that touches the Dockerfile. The runner is amd64, which is the
  # platform Vercel Sandbox requires, so this builds natively and needs no emulation.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: build the sandbox image
        run: |
          docker buildx build --platform linux/amd64 --load \
            -t majorana-runner:ci infra/sandbox
      # An import is the floor. qulacs and qiskit-aer are compiled wheels and can
      # import against a mismatched ABI, so every framework also runs a Bell pair —
      # the same check the runbook asks for against the live sandbox.
      - name: every framework imports and runs
        run: |
          docker run --rm --network none majorana-runner:ci python -c "
          import qiskit, qiskit_aer, pennylane, cirq, braket, numba, qibo, qulacs, gast

          from braket.circuits import Circuit as BraketCircuit
          from braket.devices import LocalSimulator
          counts = LocalSimulator().run(BraketCircuit().h(0).cnot(0, 1), shots=100).result().measurement_counts
          assert set(counts) <= {'00', '11'} and sum(counts.values()) == 100, counts

          import qibo
          qibo.set_backend('numpy')
          from qibo import gates, models
          qc = models.Circuit(2)
          qc.add([gates.H(0), gates.CNOT(0, 1), gates.M(0, 1)])
          freqs = qc(nshots=100).frequencies()
          assert set(freqs) <= {'00', '11'}, freqs

          state = qulacs.QuantumState(2)
          circuit = qulacs.QuantumCircuit(2)
          circuit.add_H_gate(0)
          circuit.add_CNOT_gate(0, 1)
          circuit.update_quantum_state(state)
          probs = [abs(a) ** 2 for a in state.get_vector()]
          assert abs(probs[0] - 0.5) < 1e-9 and abs(probs[3] - 0.5) < 1e-9, probs

          from qiskit import QuantumCircuit
          from qiskit_aer import AerSimulator
          qk = QuantumCircuit(2, 2)
          qk.h(0)
          qk.cx(0, 1)
          qk.measure([0, 1], [0, 1])
          assert set(AerSimulator().run(qk, shots=100).result().get_counts()) <= {'00', '11'}

          import pennylane as qml
          dev = qml.device('default.qubit', wires=2)

          @qml.qnode(dev)
          def bell():
              qml.Hadamard(0)
              qml.CNOT([0, 1])
              return qml.probs(wires=[0, 1])

          p = bell()
          assert abs(p[0] - 0.5) < 1e-9 and abs(p[3] - 0.5) < 1e-9, p

          cq = cirq.Circuit()
          q0, q1 = cirq.LineQubit.range(2)
          cq.append([cirq.H(q0), cirq.CNOT(q0, q1), cirq.measure(q0, q1, key='m')])
          m = cirq.Simulator().run(cq, repetitions=100).measurements['m']
          assert all(a == b for a, b in m), 'cirq bell pair is not correlated'

          print('all frameworks import and run')
          "
      # --network none above is the point: the production sandbox is created with an
      # explicit deny-all egress policy and cannot install anything at runtime, so a
      # package that is missing from the rootfs must fail here rather than there.
      #
      # The second check below is the Studio compiler lane (ai-ops#186, option A).
      # It runs THE SHIPPED KERNEL, mounted read-only out of the tree, rather than
      # a hand-written snippet — so what CI proves is that the exact source the
      # worker sends into a sandbox compiles a real circuit in the exact rootfs
      # this Dockerfile produces. An import check would not have caught the thing
      # that actually breaks here: bqskit and pyzx both hand their output back
      # through Qiskit, so a version skew between the image's qiskit and either of
      # them is a lowering failure, not an ImportError.
      - name: every Studio compiler compiles a real circuit
        run: |
          docker run --rm --network none \
            -v "$PWD/packages/py/frameworks/src/majorana_frameworks/optimizer_kernel.py:/tmp/kernel.py:ro" \
            majorana-runner:ci python -c "
          import importlib.util, json, math, sys

          spec = importlib.util.spec_from_file_location('optimizer_kernel', '/tmp/kernel.py')
          kernel = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(kernel)

          # Clifford+T only, and small: PyZX refuses non-pi/4 rotations and BQSKit
          # is capped at 8 qubits / 128 operations. One circuit all six accept is
          # what makes a single failure legible.
          operations = [
              {'gate': 'H', 'qubits': [0], 'angle_radians': None},
              {'gate': 'CX', 'qubits': [0, 1], 'angle_radians': None},
              {'gate': 'T', 'qubits': [1], 'angle_radians': None},
              {'gate': 'T', 'qubits': [1], 'angle_radians': None},
              {'gate': 'RZ', 'qubits': [1], 'angle_radians': math.pi / 4},
              {'gate': 'CX', 'qubits': [0, 1], 'angle_radians': None},
              {'gate': 'H', 'qubits': [0], 'angle_radians': None},
          ]

          failures = []
          for name in ('qiskit', 'cirq', 'pytket', 'pennylane', 'pyzx', 'bqskit'):
              result = kernel.compile_operations({
                  'compiler': name,
                  'qubit_count': 2,
                  'optimization_level': 2,
                  'operations': operations,
              })
              if not result.get('ok'):
                  failures.append((name, result.get('code'), result.get('message')))
                  continue
              print(name, 'ok', result['version'], len(result['operations']), 'operations')
          if failures:
              for name, code, message in failures:
                  print('FAILED', name, code, message, file=sys.stderr)
              sys.exit(1)
          print('all six Studio compilers compiled in the sandbox rootfs')
          "
      # The figure lane (ai-ops#239). The two packages fail in opposite ways, and
      # an import check would catch neither, so each assertion below is chosen to
      # go red on exactly one thing. Both behaviours were established by running
      # them rather than reasoned about — locally against qiskit 2.5.1, which is
      # what happened to be installed there. The image pins qiskit 2.5.0, so it
      # is this step running inside the image, and not that local session, that
      # makes the claim binding for the version actually shipped:
      #
      #   * matplotlib fails SOFT. With no writable MPLCONFIGDIR it does not
      #     raise — it falls back to a temp cache dir and logs onto the stderr of
      #     the generated code, so the defect reaches a reader as noise attached
      #     to their lesson. `get_cachedir()` is what tells those two apart; an
      #     import succeeds either way.
      #   * Qiskit fails HARD. Without pylatexenc, `draw("mpl")` raises
      #     MissingOptionalLibraryError — verified, it does not degrade to
      #     untypeset labels. So the lesson cell that draws a circuit does not
      #     produce a worse diagram, it produces a traceback. That is the shape
      #     of what ai-ops#239 called "figures missing inside the product".
      #
      # `HAS_PYLATEX` is Qiskit's own name for pylatexenc, and it tests the 2.x
      # API symbols (`latex2text.LatexNodes2Text`, `latexencode.utf8tolatex`) —
      # which is the reason the Dockerfile pins 2.11 rather than a 3.0 alpha.
      #
      # One ordering detail, because it looks like a bug when you run this by
      # hand: the `fontlist-*.json` assertion deliberately reads the cache
      # directory BEFORE anything imports pyplot. matplotlib writes that file on
      # the first pyplot import, so on a bare machine the directory is empty
      # there and the check goes red — correctly. Inside this image it is already
      # populated, because the Dockerfile warms it at build time, and that is
      # precisely what the assertion is proving still survives in the layer.
      - name: figures actually render, headless and offline
        run: |
          docker run --rm --network none majorana-runner:ci python -c "
          import os

          import matplotlib

          assert matplotlib.get_backend().lower() == 'agg', matplotlib.get_backend()

          # Red if MPLCONFIGDIR is unset, unwritable, or silently fell back.
          cachedir = matplotlib.get_cachedir()
          assert cachedir == os.environ['MPLCONFIGDIR'] == '/opt/mplconfig', cachedir

          # Red if the build-time font-cache warm did not persist into the image,
          # which is what makes the first import inside a sandbox fast and quiet.
          cached = os.listdir(cachedir)
          assert any(f.startswith('fontlist-') for f in cached), cached

          from qiskit.utils import optionals

          assert optionals.HAS_MATPLOTLIB, 'qiskit cannot see matplotlib'
          assert optionals.HAS_PYLATEX, 'qiskit cannot see pylatexenc'

          # Red on a 3.0 alpha, where this 2.x entry point moved.
          from pylatexenc.latexencode import utf8tolatex

          assert 'theta' in utf8tolatex('\u03b8'), utf8tolatex('\u03b8')

          from qiskit import QuantumCircuit
          from qiskit.visualization import plot_histogram

          # A histogram of real counts and a drawn circuit are the two figures a
          # notebook lesson asks for. Both are written and read back, because a
          # renderer that returns a Figure object and writes a zero-byte file is
          # the shape of failure that an in-memory check misses.
          plot_histogram({'00': 52, '11': 48}).savefig('/tmp/run/histogram.png')

          qc = QuantumCircuit(2)
          qc.h(0)
          qc.cx(0, 1)
          qc.rz(0.25, 1)
          qc.draw('mpl').savefig('/tmp/run/circuit.png')

          for path in ('/tmp/run/histogram.png', '/tmp/run/circuit.png'):
              blob = open(path, 'rb').read()
              assert blob[:8] == b'\x89PNG\r\n\x1a\n', (path, blob[:8])
              assert len(blob) > 4096, (path, len(blob))
              print(path, len(blob), 'bytes')

          print('histogram and circuit figures render in the sandbox rootfs')
          "
      - name: report the size, because it is a cost nobody sees
        run: |
          echo "image size: $(docker image inspect majorana-runner:ci --format '{{.Size}}') bytes"

  # Weekly rebuild + vulnerability scan of the rootfs that runs untrusted code.
  #
  # Also runs on a PR touching infra/sandbox/**, which is where a CVE-bearing
  # dependency would actually be introduced. It is NOT a required check: the
  # point is to be seen, and making a scan against a moving upstream advisory
  # database a merge blocker is how you end up deleting it from protection three
  # months later (05-security.md §5 on snyk, and §2 on the gitleaks box that was
  # unmeetable for months and therefore unenforced).
  container_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # A rebuild, not a pull of :latest. On the weekly schedule this is the half
      # that matters — it re-resolves the base image and every apt/pip layer, so
      # the scan below reports what a rootfs built TODAY would contain rather
      # than what the published tag contained whenever it was last promoted.
      # A finding here is therefore "the image we would publish is vulnerable",
      # which is the actionable form. Promotion stays manual either way.
      - name: rebuild the sandbox image
        run: |
          docker buildx build --platform linux/amd64 --load \
            -t majorana-runner:scan infra/sandbox
      # Downloaded and checksummed rather than run as `aquasecurity/trivy-action`.
      # That action shipped a credential stealer in March 2026 and reached
      # everyone tracking its tags, which is the specific reason 05-security.md §5
      # says container scanning, if adopted, goes in the same way osv-scanner did.
      # This is that.
      #
      # v0.73.0 rather than the newest release: v0.74.0 was published on the day
      # this was written, and pinning a security tool's freshest build would
      # contradict the same repository's `minimumReleaseAge: 1440`
      # (pnpm-workspace.yaml), which exists precisely because the compromised
      # version is usually the newest one. The checksum was verified against the
      # downloaded artifact, not transcribed from the release page.
      - name: install trivy
        timeout-minutes: 5
        env:
          TRIVY_VERSION: 0.73.0
          TRIVY_SHA256: 2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b
        run: |
          : "${TRIVY_VERSION:?TRIVY_VERSION is empty -- set it in the env: block of this step}"
          : "${TRIVY_SHA256:?TRIVY_SHA256 is empty -- refusing to download an unpinned binary}"
          # Retry the download, never the trust decision — same rule as the
          # osv-scanner install in security.yml. A tampered file fails sha256sum
          # on attempt one and attempt five identically.
          curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors --retry-max-time 180 \
            --connect-timeout 10 --max-time 180 \
            -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          chmod +x trivy
          # The checksum proves the bytes; this proves they are the version the
          # pin claims and that they run here.
          ./trivy --version
          ./trivy --version | head -1 | grep -qx "Version: ${TRIVY_VERSION}"
      # Proves the scanner can still fail before its clean verdict is believed —
      # the same rule as `check_osv_report.py --self-test` and the client-bundle
      # scanner. A gate that has never been seen to fail has not been shown to
      # work, and a clean container scan is indistinguishable from a broken one.
      - name: scanner self-test
        run: |
          # A synthetic manifest rather than an old base image. A base image is
          # the tempting probe and it is the wrong one: `debian:11-slim` and
          # friends are rebuilt with patches applied, so under --ignore-unfixed
          # they can legitimately come back clean and turn this guard into a
          # flake that fails the week nobody has time for it. A pinned ancient
          # library version cannot be patched out from under the test — the fix
          # is a different version, which this file does not name.
          mkdir -p /tmp/trivy-selftest
          printf 'django==2.2.0\n' > /tmp/trivy-selftest/requirements.txt
          if ./trivy fs --quiet --scanners vuln --severity HIGH,CRITICAL \
               --ignore-unfixed --exit-code 1 /tmp/trivy-selftest > selftest.txt 2>&1; then
            echo "trivy reported a clean bill on django==2.2.0 — the scanner is not working," >&2
            echo "or its advisory database failed to load. Either way the scan below would" >&2
            echo "report clean for the same reason, so this fails instead." >&2
            cat selftest.txt
            exit 1
          fi
          echo "self-test: trivy correctly reported fixed HIGH/CRITICAL advisories"
      # `--ignore-unfixed` is the load-bearing flag, not a softener. Without it
      # this job goes permanently red on base-image CVEs that have no upstream
      # patch, nobody can act on the output, and a check that is always red is a
      # check everyone learns to ignore — the exact failure 05-security.md §2
      # records for the gitleaks box. With it, a finding means "a fix exists and
      # we have not taken it", which is a thing a human can do something about.
      - name: scan the rootfs
        run: |
          ./trivy image --quiet --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --format table majorana-runner:scan
