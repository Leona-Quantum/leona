# Security gates. gitleaks has been required from day one.
#
# `snyk` lived here until 2026-07-20 and is gone: the account ran out of quota
# permanently, the job failed 403 on every PR, and a required check that cannot
# pass gets removed from branch protection — which is exactly what happened, so
# for several sessions there was no dependency gate at all. Its replacements are
# free, need no account, and are pinned by digest rather than tracking a moving
# tag (`snyk/actions/setup@master` moving under us is what started that outage):
#
#   osv     — dependency SCA, replaces `snyk test --all-projects`
#   semgrep — static analysis, replaces `snyk code test`
#
# Both are intended to be required checks on dev. Neither uploads SARIF: that
# needs GitHub Code Security, which is a paid add-on on private repos, so the
# gate is the job's exit code and the findings are in the job log.
name: security
permissions:
  contents: read
  pull-requests: read
on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly full-history scan
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Downloaded and checksummed rather than run as a third-party action. The
      # binary is what we actually trust, and pinning the hash means a
      # compromised release cannot change what runs here without failing loudly
      # (aquasecurity/trivy-action's March 2026 credential-stealer incident
      # reached everyone tracking its tags).
      - name: install osv-scanner
        # Backstop for the case curl's own deadlines cannot catch. --max-time
        # bounds each attempt and --retry-max-time bounds the retry window, but
        # neither is a wall clock over the step, so this is the thing that
        # guarantees a stalled download fails instead of holding a runner until
        # the six-hour default.
        timeout-minutes: 5
        env:
          OSV_VERSION: v2.4.0
          OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
        run: |
          # Both pins must be non-empty before the URL is built. This cannot fire
          # in CI -- `env:` above sets them at job scope -- and it is here for
          # legibility, not because anything is broken.
          #
          # Why it earns its four lines: ai-ops#50 was reported as this download
          # 404ing against a renamed release asset. It was not. The job's real
          # failure was a one-off 503 from GitHub's release host, fixed by #490.
          # The 404 came from reproducing the command BY HAND in a shell, where
          # OSV_VERSION is a workflow-scoped variable and therefore empty:
          #
          #   .../releases/download//osv-scanner_linux_amd64   <- note the //
          #   curl: (56) The requested URL returned error: 404   x6, exit 56
          #
          # Reproduced exactly, 2026-08-13. An empty pin silently produces a URL
          # that looks almost right and 404s, which reads as a missing asset and
          # sends the next reader hunting upstream. v2.4.0 and its linux_amd64
          # asset both still exist and the checksum below still matches the
          # SHA256SUMS published with that release -- verified the same day.
          # No apostrophes in these messages: the word in ${VAR:?word} is parsed
          # for quotes, so one unmatched ' is a syntax error that fails the step
          # unconditionally -- which is how the first draft of this guard broke.
          : "${OSV_VERSION:?OSV_VERSION is empty -- set it in the env: block of this step, or you are running this by hand outside CI}"
          : "${OSV_SHA256:?OSV_SHA256 is empty -- refusing to download an unpinned binary}"
          # Retry the download, not the trust decision. The release host returned
          # 503 on 2026-08-12 and reddened an unrelated PR (ai-ops#50); a single
          # attempt makes any blip on someone else's server look like a security
          # finding on ours. The version is pinned and the checksum below is
          # untouched, so a retry can only re-fetch the same pinned artefact --
          # a tampered file fails sha256sum on attempt one and on attempt five
          # identically. Never add a retry to the checksum line.
          curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors --retry-max-time 180 \
            --connect-timeout 10 --max-time 60 \
            -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          # The checksum proves the bytes; this proves they are the version the
          # pin claims and that they run on this runner. A pin nobody reads back
          # drifts silently the first time someone edits one of the two lines.
          ./osv-scanner --version
          ./osv-scanner --version | grep -qx "osv-scanner version: ${OSV_VERSION#v}"
      # The gate proves it still fails before its verdict is believed — same
      # reason client-bundle self-tests its scanner.
      - name: gate self-test
        run: python3 scripts/check_osv_report.py --self-test
      # osv-scanner exits 1 on any advisory at any severity, so the severity
      # threshold is applied by the gate script rather than by this exit code
      # (see its docstring for why the distinction matters). But `|| true`
      # swallowed every OTHER exit code too: a bad path or an unknown flag exits
      # 127 having scanned nothing, and the empty report that leaves behind used
      # to read as "clean" all the way through the gate. Accept only the two
      # codes that mean the scan actually ran.
      #
      # --all-packages makes the report list every lockfile it read, not just
      # the ones with advisories, which is what lets the gate check coverage.
      - name: scan uv.lock and pnpm-lock.yaml
        run: |
          rc=0
          ./osv-scanner scan source --recursive --all-packages --format json ./ \
            > osv.json 2> osv.err || rc=$?
          cat osv.err
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::osv-scanner exited ${rc} — the scan did not run, so this"
            echo "::error::job proves nothing about the lockfiles. See the log above."
            exit 1
          fi
      - name: apply the high/critical threshold
        run: python3 scripts/check_osv_report.py osv.json

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      # Community Edition: no SEMGREP_APP_TOKEN, no account. `semgrep ci` is the
      # command that wants one; `semgrep scan` does not. The registry ruleset is
      # still fetched at scan time, so this needs egress to semgrep.dev.
      - run: pip install semgrep==1.170.0
      # ERROR severity only. WARNING/INFO on this repo is 36 findings of mostly
      # style-adjacent advice, and a gate nobody can get to green is a gate that
      # gets bypassed. db/ is excluded on the same grounds check_raw_queries.py
      # excludes it: migrations are frozen history and must use raw SQL, which
      # is 8 of the 9 ERROR findings and none of them a defect.
      - name: semgrep (ERROR severity, excluding frozen migrations)
        run: |
          semgrep scan --config p/default --severity ERROR --error \
            --metrics=off --exclude=db --exclude=node_modules --exclude=.next

  # 05-security.md §2: "No secret-shaped strings in client bundle or error
  # responses (CI grep)". Unticked since adoption and never built. The API half
  # holds by construction (`app._problem()` composes every error body from a
  # fixed shape and never echoes an exception); this is the bundle half.
  #
  # It needs a real `next build` because the thing being checked is what the
  # build INLINES — `process.env.NEXT_PUBLIC_*` becomes a literal in the client
  # chunks, which is the documented behaviour and exactly the danger. Reading
  # source would miss it.
  #
  # Its own job rather than a step in `ts`: `ts` is a required check, and hanging
  # a several-minute build off it would make every PR in the repo wait on this.
  # Making this one required is a branch-protection change and therefore an
  # owner action — see memory/OWNER_TODO.md.
  client-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The scanner proves it still works before it is believed. A clean scan
      # from a broken scanner is indistinguishable from a clean scan, which is
      # how the gitleaks gate stayed meaningless for months.
      - name: scanner self-test
        run: node scripts/check-client-bundle-secrets.mjs --self-test
      - name: build the web app
        run: pnpm --filter @majorana/web build
      - name: no secret-shaped strings in browser-served files
        run: node scripts/check-client-bundle-secrets.mjs --dist apps/web/.next
      # Rides this job's existing build rather than adding one. The check needs
      # the route table, which only `next build` produces, and this is the only
      # job in the repository that runs it — `ci.yml` runs lint, typecheck and
      # test, so a page silently going dynamic is invisible to every required
      # check. Same self-test-before-believed rule as the scanner above.
      - name: routes that must be prerendered still are
        run: |
          node scripts/check-static-routes.mjs --self-test
          node scripts/check-static-routes.mjs --dist apps/web/.next

  # AGENTS.md hard rule 1 — migrations, contracts, sandbox, workflows and auth are
  # "never merged on subagent/Codex authority". That rule names `.github/CODEOWNERS`
  # as its mechanism, and CODEOWNERS was doing nothing: GitHub honours it only under
  # `required_pull_request_reviews.require_code_owner_reviews`, and neither `dev` nor
  # `prod` has a `required_pull_request_reviews` block at all (checked 2026-08-05).
  #
  # Switching it on is not the fix — the only code owner is the only author and GitHub
  # refuses self-approval, so the rule would be unsatisfiable and would go the way of
  # the `snyk` required check. This enforces the enforceable half: a blast-radius change
  # must be declared in the PR body, so it cannot ride along unnoticed in a PR about
  # something else. See the script's header for the full reasoning.
  #
  # `schedule` runs have no pull_request payload, so this is PR-only.
  blast-radius:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: declared in the PR body
        # Through `env`, never interpolated into the shell. `${{ ... }}` of a PR body
        # is attacker-controlled text pasted into the script the runner executes, which
        # is the standard GitHub Actions injection; as an environment variable it is
        # data that the checker reads with `process.env`.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          node scripts/check-blast-radius.mjs --self-test
          node scripts/check-blast-radius.mjs --base "origin/${BASE_REF}"
