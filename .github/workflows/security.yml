# Phase 0 gates: gitleaks required from day one; Snyk activates once SNYK_TOKEN
# is set (docs/runbooks/secrets.md). Dependency-review needs GHAS on private
# repos — add it in Phase 1 if GHAS is enabled, else when the repo goes public.
name: security
permissions:
  contents: read
  pull-requests: read
on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly full-history scan
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: token
        run: echo "have=${{ secrets.SNYK_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.have == 'true'
        uses: snyk/actions/setup@master
      # `snyk test --all-projects` shells out to the native tool for each lockfile
      # it recognises. It began recognising uv.lock on 2026-07-20 — snyk/actions is
      # pinned to @master, so the CLI moves under us — and reported "uv binary not
      # found in PATH", failing 1 of 6 projects and the whole required check with
      # zero vulnerabilities found. Installing uv scans the Python lockfile for
      # real rather than narrowing the gate to make it green.
      - if: steps.token.outputs.have == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.token.outputs.have == 'true'
        run: |
          snyk test --all-projects --severity-threshold=high
          # exit 3 = no supported source files yet (scaffold); real once Phase 1 lands
          snyk code test --severity-threshold=high || { ec=$?; [ "$ec" -eq 3 ] && echo "Snyk Code: no supported files yet — treated as pass" || exit "$ec"; }
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - if: steps.token.outputs.have != 'true'
        run: echo "SNYK_TOKEN not set — Snyk skipped (owner action, docs/runbooks/secrets.md)"
