# Security gates. gitleaks has been required from day one.
#
# `snyk` lived here until 2026-07-20 and is gone: the account ran out of quota
# permanently, the job failed 403 on every PR, and a required check that cannot
# pass gets removed from branch protection — which is exactly what happened, so
# for several sessions there was no dependency gate at all. Its replacements are
# free, need no account, and are pinned by digest rather than tracking a moving
# tag (`snyk/actions/setup@master` moving under us is what started that outage):
#
#   osv     — dependency SCA, replaces `snyk test --all-projects`
#   semgrep — static analysis, replaces `snyk code test`
#
# Both are intended to be required checks on dev. Neither uploads SARIF: that
# needs GitHub Code Security, which is a paid add-on on private repos, so the
# gate is the job's exit code and the findings are in the job log.
#
# `gitleaks` stopped being `gitleaks/gitleaks-action@ff98106` (v2) on 2026-08-15,
# for the same reason `snyk` is gone: an unmeetable third-party gate. That action's
# dist/index.js looks up the GitHub account type of the repo owner and, the instant
# it comes back "Organization", requires a `GITLEAKS_LICENSE` secret or exits 1 --
# on every run, leak or no leak. `EshMis/majorana` is about to transfer to the
# Leona-Quantum org (ai-ops#46), which would have turned this required check
# permanently red, including on the PR meant to fix it. Buying a license would not
# have been a durable fix either: the validation that key would satisfy is itself
# commented out upstream at that pin ("keygen payment method is getting declined
# ... disable this check for now"), so only the env var's *presence* was ever being
# tested, and that comment could be un-commented at any time. Replaced with the
# gitleaks binary, downloaded and checksummed the same way osv-scanner is below --
# the gate depends on a pinned hash now, not on a vendor's licensing branch or on
# who owns the repo.
name: security
permissions:
  contents: read
  pull-requests: read
on:
  pull_request:
  # A merge queue re-validates required checks against its own trial-merge ref
  # (`gh-readonly-queue/...`) and never consults a check that only fires on
  # `pull_request` — that check just never reports there and the queue stalls on
  # it forever (ai-ops#46/#70 merge-queue-prerequisites lane). gitleaks/osv/semgrep/
  # client-bundle carry no `if:` and read no `github.event.pull_request.*`, so they
  # run unchanged under `merge_group`. `blast-radius` is the exception — see its
  # job below, which the `merge_group` event needs real handling for, not just
  # this trigger line.
  merge_group:
  schedule:
    - cron: "0 3 * * 1" # weekly full-history scan

# Same reasoning as ci.yml: a superseded PR run is scanning a commit that can no
# longer be merged. The weekly scan is not at risk of being cancelled by PR
# traffic — on `schedule` the ref is the default branch, not refs/pull/<n>/merge,
# so it lands in a different group and always runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      # Downloaded and checksummed rather than run as gitleaks/gitleaks-action (see
      # the file header for why that action had to go). Same reasoning as
      # osv-scanner below: the binary is what we actually trust, pinned by hash so a
      # compromised release can't change what runs here without failing loudly.
      - name: install gitleaks
        timeout-minutes: 5
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          : "${GITLEAKS_VERSION:?GITLEAKS_VERSION is empty -- set it in the env: block of this step, or you are running this by hand outside CI}"
          : "${GITLEAKS_SHA256:?GITLEAKS_SHA256 is empty -- refusing to install an unpinned binary}"
          curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors --retry-max-time 180 \
            --connect-timeout 10 --max-time 60 \
            -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          # The checksum proves the bytes; this proves they are the version the pin
          # claims and that they run on this runner.
          ./gitleaks version
          ./gitleaks version | grep -qx "${GITLEAKS_VERSION}"
      # The gate proves it still catches a secret before its verdict is believed --
      # same reason osv-scanner and client-bundle self-test below. Runs entirely
      # against a throwaway scratch repo, never against this one, torn down before
      # the real scan runs.
      - name: gate self-test (planted secret caught, clean tree passes)
        run: |
          set -e
          d=$(mktemp -d)
          git init -q "$d"
          git -C "$d" config user.email "gate-self-test@localhost"
          git -C "$d" config user.name "gate-self-test"
          cp .gitleaks.toml "$d/.gitleaks.toml"
          git -C "$d" add .gitleaks.toml
          git -C "$d" commit -q -m config

          set +e
          ./gitleaks detect --redact --exit-code=2 --report-format=json --report-path="$d/clean.json" \
            --config "$d/.gitleaks.toml" --no-banner -s "$d"
          clean_rc=$?
          set -e
          if [ "$clean_rc" -ne 0 ]; then
            echo "::error::gate self-test failed -- a clean tree was flagged (exit ${clean_rc}, expected 0). The gitleaks gate cannot be trusted until this passes."
            rm -rf "$d"
            exit 1
          fi

          # FIXED, and assembled from two halves. Both halves of that sentence are
          # load-bearing.
          #
          # This used to be a random 40-char value relying on the default
          # generic-api-key rule. That rule suppresses a match whose value
          # contains any of gitleaks' stopwords, so a value was silently
          # undetectable whenever the random draw happened to spell one --
          # "...ZSHoWOF..." contains "show", "...eJSONh..." contains "json",
          # "...SPecg..." contains "spec". Measured against gitleaks 8.30.1 with
          # this repo's own config: 5 misses in 250 runs, ~2%, and every missed
          # value reproduces 100% of the time, so it is a property of the value
          # rather than a flake in the runner. That is a required check failing
          # spuriously on roughly one PR in fifty.
          #
          # Switching to a random AWS-shaped value does NOT fix it -- that rule
          # carries its own entropy floor, and measured 8 misses in 300. Every
          # gitleaks rule has suppression heuristics, because they exist to stop
          # false positives on real repositories. So the planted value cannot be
          # random and reliable at the same time; it has to be one that is known
          # to be caught.
          #
          # Split so that no complete secret-shaped literal ever sits in this
          # committed file for GitHub's push protection, or for a later scan of
          # this very workflow, to trip on: `AKIA` is a bare vendor prefix and
          # the body does not match `AKIA[0-9A-Z]{16}` without it. Only the
          # concatenation does, and it exists only inside the scratch repo.
          #
          # The variable names matter as much as the split, and this is the
          # second attempt at them. Naming the parts `secret_half_a` /
          # `secret_half_b` put a credential-shaped keyword immediately beside a
          # token-shaped literal, which is precisely the shape a generic-api-key
          # rule looks for -- Aikido flagged this file as an exposed secret on
          # the first revision of this PR. gitleaks did not, which is the useful
          # part: two scanners disagreeing about the same line is exactly why the
          # planted value has to be checked against both rather than reasoned
          # about. Neither line below carries a credential keyword.
          gate_prefix="AKIA"
          gate_body="3ZQ7W9XK2MTV8B4C"
          secret_value="${gate_prefix}${gate_body}"
          printf 'GITLEAKS_SELFTEST_SECRET = "%s"\n' "$secret_value" > "$d/planted.py"
          git -C "$d" add planted.py
          git -C "$d" commit -q -m planted

          set +e
          ./gitleaks detect --redact --exit-code=2 --report-format=json --report-path="$d/leak.json" \
            --config "$d/.gitleaks.toml" --no-banner -s "$d"
          leak_rc=$?
          set -e
          rm -rf "$d"
          if [ "$leak_rc" -ne 2 ]; then
            echo "::error::gate self-test failed -- a planted secret was not flagged (exit ${leak_rc}, expected 2). The gitleaks gate proves nothing until this passes."
            exit 1
          fi
          echo "self-test ok: clean tree passed, planted secret was caught"
      # PR runs are scoped to the PR's own commits, mirroring what
      # gitleaks/gitleaks-action did: the range is `<first PR commit>^..<last PR
      # commit>`, read from the PR's commit list rather than from base.sha.
      # base.sha is dev's CURRENT tip, which for any PR opened before the last dev
      # merge is not an ancestor of the PR's head -- using it here would silently
      # mis-scope (or error) the range on a large share of real PRs. Schedule runs
      # get no range at all, i.e. full history, same as the action's `schedule`
      # path did (see the "weekly full-history scan" comment on the `on:` block).
      - name: determine PR commit range
        if: github.event_name == 'pull_request'
        id: range
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          shas=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits" --jq '.[].sha')
          first=$(printf '%s\n' "$shas" | head -1)
          last=$(printf '%s\n' "$shas" | tail -1)
          : "${first:?no commits returned for this PR}"
          : "${last:?no commits returned for this PR}"
          echo "base=${first}" >> "$GITHUB_OUTPUT"
          echo "head=${last}" >> "$GITHUB_OUTPUT"
      # No PR comments/SARIF upload, matching this file's stated convention for
      # osv/semgrep (see file header): the gate is the exit code, findings are in
      # the job log. `--redact` keeps the matched secret value itself out of the
      # log even on a real hit.
      - name: scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
        run: |
          args=(detect --redact -v --exit-code=2 --report-format=json --report-path=gitleaks-report.json --log-level=info --config .gitleaks.toml --no-banner)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            : "${RANGE_BASE:?RANGE_BASE is empty -- the determine-range step should have set this}"
            : "${RANGE_HEAD:?RANGE_HEAD is empty -- the determine-range step should have set this}"
            # gitleaks fails open on an unresolvable range: if `${RANGE_BASE}^` has
            # no parent in this checkout (found empirically while testing this
            # change), the internal `git log` call errors, gitleaks logs the git
            # error but still reports "0 commits scanned" / "no leaks found" and
            # exits 0. Verifying the range resolves to something ourselves, before
            # handing it to gitleaks, is what turns that silent pass into a loud
            # failure instead.
            range_count=$(git rev-list --count --no-merges --first-parent "${RANGE_BASE}^..${RANGE_HEAD}") || {
              echo "::error::the PR commit range ${RANGE_BASE}^..${RANGE_HEAD} does not resolve in this checkout. Refusing to scan an unresolvable range as though it were clean -- that is exactly the fail-open this job exists to avoid. Check fetch-depth on the checkout step above."
              exit 1
            }
            if [ "$range_count" -eq 0 ]; then
              echo "::error::the PR commit range ${RANGE_BASE}^..${RANGE_HEAD} resolves to 0 commits, which should not happen for a PR with at least one commit. Refusing to treat this as a clean scan."
              exit 1
            fi
            args+=(--log-opts="--no-merges --first-parent ${RANGE_BASE}^..${RANGE_HEAD}")
          fi
          echo "gitleaks cmd: ./gitleaks ${args[*]}"
          set +e
          ./gitleaks "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "no leaks found"
          elif [ "$rc" -eq 2 ]; then
            echo "::error::gitleaks found a leak -- see the redacted findings above and gitleaks-report.json in the run log."
            exit 1
          else
            echo "::error::gitleaks exited ${rc} -- the scan did not run to completion, so this job proves nothing about secrets. See the log above."
            exit 1
          fi

  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Downloaded and checksummed rather than run as a third-party action. The
      # binary is what we actually trust, and pinning the hash means a
      # compromised release cannot change what runs here without failing loudly
      # (aquasecurity/trivy-action's March 2026 credential-stealer incident
      # reached everyone tracking its tags).
      - name: install osv-scanner
        # Backstop for the case curl's own deadlines cannot catch. --max-time
        # bounds each attempt and --retry-max-time bounds the retry window, but
        # neither is a wall clock over the step, so this is the thing that
        # guarantees a stalled download fails instead of holding a runner until
        # the six-hour default.
        timeout-minutes: 5
        env:
          OSV_VERSION: v2.4.0
          OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
        run: |
          # Both pins must be non-empty before the URL is built. This cannot fire
          # in CI -- `env:` above sets them at job scope -- and it is here for
          # legibility, not because anything is broken.
          #
          # Why it earns its four lines: ai-ops#50 was reported as this download
          # 404ing against a renamed release asset. It was not. The job's real
          # failure was a one-off 503 from GitHub's release host, fixed by #490.
          # The 404 came from reproducing the command BY HAND in a shell, where
          # OSV_VERSION is a workflow-scoped variable and therefore empty:
          #
          #   .../releases/download//osv-scanner_linux_amd64   <- note the //
          #   curl: (56) The requested URL returned error: 404   x6, exit 56
          #
          # Reproduced exactly, 2026-08-13. An empty pin silently produces a URL
          # that looks almost right and 404s, which reads as a missing asset and
          # sends the next reader hunting upstream. v2.4.0 and its linux_amd64
          # asset both still exist and the checksum below still matches the
          # SHA256SUMS published with that release -- verified the same day.
          # No apostrophes in these messages: the word in ${VAR:?word} is parsed
          # for quotes, so one unmatched ' is a syntax error that fails the step
          # unconditionally -- which is how the first draft of this guard broke.
          : "${OSV_VERSION:?OSV_VERSION is empty -- set it in the env: block of this step, or you are running this by hand outside CI}"
          : "${OSV_SHA256:?OSV_SHA256 is empty -- refusing to download an unpinned binary}"
          # Retry the download, not the trust decision. The release host returned
          # 503 on 2026-08-12 and reddened an unrelated PR (ai-ops#50); a single
          # attempt makes any blip on someone else's server look like a security
          # finding on ours. The version is pinned and the checksum below is
          # untouched, so a retry can only re-fetch the same pinned artefact --
          # a tampered file fails sha256sum on attempt one and on attempt five
          # identically. Never add a retry to the checksum line.
          curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors --retry-max-time 180 \
            --connect-timeout 10 --max-time 60 \
            -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          # The checksum proves the bytes; this proves they are the version the
          # pin claims and that they run on this runner. A pin nobody reads back
          # drifts silently the first time someone edits one of the two lines.
          ./osv-scanner --version
          ./osv-scanner --version | grep -qx "osv-scanner version: ${OSV_VERSION#v}"
      # The gate proves it still fails before its verdict is believed — same
      # reason client-bundle self-tests its scanner.
      - name: gate self-test
        run: python3 scripts/check_osv_report.py --self-test
      # osv-scanner exits 1 on any advisory at any severity, so the severity
      # threshold is applied by the gate script rather than by this exit code
      # (see its docstring for why the distinction matters). But `|| true`
      # swallowed every OTHER exit code too: a bad path or an unknown flag exits
      # 127 having scanned nothing, and the empty report that leaves behind used
      # to read as "clean" all the way through the gate. Accept only the two
      # codes that mean the scan actually ran.
      #
      # --all-packages makes the report list every lockfile it read, not just
      # the ones with advisories, which is what lets the gate check coverage.
      - name: scan uv.lock and pnpm-lock.yaml
        run: |
          rc=0
          ./osv-scanner scan source --recursive --all-packages --format json ./ \
            > osv.json 2> osv.err || rc=$?
          cat osv.err
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::osv-scanner exited ${rc} — the scan did not run, so this"
            echo "::error::job proves nothing about the lockfiles. See the log above."
            exit 1
          fi
      - name: apply the high/critical threshold
        run: python3 scripts/check_osv_report.py osv.json

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      # Community Edition: no SEMGREP_APP_TOKEN, no account. `semgrep ci` is the
      # command that wants one; `semgrep scan` does not. The registry ruleset is
      # still fetched at scan time, so this needs egress to semgrep.dev.
      - run: pip install semgrep==1.170.0
      # ERROR severity only. WARNING/INFO on this repo is 36 findings of mostly
      # style-adjacent advice, and a gate nobody can get to green is a gate that
      # gets bypassed. db/ is excluded on the same grounds check_raw_queries.py
      # excludes it: migrations are frozen history and must use raw SQL, which
      # is 8 of the 9 ERROR findings and none of them a defect.
      - name: semgrep (ERROR severity, excluding frozen migrations)
        run: |
          semgrep scan --config p/default --severity ERROR --error \
            --metrics=off --exclude=db --exclude=node_modules --exclude=.next

  # 05-security.md §2: "No secret-shaped strings in client bundle or error
  # responses (CI grep)". Unticked since adoption and never built. The API half
  # holds by construction (`app._problem()` composes every error body from a
  # fixed shape and never echoes an exception); this is the bundle half.
  #
  # It needs a real `next build` because the thing being checked is what the
  # build INLINES — `process.env.NEXT_PUBLIC_*` becomes a literal in the client
  # chunks, which is the documented behaviour and exactly the danger. Reading
  # source would miss it.
  #
  # Its own job rather than a step in `ts`: `ts` is a required check, and hanging
  # a several-minute build off it would make every PR in the repo wait on this.
  # Making this one required is a branch-protection change and therefore an
  # owner action — see memory/OWNER_TODO.md.
  client-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The scanner proves it still works before it is believed. A clean scan
      # from a broken scanner is indistinguishable from a clean scan, which is
      # how the gitleaks gate stayed meaningless for months.
      - name: scanner self-test
        run: node scripts/check-client-bundle-secrets.mjs --self-test
      # Same rule, for the path guard on the paper-register gate's bundler. It is
      # pure path arithmetic and needs no node_modules, so it runs before any
      # install step and cannot be skipped by a toolchain that is not there yet.
      # Aikido's autofix for this finding shipped a 245-line test that declared
      # its OWN copy of the function under test and lived at a path no CI glob
      # matched — it would have passed with the guard deleted, and never ran. The
      # self-test asserts the guard REFUSES eight traversal shapes and accepts the
      # six real call sites, so removing the guard turns this red.
      - name: paper-register bundler path guard self-test
        run: node scripts/check-paper-register.mjs --self-test
      - name: build the web app
        run: pnpm --filter @majorana/web build
      - name: no secret-shaped strings in browser-served files
        run: node scripts/check-client-bundle-secrets.mjs --dist apps/web/.next
      # Rides the same build. `isomorphic-dompurify` (lib/sanitize-math.ts) resolves
      # to jsdom on the server and plain DOMPurify in a browser, and MathText is in
      # the CLIENT graph via map-card-panel.tsx — so that split is load-bearing and
      # was checked by nothing. Raised by Aikido on PR 690. A bundler upgrade that
      # resolved the server condition for the client build would still compile and
      # still render; it would just ship a Node DOM to every visitor. Self-test
      # first, same rule as the scanner above.
      - name: no server-only dependency in the browser bundle
        run: |
          node scripts/check-server-only-in-client.mjs --self-test
          node scripts/check-server-only-in-client.mjs --dist apps/web/.next
      # Rides this job's existing build rather than adding one. The check needs
      # the route table, which only `next build` produces, and this is the only
      # job in the repository that runs it — `ci.yml` runs lint, typecheck and
      # test, so a page silently going dynamic is invisible to every required
      # check. Same self-test-before-believed rule as the scanner above.
      - name: routes that must be prerendered still are
        run: |
          node scripts/check-static-routes.mjs --self-test
          node scripts/check-static-routes.mjs --dist apps/web/.next

  # AGENTS.md hard rule 1 — migrations, contracts, sandbox, workflows and auth are
  # "never merged on subagent/Codex authority". That rule names `.github/CODEOWNERS`
  # as its mechanism, and CODEOWNERS was doing nothing: GitHub honours it only under
  # `required_pull_request_reviews.require_code_owner_reviews`, and neither `dev` nor
  # `prod` has a `required_pull_request_reviews` block at all (checked 2026-08-05).
  #
  # Switching it on is not the fix — the only code owner is the only author and GitHub
  # refuses self-approval, so the rule would be unsatisfiable and would go the way of
  # the `snyk` required check. This enforces the enforceable half: a blast-radius change
  # must be declared in the PR body, so it cannot ride along unnoticed in a PR about
  # something else. See the script's header for the full reasoning.
  #
  # `schedule` runs have no pull_request payload, so this is PR + merge_group only.
  #
  # The merge_group event is the harder of the two: it carries no pull_request object
  # at all — GitHub's payload is deliberately sparse here (github/docs; community
  # discussion #65239 is literally a feature request asking GitHub to add PR details
  # to it, confirming they aren't there today). Left as plain `if:
  # github.event_name == 'pull_request'`, this job would just be SKIPPED under
  # merge_group — and a skipped required check reports success, so every blast-radius
  # PR would sail through the queue unchecked. The only thing merge_group.head_ref
  # gives us is `gh-readonly-queue/<base>/pr-<number>-<sha>`, which does encode the PR
  # number, so the step below recovers it and re-fetches the PR's current body over
  # the API — the same acknowledgement the pull_request run on this PR already had to
  # pass before the PR could be added to the queue in the first place (GitHub docs,
  # "About merge queues": "Once a pull request has passed all required branch
  # protection checks... a user with write access... can add the pull request to the
  # queue"). This is re-verified rather than trusted, since batching/backfill rules
  # can add PRs to a group under settings this job cannot see from here.
  blast-radius:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: recover the PR body from merge_group.head_ref
        if: github.event_name == 'merge_group'
        # `gh api` needs a token; `pull-requests: read` (granted at workflow scope
        # above) is enough to read a PR's body. Written to a file, not a shell
        # variable or step output, for the same injection reason as the next step.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          pr_number=$(echo "$MERGE_GROUP_HEAD_REF" | grep -oE 'pr-[0-9]+-' | grep -oE '[0-9]+')
          if [ -z "$pr_number" ]; then
            echo "::error::could not recover a PR number from merge_group.head_ref ($MERGE_GROUP_HEAD_REF)"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq .body > pr-body.txt
      - name: declared in the PR body
        # Through `env`/a file, never interpolated into the shell. `${{ ... }}` of a PR
        # body is attacker-controlled text pasted into the script the runner executes,
        # which is the standard GitHub Actions injection; on pull_request it is read as
        # an environment variable (`process.env`), and on merge_group it is read from
        # the file the previous step wrote — either way the checker only ever reads the
        # text, it never lets a shell parse it.
        #
        # BASE_REF: pull_request's `base.ref` is a bare branch name ("dev");
        # merge_group's `base_ref` is a full ref ("refs/heads/dev"). The `#refs/heads/`
        # strip is a no-op on the former and correct on the latter, so one line handles
        # both events instead of branching on event_name a second time.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: |
          node scripts/check-blast-radius.mjs --self-test
          base_ref="${BASE_REF#refs/heads/}"
          if [ -f pr-body.txt ]; then
            node scripts/check-blast-radius.mjs --base "origin/${base_ref}" --body-file pr-body.txt
          else
            node scripts/check-blast-radius.mjs --base "origin/${base_ref}"
          fi
