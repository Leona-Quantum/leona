name: vqe-production-e2e

on:
  workflow_dispatch:
  push:
    branches:
      - feature/vqe
    paths:
      - .github/workflows/vqe-production-e2e.yml
      - services/api/src/majorana_api/auth/**
      - services/api/src/majorana_api/db.py
      - services/api/src/majorana_api/repos/vqe.py
      - services/api/src/majorana_api/routes/vqe.py
      - services/api/src/majorana_api/settings.py
      - services/api/src/majorana_api/standard_vqe_materializer.py
      - services/api/src/majorana_api/vqe_runtime_profiles.py
      - services/api/tests/test_vqe_production_e2e.py
      - services/worker/src/majorana_worker/handlers.py
      - services/worker/src/majorana_worker/vqe_runtime.py
      - packages/py/vqe/**
      - scripts/provision-h2-vqe-candidate.py
      - db/migrations/**

permissions:
  contents: read
  packages: read

concurrency:
  group: vqe-production-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workos-contract-postgres-oci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pg
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: majorana_vqe_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - name: migrate isolated PostgreSQL 17 database
        env:
          DATABASE_URL_DIRECT: postgresql://pg:pg@localhost:5432/majorana_vqe_e2e
          DATABASE_URL: postgresql://pg:pg@localhost:5432/majorana_vqe_e2e
        run: uv run --package majorana-api alembic -c db/alembic.ini upgrade head
      - name: provision frozen owner-waived H2 workflow
        env:
          DATABASE_URL: postgresql://pg:pg@localhost:5432/majorana_vqe_e2e
          MAJORANA_VQE_E2E_PROVISION: "true"
          MAJORANA_VQE_E2E_USER_ID: vqe-production-e2e
          MAJORANA_VQE_E2E_EMAIL: vqe-production-e2e@majorana.test
        run: |
          workflow_id="$(uv run python scripts/provision-h2-vqe-candidate.py)"
          echo "MAJORANA_VQE_E2E_WORKFLOW_ID=$workflow_id" >> "$GITHUB_ENV"
      - name: pre-provision approved OCI digests
        run: |
          docker pull --platform linux/amd64 ghcr.io/eshmis/majorana-vqe-qiskit@sha256:17a1ee0690ce768a076c370ee17c36de5f536ff4b61d8ebe4ae43b961a277b76
          docker pull --platform linux/amd64 ghcr.io/eshmis/majorana-vqe-pennylane@sha256:e29149db8efb338c4dd82879909ad8dd4928174309bc0b9fc1b7db0ef2a21930
          docker pull --platform linux/amd64 ghcr.io/eshmis/majorana-vqe-uccsd-qiskit@sha256:9e0d646fd59cee3d51a72a60d36b306619150732cf01bda73de23c1cdbd119d5
          docker pull --platform linux/amd64 ghcr.io/eshmis/majorana-vqe-uccsd-pennylane@sha256:daac7c918f277555515bc3a4c5c7fa29e6634a44184db1f04f4cd3ef5d3e9980
          docker pull --platform linux/amd64 ghcr.io/eshmis/majorana-vqe-hardware-efficient-qiskit@sha256:1bd4a30499fdb945ee61a89b703d28287eabe2d4dedf610c8a9b4fef6fee555d
          docker pull --platform linux/amd64 ghcr.io/eshmis/majorana-vqe-hardware-efficient-pennylane@sha256:f6977dcf8cdd99b198c739f6d1f33c98dcf840235a40f66c5632dd5adddeb207
      - name: WorkOS JWT contract → isolated PostgreSQL → real OCI runtime E2E
        env:
          DATABASE_URL: postgresql://pg:pg@localhost:5432/majorana_vqe_e2e
          MAJORANA_ENV: production
          MAJORANA_VQE_RUNTIME_HOST: dedicated
          MAJORANA_RUN_VQE_PRODUCTION_E2E: "1"
          MAJORANA_VQE_E2E_EVIDENCE_PATH: /tmp/phase78-private-ci-e2e.json
        run: uv run pytest services/api/tests/test_vqe_production_e2e.py -q
      - name: upload redacted private E2E evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase78-private-ci-e2e-${{ github.sha }}
          path: /tmp/phase78-private-ci-e2e.json
          if-no-files-found: error
          retention-days: 30
