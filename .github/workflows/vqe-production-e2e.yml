name: vqe-production-e2e

on:
  workflow_dispatch:
  push:
    branches:
      - feature/vqe
    paths:
      - .github/workflows/vqe-production-e2e.yml
      - services/api/src/majorana_api/auth/**
      - services/api/src/majorana_api/routes/vqe.py
      - services/api/src/majorana_api/settings.py
      - services/api/src/majorana_api/vqe_runtime_profiles.py
      - services/api/tests/test_vqe_production_e2e.py
      - services/worker/src/majorana_worker/handlers.py
      - services/worker/src/majorana_worker/vqe_runtime.py
      - packages/py/vqe/**

permissions:
  contents: read
  packages: read

concurrency:
  group: vqe-production-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workos-contract-neon-oci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - uses: neondatabase/create-branch-action@v5
        id: neon
        with:
          project_id: twilight-wildflower-01313590
          branch_name: ci-vqe-production-e2e-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: migrate disposable Neon branch
        env:
          DATABASE_URL_DIRECT: ${{ steps.neon.outputs.db_url }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
        run: uv run --package majorana-api alembic -c db/alembic.ini upgrade head
      - name: provision frozen owner-waived H2 workflow
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
          MAJORANA_VQE_E2E_PROVISION: "true"
          MAJORANA_VQE_E2E_USER_ID: vqe-production-e2e
          MAJORANA_VQE_E2E_EMAIL: vqe-production-e2e@majorana.test
        run: |
          workflow_id="$(uv run python scripts/provision-h2-vqe-candidate.py)"
          echo "MAJORANA_VQE_E2E_WORKFLOW_ID=$workflow_id" >> "$GITHUB_ENV"
      - name: pre-provision approved OCI digests
        run: |
          docker pull --platform linux/amd64 ghcr.io/eshmis/majorana-vqe-qiskit@sha256:3b66b9a813346c4ebba446c2cb80119b4d379725797f90463d2068e5285d62f6
          docker pull --platform linux/amd64 ghcr.io/eshmis/majorana-vqe-pennylane@sha256:205a795608b99e6901e9a03696a0aa38be718c636cdcadd530ada7492c288fd2
      - name: WorkOS JWT contract → Neon → real OCI runtime E2E
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
          MAJORANA_ENV: production
          MAJORANA_VQE_RUNTIME_HOST: dedicated
          MAJORANA_RUN_VQE_PRODUCTION_E2E: "1"
        run: uv run pytest services/api/tests/test_vqe_production_e2e.py -q
      - uses: neondatabase/delete-branch-action@v3
        if: always()
        with:
          project_id: twilight-wildflower-01313590
          branch: ci-vqe-production-e2e-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
