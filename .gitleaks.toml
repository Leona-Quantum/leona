# gitleaks configuration — makes "full-history clean" (05-security.md §2) a gate
# that can actually be met, and therefore one whose failure means something.
#
# ## Why this file exists
#
# The full-history scan that prompted this file (PR #251) reported 83 leaks.
# Every one of them was the same false positive: the built-in `generic-api-key`
# rule fires on an identifier containing "key" next to a quoted value, and this
# codebase has a domain term shaped exactly like that —
#
#     component_semantic_key == "optimizer.slsqp.v1"
#
# `semantic_key` is the scientific identity of a VQE component. It is not a
# credential, it was never a credential, and it appears in fixtures, tests, web
# components and evidence manifests across ~20 files of history.
#
# The release gate asks for a clean full-history scan. With 83 permanent hits it
# could never be clean, so it would have been read past every week — and a
# genuine leak arriving as hit number 84 would have been indistinguishable from
# the noise. Suppressing a false positive here is not weakening the gate; it is
# the thing that makes the gate readable.
#
# ## The rule for adding to this file
#
# An entry needs the reason it is not a secret, written down. "Looks like a test
# value" is not a reason — `secrets/` rotation history in this project exists
# because something that looked like a placeholder was not one. If a match
# cannot be explained, it is treated as live and rotated, not allowlisted.

[extend]
useDefault = true

[[rules]]
# The default rule, re-declared so it can carry an allowlist. Everything else
# about `generic-api-key` is inherited from the default config.
id = "generic-api-key"

  [rules.allowlist]
  # A path here means: nothing in this file is a finding. Used once, deliberately.
  #
  # `scripts/zoo-parity/zoo-index.json` is a fetched copy of a PUBLIC bibliography —
  # the Quantum Algorithm Zoo's entry list, regenerated wholesale by
  # `scripts/generate-zoo-index.mjs`. Its `refs[]` entries carry BibTeX citation keys
  # ("Biasse_Song16", "Reichardt2010", "Ambainis_Montanaro12") under a field literally
  # named `key`, which is what trips `generic-api-key`. There are 291 of them and every
  # one names a paper.
  #
  # Anchored on the path rather than a value pattern, and that is the narrower choice:
  # a regex loose enough to cover "HH21" and "Shor_factoring94" would be loose enough to
  # hide a short weak credential ANYWHERE in the repository. Nobody hand-edits a
  # generated index, so it is not a place a credential arrives.
  #
  # Found 2026-08-14 while making the weekly full-history scan green again. These seven
  # were NOT in the 2026-08-10 CI run — the commit adding them is dated 2026-08-12 — so
  # without this the gate would have gone red again on the next Sunday run, six days
  # after the fix looked complete.
  paths = ['''^scripts/zoo-parity/zoo-index\.json$''']
  regexTarget = "match"
  regexes = [
    # 1. A dotted, version-suffixed scientific identifier — "optimizer.slsqp.v1",
    #    "ansatz.h2.fixed_excitation.v1", "h2.sto3g.actual_vqe.v0_2.measurement"
    #    (the `.vN` segment may sit mid-chain and then name a part of the record).
    #
    #    Anchored to the FIVE namespaces that actually occur, enumerated from the
    #    83 findings rather than guessed — a first pass by hand got `measurement`
    #    (which does not occur) and missed `stopping` and `comparison` (which
    #    account for 18 between them).
    #
    #    Shape alone was the first version and it was too permissive: any
    #    lowercase dotted value carrying a `.vN` was suppressed, which is a wider
    #    hole than the one being closed, and a custom credential in dotted form
    #    would have slipped through the full-history gate. Narrowed in review — a
    #    suppression in a security control should be exactly as wide as its
    #    evidence and no wider.
    #
    #    Matched on the value rather than the field name because the same
    #    identifier is read through half a dozen spellings (semantic_key,
    #    semanticKey, component_key, baseline_component_key,
    #    candidate_component_semantic_key). A NEW namespace must be added here
    #    deliberately, and the control below re-run.
    '''(?i)["'](?:optimizer|stopping|ansatz|comparison|h2)(?:\.[a-z0-9_]+)*\.v[0-9][0-9_]*(?:\.[a-z0-9_]+)*["']''',

    # 2. Idempotency-Key headers in tests: "phase78-cobyla-swap". A client-chosen
    #    dedupe token, never a credential — it authenticates nothing and grants
    #    nothing. Anchored on the header name and restricted to slug-shaped
    #    values, so a key with a secret pasted into it would still be caught.
    '''(?i)idempotency[_-]?key["'\s]*[:=]{1,2}[\s"']*[a-z0-9]+(?:-[a-z0-9]+)+["']''',

    # 3. Recorded git commit SHAs in evidence manifests — "final_api_source_commit".
    #    40 hex characters is also what a hex-encoded secret looks like, so this
    #    is anchored on a `*_commit`/`*_sha` field name rather than on the shape.
    '''(?i)[a-z_]*(?:commit|sha)["'\s]*[:=]{1,2}[\s"']*[0-9a-f]{40}["']''',

    # 4. The disposable CI ledger key in `test_vqe_production_e2e.py`. The file's
    #    own comment says what it is: "an intentionally public, CI-only key for
    #    the disposable test ledger ... It must never be reused by a deployed
    #    service." It exists so the production Settings contract can be tested
    #    without weakening the requirement for a real provisioned secret.
    #
    #    Anchored on the field name AND a slug-shaped value — lowercase words
    #    joined by hyphens, no entropy. A real HMAC key is base64 or hex and
    #    would not match, so pasting one into this same constant still fails the
    #    gate. That is the point: the suppression is exactly as wide as the
    #    evidence.
    '''(?i)DECISION_HMAC_KEY["'\s]*[:=]{1,2}[\s"']*[a-z0-9]+(?:-[a-z0-9]+){2,}["']''',

    # 5. The placeholder in `test_secret_like_model_output_is_rejected_without_
    #    echoing_it`, which is a test OF the secret-rejection path: it asserts
    #    the parser raises `potential_secret_in_candidate` and that the value is
    #    absent from the error. The fixture has to look like a key for the test
    #    to mean anything.
    #
    #    Anchored on the literal alphabet, A through Z in order. Nothing with
    #    real entropy can contain it, so this cannot suppress a genuine key.
    '''ABCDEFGHIJKLMNOPQRSTUVWXYZ''',

    # 6. This codebase's own browser-storage key convention —
    #    "majorana.<name>.v<n>" — assigned to a constant whose name ends in
    #    `_KEY` (`lib/landing-prompt-handoff.ts`'s `HANDOFF_KEY`, and its
    #    test's local copy of the same literal string). The hundred-plus keys
    #    already living in this exact shape inside `lib/user-storage.ts`'s
    #    `SCOPED_STORAGE_KEYS`/`DEVICE_STORAGE_KEYS` arrays never trip this
    #    rule, because they sit as array elements rather than a bare
    #    `IDENTIFIER = "value"` assignment — the shape `generic-api-key`
    #    actually looks for. A single new one declared as its own named
    #    constant does. Anchored the same way entry 1 is: a dotted,
    #    low-entropy, `.vN`-suffixed identifier under this repo's own fixed
    #    `majorana.` namespace — never a value any provider issues.
    '''(?i)["']majorana\.[a-z0-9-]+\.v[0-9]+["']''',

    # 7. The mutation fixture in `curricula/qiskit-study-group/check_build.py`,
    #    which is a test OF the credential check. One scenario, "a credential in
    #    a cell", writes `token = "abcdef0123456789abcdef"` into a throwaway copy
    #    of the curriculum tree and asserts the build checker rejects it. The
    #    fixture has to look like a credential or the test proves nothing — the
    #    same situation as entry 5, and the same reason it is safe to allowlist.
    #
    #    Anchored on the literal `abcdef0123456789`: the sixteen hex digits in
    #    strict ascending order. That sequence is what a human types when they
    #    want something credential-shaped and are not thinking; a real key cannot
    #    contain it and still be a real key. Paste an actual token into this same
    #    constant and the gate still fails, which is the property every entry in
    #    this file has to keep.
    '''abcdef0123456789''',
  ]

