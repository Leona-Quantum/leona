<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="120" height="120">
  <!-- The Open Badges 2.0 BadgeClass image for every Leona Quantum course
       certificate (ai-ops 349 proposal 8). Same mark as the tab favicon
       (app/icon.svg) — the ket mark on a warm-charcoal tile, with the Leo
       sickle asterism (Leona = lioness) and Regulus as the state-dot — scaled
       up rather than redrawn, so the two stay in sync by construction. Colors
       are literal for the same reason the favicon's are: this file is fetched
       standalone by badge viewers and cannot read tokens.css. -->
  <rect width="32" height="32" rx="7" fill="#131211" />
  <g stroke="#7ba05b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M9.5 8.4v15.2" />
    <path d="m18.4 8.4 4.8 7.6-4.8 7.6" />
  </g>
  <path d="M13.9 16l-1.3-3.4 1.1-2.9 2.6-.8" stroke="#7ba05b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.75" />
  <circle cx="12.6" cy="12.6" r="1" fill="#7ba05b" />
  <circle cx="13.7" cy="9.7" r="1" fill="#7ba05b" />
  <circle cx="16.3" cy="8.9" r="1" fill="#7ba05b" />
  <circle cx="13.9" cy="16" r="1.9" fill="#7ba05b" />
</svg>
