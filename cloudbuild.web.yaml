# Builds the web image (apps/web/Dockerfile, repo-root context). Cloud Run
# spike (ai-ops gcp-migration-20260912 PLAN.md) — mirrors cloudbuild.api.yaml.
# Not wired into any workflow yet; run by hand (docs/runbooks/web-cloud-run.md):
#   gcloud builds submit --config cloudbuild.web.yaml \
#     --ignore-file=.gcloudignore.web \
#     --substitutions=_TAG=$(git rev-parse --short=8 HEAD),_SHA=$(git rev-parse HEAD) .
#
# `--substitutions` fills only this file's own ${_VAR} placeholders; it does not
# reach `docker build`. So every value next.config.ts reads at build time is
# forwarded below as an explicit --build-arg. They are build args and not Cloud
# Run env vars because NEXT_PUBLIC_* is inlined into the bundle and the CSP
# headers are baked into routes-manifest.json during `next build`.
#
# Defaults match production as it is served today: the CSP on leonaqt.com names
# https://majorana-api-nikekeixtq-uw.a.run.app as the control plane (read
# 2026-09-15), and LEONA_DEPLOY_ENV=production keeps the preview-only
# allowances (Vercel Toolbar CSP, /lab, the public demo) off.
#
# _SENTRY_DSN and _WORKOS_REDIRECT_URI default to EMPTY, and that is the spike's
# correct value: a hand-run build should not send browser errors into
# production's Sentry project, and an empty NEXT_PUBLIC_SENTRY_DSN makes the
# client SDK a no-op. deploy-web.yml passes the real ones, with
# _PUBLIC_ENV=production, because that build is the one visitors get. They are
# declared here even though they default to nothing: Cloud Build rejects a
# substitution the config does not name.
substitutions:
  _SHA: unset
  _DEPLOY_ENV: production
  _API_URL: https://majorana-api-nikekeixtq-uw.a.run.app
  _PUBLIC_ENV: spike
  _SENTRY_DSN: ''
  _WORKOS_REDIRECT_URI: ''
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - --build-arg
      - LEONA_DEPLOY_ENV=${_DEPLOY_ENV}
      - --build-arg
      - LEONA_GIT_COMMIT_SHA=${_SHA}
      - --build-arg
      - NEXT_PUBLIC_LEONA_GIT_COMMIT_SHA=${_SHA}
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_MAJORANA_ENV=${_PUBLIC_ENV}
      - --build-arg
      - NEXT_PUBLIC_SENTRY_DSN=${_SENTRY_DSN}
      - --build-arg
      - NEXT_PUBLIC_WORKOS_REDIRECT_URI=${_WORKOS_REDIRECT_URI}
      - -t
      - us-west1-docker.pkg.dev/majorana-core/majorana/web:${_TAG}
      - .
images:
  - us-west1-docker.pkg.dev/majorana-core/majorana/web:${_TAG}
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
# Longer than the API's 1800s: a Next build (typecheck + compile + the
# marketing pages' generateStaticParams over the Atlas corpus) is heavier
# than the API's Python build, and this has not been timed yet — 3000s
# leaves headroom for a first run. Tighten once a real build duration exists.
timeout: 3000s
