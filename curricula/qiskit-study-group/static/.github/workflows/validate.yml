name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --locked --extra notebooks --extra dev

      - name: Run tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check shared tests scripts

      - name: Validate and execute every notebook
        run: uv run python scripts/validate_notebooks.py --execute
