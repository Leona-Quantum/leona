[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qiskit-study-group"
version = "0.1.0"
description = "A code-first Qiskit 2.x study group for software engineers new to quantum computing."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "qiskit>=2.5,<2.6",
    "numpy",
    "matplotlib",
    "pylatexenc",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab",
    "ipykernel",
    "nbformat",
    "nbclient",
]
dev = [
    "pytest",
    "ruff",
]
hardware = [
    "qiskit-ibm-runtime>=0.49,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
