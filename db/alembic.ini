# Alembic config — single linear history, owned by services/api (AGENTS.md).
# Run from repo root: uv run alembic -c db/alembic.ini upgrade head
# DATABASE_URL_DIRECT must be set (Neon direct/unpooled endpoint for DDL, role `migrate`).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
