<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1090" viewBox="0 0 1120 1090" role="img" aria-labelledby="title desc">
  <title id="title">Verified outcomes for 26 quantum circuit families</title>
  <desc id="desc">Each family has six trials from two unseen seeds and three repetitions. Green is independently verified success, orange is false positive, and gray is rejected product failure.</desc>
  <rect width="1120" height="1090" rx="20" fill="#f8fafc"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="50" y="48" fill="#0f172a" font-size="24" font-weight="700">26 family別の結果 — 各6試行</text>
    <text x="50" y="76" fill="#475569" font-size="15">未使用seed 2個 × 3反復。緑=独立検証成功、橙=誤受理、灰=製品が停止。</text>
    <circle cx="55" cy="105" r="7" fill="#22c55e"/><text x="70" y="110" fill="#334155" font-size="13">正解 113</text>
    <circle cx="175" cy="105" r="7" fill="#f97316"/><text x="190" y="110" fill="#334155" font-size="13">false positive 31</text>
    <circle cx="365" cy="105" r="7" fill="#94a3b8"/><text x="380" y="110" fill="#334155" font-size="13">rejected 12</text>
    <text x="970" y="110" fill="#64748b" font-size="12">独立成功率</text>
