<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="535" viewBox="0 0 1120 535" role="img" aria-labelledby="title desc">
  <title id="title">Pass rates by difficulty and workload</title>
  <desc id="desc">Verified pass rates decrease from 100 percent for basic to 58.3 percent for research difficulty, and from 100 percent for educational to 53.8 percent for scientific workload.</desc>
  <rect width="1120" height="535" rx="20" fill="#f8fafc"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="50" y="48" fill="#0f172a" font-size="24" font-weight="700">難易度・用途別の独立検証成功率</text>
    <text x="50" y="76" fill="#475569" font-size="15">バーは独立オラクルに合格した割合。サンプル数が異なるため、率と n を併記。</text>

    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="220" y1="112" x2="220" y2="492"/>
      <line x1="420" y1="112" x2="420" y2="492" stroke-dasharray="4 5"/>
      <line x1="620" y1="112" x2="620" y2="492" stroke-dasharray="4 5"/>
      <line x1="820" y1="112" x2="820" y2="492" stroke-dasharray="4 5"/>
      <line x1="1020" y1="112" x2="1020" y2="492"/>
    </g>
    <g fill="#64748b" font-size="12" text-anchor="middle">
      <text x="220" y="105">0%</text>
      <text x="420" y="105">25%</text>
      <text x="620" y="105">50%</text>
      <text x="820" y="105">75%</text>
      <text x="1020" y="105">100%</text>
    </g>

    <text x="50" y="135" fill="#0f172a" font-size="16" font-weight="700">難易度</text>
    <g fill="#334155" font-size="14">
      <text x="200" y="177" text-anchor="end">Basic</text>
      <text x="200" y="222" text-anchor="end">Intermediate</text>
      <text x="200" y="267" text-anchor="end">Advanced</text>
      <text x="200" y="312" text-anchor="end">Research</text>
    </g>
    <rect x="220" y="156" width="800" height="28" rx="6" fill="#16a34a"/>
    <rect x="220" y="201" width="666.67" height="28" rx="6" fill="#3b82f6"/>
    <rect x="220" y="246" width="571.43" height="28" rx="6" fill="#6366f1"/>
    <rect x="220" y="291" width="466.67" height="28" rx="6" fill="#f97316"/>
    <g fill="#0f172a" font-size="13" font-weight="700">
      <text x="1030" y="176">100.0% (1/1)</text>
      <text x="897" y="221">83.3% (5/6)</text>
      <text x="802" y="266">71.4% (5/7)</text>
      <text x="697" y="311">58.3% (7/12)</text>
    </g>

    <line x1="50" y1="346" x2="1070" y2="346" stroke="#e2e8f0"/>
    <text x="50" y="378" fill="#0f172a" font-size="16" font-weight="700">用途</text>
    <g fill="#334155" font-size="14">
      <text x="200" y="420" text-anchor="end">Educational</text>
      <text x="200" y="465" text-anchor="end">Practical</text>
      <text x="200" y="510" text-anchor="end">Scientific</text>
    </g>
    <rect x="220" y="399" width="800" height="28" rx="6" fill="#16a34a"/>
    <rect x="220" y="444" width="600" height="28" rx="6" fill="#0ea5e9"/>
    <rect x="220" y="489" width="430.77" height="28" rx="6" fill="#ef4444"/>
    <g fill="#0f172a" font-size="13" font-weight="700">
      <text x="1030" y="419">100.0% (5/5)</text>
      <text x="830" y="464">75.0% (6/8)</text>
      <text x="661" y="509">53.8% (7/13)</text>
    </g>
  </g>
</svg>
