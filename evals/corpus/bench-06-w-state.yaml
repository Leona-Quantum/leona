id: bench-06
category: "A — W state preparation"
prompt: >-
  Prepare the exact five-qubit W state in Qiskit. Use Statevector to calculate
  the total probability on computational-basis states with Hamming weight one,
  return it as the top-level numeric RESULT key single_excitation_probability,
  and bind the preparation circuit to FINAL_CIRCUIT.
framework: qiskit
expect:
  terminal_reason: ai_review_aligned
  export_status: lossless
  output_keys: ["single_excitation_probability"]
  expected_values:
    single_excitation_probability: 1.0
  expected_value_tolerance: 0.000001
  saves_artifact: true
