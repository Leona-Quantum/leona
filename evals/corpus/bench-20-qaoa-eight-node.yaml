id: bench-20
category: "E — Eight-node weighted QAOA"
prompt: >-
  Solve weighted MaxCut using QAOA p=2 on eight nodes with weighted edges
  (0,1,1), (1,2,2), (2,3,1), (3,4,2), (4,5,1), (5,6,2),
  (6,7,1), (7,0,2), (0,4,3), (1,5,2), (2,6,3), (3,7,2),
  (0,2,1), and (4,6,1). Use at least 4096 shots and deterministic seeds.
  Return the best observed weighted cut as the top-level numeric RESULT key
  cut_value and include counts. The independently computed classical optimum
  is 22.
framework: qiskit
expect:
  terminal_reason: ai_review_aligned_with_reference_check
  output_keys: ["cut_value", "counts"]
  expected_values:
    cut_value: 22.0
  expected_value_tolerance: 0.0
  saves_artifact: true
