id: bench-25
category: "J — Quantum metrology"
prompt: >-
  In Qiskit, prepare a five-qubit GHZ state used to estimate a collective phase
  generated by G = (Z0+Z1+Z2+Z3+Z4)/2. Compute the pure-state quantum Fisher
  information as four times the Statevector variance of G. Return it as the
  top-level numeric RESULT key quantum_fisher_information and bind the GHZ
  preparation circuit to FINAL_CIRCUIT.
framework: qiskit
expect:
  terminal_reason: ai_review_aligned
  output_keys: ["quantum_fisher_information"]
  expected_values:
    quantum_fisher_information: 25.0
  expected_value_tolerance: 0.000001
  saves_artifact: true
