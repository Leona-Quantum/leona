id: bench-30
category: "F — Grover / oracle search recovery"
prompt: "Use Grover's algorithm on 4 qubits to recover the marked bitstring 1100. Measure all qubits and return the measurement counts. The most-probable outcome must be 1100 in Qiskit measurement order."
framework: qiskit
expect:
  verifier_decision: pass
  output_keys: ["counts"]
  saves_artifact: true
  # Value-level correctness: the deterministic verifier checks circuit-consistency, not
  # that the answer matches the target, so an endianness bit-reversal (0011) would pass it.
  # This pins the recovered top state to the requested target.
  expected_top_bitstring: "1100"
