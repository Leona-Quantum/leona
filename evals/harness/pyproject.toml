[project]
name = "majorana-evals"
version = "0.1.0"
description = "Eval corpus loader + harness: runs the pipeline over corpus cases and scores them"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.8",
    "pyyaml>=6",
    "majorana-contracts",
    "majorana-api",
    "majorana-worker",
    # The harness runs REAL providers to produce the honest baseline and therefore
    # pulls the provider SDKs. Both complete profiles the bench guard accepts:
    # openai+deepseek (one SDK) and anthropic.
    "majorana-llm[openai,anthropic]",
]

[project.optional-dependencies]
# Only the PDF leg of paper_source's source-priority chain needs this, and that leg
# is the last resort — LaTeX source and ar5iv HTML cover everything after 2007.
# pypdf rather than PyMuPDF: PyMuPDF is AGPL, and every engine tested loses the same
# glyphs, so the choice is licence and install weight, not extraction quality.
pdf = ["pypdf>=5.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_evals"]

[tool.uv.sources]
majorana-contracts = { workspace = true }
majorana-api = { workspace = true }
majorana-worker = { workspace = true }
majorana-llm = { workspace = true }
