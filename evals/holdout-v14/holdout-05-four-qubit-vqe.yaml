prompt: >-
  Estimate the ground-state energy of the explicit four-qubit Hamiltonian
  H=+0.12 IIII -0.31 ZIII +0.27 IZII -0.22 IIZI +0.19 IIIZ
  +0.14 XXII -0.10 YYII +0.13 IXXI -0.09 IYYI +0.11 IIXX
  -0.08 IIYY +0.07 XIZX. Use a nontrivial parameterized Qiskit ansatz,
  exact statevector expectations, alternating entangler patterns, a robust bounded
  optimizer, and at least six deterministic starting points spread across the
  parameter range. Independently diagonalize exactly the same written Hamiltonian.
  Return top-level numeric RESULT keys ansatz_expectation, matrix_ground_value,
  and variational_gap. Bind the best optimized ansatz circuit—not an exact
  eigenvector preparation—to FINAL_CIRCUIT.
