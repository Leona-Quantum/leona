id: holdout-v15-04
category: "Holdout v15 — Constrained QUBO business metric"
split: holdout
difficulty: advanced
workload: practical
prompt: >-
  In Qiskit, minimize over six binary variables the original business cost
  4*x0 + x1 + 3*x2 + 2*x3 + 5*x4 + 0.5*x5
  - 2*x1*x5 + 1.5*x0*x3 - x2*x4 + 0.4*x0*x5,
  subject to exactly two variables being one. Build and optimize a QAOA circuit with
  deterministic seeds and at least 4096 shots, and independently enumerate all 64
  assignments. Return top-level RESULT keys sampled_business_cost,
  enumerated_business_cost, selected_indices, and counts. The sampled cost and indices
  must come from the same feasible bitstring actually present in counts; neither may
  be a penalty-Hamiltonian energy or an enumerated fallback. Bind the optimized
  measured QAOA circuit to FINAL_CIRCUIT.
framework: qiskit
expect:
  terminal_reason: null
  output_keys:
    ["sampled_business_cost", "enumerated_business_cost", "selected_indices", "counts"]
  expected_values:
    sampled_business_cost: -0.5
    enumerated_business_cost: -0.5
  expected_result_subset:
    selected_indices: [1, 5]
  expected_value_tolerance: 0.000000001
  saves_artifact: true
