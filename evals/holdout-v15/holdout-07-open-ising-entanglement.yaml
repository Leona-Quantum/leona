id: holdout-v15-07
category: "Holdout v15 — Nonuniform open-Ising entanglement"
split: holdout
difficulty: research
workload: scientific
prompt: >-
  With q0 as the leftmost tensor factor, exactly diagonalize the five-qubit open-chain
  Hamiltonian H=-sum_{i=0}^{3} Z_i Z_{i+1} -0.83*sum_{i=0}^{4} X_i
  +0.17*sum_{i=0}^{4} (-1)^i Z_i. Prepare its lowest-energy eigenvector in a
  Qiskit circuit, trace out q2,q3,q4, and compute the base-2 von Neumann entropy of
  q0,q1. Also compute <Z2> from that eigenvector. Return top-level numeric RESULT
  keys ground_energy, first_pair_entropy_bits, and central_z. Bind the eigenvector
  preparation circuit to FINAL_CIRCUIT.
framework: qiskit
expect:
  terminal_reason: null
  output_keys: ["ground_energy", "first_pair_entropy_bits", "central_z"]
  expected_values:
    ground_energy: -5.433215711230223
    first_pair_entropy_bits: 0.4683833157931872
    central_z: -0.43824601581533795
  expected_value_tolerance: 0.000000001
  saves_artifact: true
