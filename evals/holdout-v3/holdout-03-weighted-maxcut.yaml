id: holdout-v3-03
category: "Holdout v3 — Weighted MaxCut"
split: holdout
difficulty: intermediate
workload: practical
prompt: >-
  Solve weighted MaxCut on five vertices with weighted edges
  (0,1,2),(0,2,1),(1,2,3),(1,3,2),(2,4,4),(3,4,1),(0,4,2).
  Build and optimize a Qiskit QAOA circuit with p at least 2, deterministic seeds, and
  at least 4096 shots. Score the sampled bitstrings with the stated edge weights and
  independently enumerate all 32 cuts as a classical baseline. Return top-level
  numeric RESULT keys qaoa_best_cut and exact_max_cut plus counts, and bind the
  optimized QAOA circuit to FINAL_CIRCUIT. Do not substitute the exact cut for QAOA.
framework: qiskit
expect:
  terminal_reason: null
  output_keys: ["qaoa_best_cut", "exact_max_cut", "counts"]
  expected_values:
    qaoa_best_cut: 14.0
    exact_max_cut: 14.0
  expected_value_tolerance: 0.0
  saves_artifact: true
