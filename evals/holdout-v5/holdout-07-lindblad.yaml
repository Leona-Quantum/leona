id: holdout-v5-07
category: "Holdout v5 — Lindblad amplitude damping and dephasing"
split: holdout
difficulty: research
workload: scientific
prompt: >-
  Starting from the one-qubit |+> state, solve at t=1.3 the master equation
  d rho/dt = 0.7*(sigma_minus rho sigma_plus - 0.5*{sigma_plus sigma_minus,rho})
  + 0.2/2*(Z rho Z-rho). Use an explicit Liouvillian matrix exponential or the
  equivalent analytic solution, with basis order |0>,|1>. Return top-level numeric
  RESULT keys excited_population=rho[1,1], coherence_real=Re(rho[0,1]), and purity.
  Also bind to FINAL_CIRCUIT a Qiskit Stinespring circuit on the system and environment
  ancillas whose reduced system state implements the same amplitude-damping followed
  by phase-flip channel at t=1.3.
framework: qiskit
expect:
  terminal_reason: null
  output_keys: ["excited_population", "coherence_real", "purity"]
  expected_values:
    excited_population: 0.201262112016818
    coherence_real: 0.24459605589816574
    purity: 0.7981431125551817
  expected_value_tolerance: 0.000001
  saves_artifact: true
