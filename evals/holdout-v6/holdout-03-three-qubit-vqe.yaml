id: holdout-v6-03
category: "Holdout v6 — Three-qubit variational ground state"
split: holdout
difficulty: advanced
workload: scientific
prompt: >-
  Estimate the ground-state energy of the explicit three-qubit Hamiltonian
  H=-0.37 III +0.51 ZII -0.22 IZI +0.19 IIZ +0.16 XXI -0.13 IYY +0.09 ZIZ.
  Use a nontrivial parameterized Qiskit ansatz, a deterministic statevector-based
  objective, and a robust classical optimizer from multiple starting points. Also
  diagonalize the same written Hamiltonian as an independent classical baseline.
  Return top-level numeric RESULT keys variational_energy, exact_energy, and
  energy_error, and bind the optimized ansatz circuit to FINAL_CIRCUIT.
framework: qiskit
expect:
  terminal_reason: null
  output_keys: ["variational_energy", "exact_energy", "energy_error"]
  expected_values:
    variational_energy: -1.2441882727759757
    exact_energy: -1.2441882727759757
    energy_error: 0.0
  expected_value_tolerance: 0.00001
  saves_artifact: true
