id: holdout-v6-06
category: "Holdout v6 — GHZ quantum Fisher information"
split: holdout
difficulty: research
workload: scientific
prompt: >-
  Prepare a four-qubit GHZ state in Qiskit. For phase encoding generated by
  G=(Z0+Z1+Z2+Z3)/2, compute from the statevector the generator mean, variance, and
  pure-state quantum Fisher information F_Q=4 Var(G). Independently verify the same
  QFI using a small symmetric finite-difference fidelity calculation around theta=0.
  Return top-level numeric RESULT keys generator_mean, generator_variance, qfi, and
  qfi_finite_difference, and bind the GHZ preparation circuit to FINAL_CIRCUIT.
framework: qiskit
expect:
  terminal_reason: null
  output_keys: ["generator_mean", "generator_variance", "qfi", "qfi_finite_difference"]
  expected_values:
    generator_mean: 0.0
    generator_variance: 4.0
    qfi: 16.0
    qfi_finite_difference: 16.0
  expected_value_tolerance: 0.001
  saves_artifact: true
