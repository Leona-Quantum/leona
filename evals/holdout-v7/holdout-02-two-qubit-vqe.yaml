  numeric RESULT keys variational_energy, exact_energy, and energy_error, and bind the
  best variational circuit to FINAL_CIRCUIT.
framework: qiskit
expect:
  terminal_reason: null
  output_keys: ["variational_energy", "exact_energy", "energy_error"]
  expected_values:
    variational_energy: -1.1238465086573195
    exact_energy: -1.1238465086573195
    energy_error: 0.0
  expected_value_tolerance: 0.00001
