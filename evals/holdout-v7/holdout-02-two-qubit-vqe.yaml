id: holdout-v7-02
category: "Holdout v7 — Independent two-qubit VQE"
split: holdout
difficulty: advanced
workload: scientific
prompt: >-
  Estimate the ground-state energy of the explicit two-qubit Hamiltonian
  H=-0.21 II +0.48 ZI -0.35 IZ +0.22 XX -0.14 YY +0.08 ZZ. Use a nontrivial
  parameterized Qiskit ansatz, an exact statevector expectation objective, a robust
  optimizer, and at least three deterministic initial parameter vectors. Diagonalize
