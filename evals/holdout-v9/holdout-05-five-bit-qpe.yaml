id: holdout-v9-05
category: "Holdout v9 — Five-bit exact phase estimation"
split: holdout
difficulty: advanced
workload: scientific
prompt: >-
  Build a Qiskit phase-estimation circuit with five counting qubits and one target
  qubit prepared in |1>. Use U=diag(1,exp(2*pi*i*11/32)), explicit controlled powers,
  an inverse QFT, 4096 shots, deterministic simulator and transpiler seeds, and an
  explicit explanation in the code of the Qiskit bit-order decoding. Return top-level
  RESULT keys phase_integer, phase_estimate, peak_probability, and counts. Bind the
  executed phase-estimation circuit to FINAL_CIRCUIT; derive the estimate from its
  sampled count distribution rather than returning the known phase directly.
framework: qiskit
expect:
  terminal_reason: null
  output_keys: ["phase_integer", "phase_estimate", "peak_probability", "counts"]
  expected_top_bitstring: "01011"
  expected_values:
    phase_integer: 11.0
    phase_estimate: 0.34375
    peak_probability: 1.0
  expected_value_tolerance: 0.001
  saves_artifact: true
