novelty_reason: >
  The underlying two-CNOT "uniformly-controlled-rotation" gate PRIMITIVE is a known
  circuit identity, but the SPECIFIC formula this task requires — connecting
  belief-propagation-derived tree marginals/conditionals into per-node alpha/beta angles
  and composing them recursively across a tree (Eqs. 34, 38-40) — is presented as this
  paper's own circuit-construction method for its Ising-graphical-model application, not
  cited from elsewhere in the fetched text. A model would need to correctly reproduce
  THIS paper's specific angle-decomposition formula, not just "know how to build a
  controlled rotation."
notes: >
  Verified 2026-09-23 by direct simulation: for `p_r=0.36`, `P(a=1|r=0)=0.2`,
  `P(a=1|r=1)=0.7`, `P(b=1|r=0)=0.5`, `P(b=1|r=1)=0.1`, the circuit's measured
  probabilities matched the classically-computed joint distribution
  `P(r,a,b)=P(r)P(a|r)P(b|r)` exactly (all 8 outcomes, to floating-point precision) — this
  confirms the Eq. 34/38-40 "two-CNOT uniformly-controlled-rotation" construction is
  correctly reproduced, not merely plausible-looking. The paper's own text (fetched via
  ar5iv HTML render) gives this general formula but no fully worked numeric toy example
  (its own smallest studied system is a 20-node model, "too large to serve as a
  pedagogical example" per the fetch); the specific 3-node tree and probability values
  used here were constructed by applying the paper's own general formula, not vendored
  from the paper's own numbers — stated plainly per this benchmark's own transcription
  discipline.
