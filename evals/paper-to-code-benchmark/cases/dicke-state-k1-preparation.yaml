quoted_excerpt: >
  Equation (9), the maximum-spin special case: "the corresponding state would be
  stabilized by all SWAP gates, and thus by the whole permutation group S_n generated by
  them," yielding "|S=n/2, S^z=n/2-k> = (1/sqrt(n choose k)) * sum_{|x|=k} |x>."
prompt: |
  The paper arXiv:2608.22892 ("Deterministic Preparation of Arbitrary Spin Eigenfunctions")
  generalizes Bärtschi and Eidenbenz's Dicke-state preparation algorithms. Its maximum-spin
  special case (Eq. 9) is the standard Dicke state:

      |S = n/2, S^z = n/2 - k> = (1 / sqrt(C(n, k))) * sum_{|x| = k} |x>

  the EQUAL superposition, with all-real-positive amplitudes, of every n-bit string `x`
  with Hamming weight `k` (the paper: this case "would be stabilized by all SWAP gates, and
  thus by the whole permutation group").

  Implement the `k = 1` special case (the "W state") for `n = 4` qubits as a Qiskit
  function `dicke_k1_state(n: int) -> QuantumCircuit`: the equal superposition of every
  n-bit string with EXACTLY one `1`, i.e. `(|1000> + |0100> + |0010> + |0001>) / 2` for
  `n=4` (using Qiskit's little-endian bit ordering).

  Requirements:
  - Preserve the exact function name and signature.
  - The circuit must have no measurements and use exactly `n` qubits.
  - The resulting state must be the exact equal superposition described above (real,
    positive, equal amplitude on every Hamming-weight-1 basis state, zero amplitude
    everywhere else) — you may use any correct gate sequence; the grader checks the
    resulting state only, not gate-level structure.
entry_point: dicke_k1_state
scaffold: |
  import numpy as np
  from qiskit import QuantumCircuit


  def dicke_k1_state(n: int) -> QuantumCircuit:
      """Build the k=1 Dicke state (W state): the equal superposition of every n-bit
      string with exactly one 1 (Eq. 9's maximum-spin case, specialized to k=1)."""
canonical_solution: |2
      qc = QuantumCircuit(n)
      qc.x(0)
      for i in range(1, n):
          theta = 2 * np.arccos(np.sqrt(1.0 / (n - i + 1)))
          qc.cry(theta, i - 1, i)
          qc.cx(i, i - 1)
      return qc
hidden_test: |
  def check(candidate):
      import numpy as np
      from qiskit.quantum_info import Statevector

      n = 4
      candidate_qc = candidate(n)
      assert candidate_qc.num_qubits == n, candidate_qc.num_qubits

      sv = Statevector(candidate_qc)
      probs = sv.probabilities_dict()

      weight1 = {bits: amp for bits, amp in probs.items() if bits.count("1") == 1}
      assert len(weight1) == n, (
          f"expected exactly {n} populated Hamming-weight-1 basis states, got {weight1}"
      )
      for bits, prob in weight1.items():
          assert abs(prob - 1.0 / n) < 1e-9, (bits, prob)
      leaked = sum(p for bits, p in probs.items() if bits.count("1") != 1)
      assert leaked < 1e-9, f"probability leaked onto non-Hamming-weight-1 states: {leaked}"

      # Amplitudes must be REAL and POSITIVE (Eq. 9's stated equal-superposition form has
      # no relative phases), not merely equal in magnitude.
      for i in range(n):
          bitstring = ["0"] * n
          bitstring[i] = "1"
          index = int("".join(reversed(bitstring)), 2)
          amp = sv.data[index]
          assert amp.real > 0 and abs(amp.imag) < 1e-9, (i, amp)
grading_method: distribution
qubits: 4
novelty: restated
novelty_reason: >
  The k=1 Dicke state is the W state — a textbook construction that has been standard in
  quantum computing curricula and model training data for years, well before this paper.
  The paper's own text confirms this is its stated MAXIMUM-SPIN special case (Eq. 9), not
  its novel contribution (the general, non-uniform branching-path construction, for which
  the paper gives no worked small example at all — see PROVENANCE.md). A model needs no
  knowledge of this paper to pass this task.
notes: >
  Verified 2026-09-23 by direct simulation for n=3, 4, 5: this recursive construction
  (`X` on qubit 0, then for each subsequent qubit a controlled-Ry from the previous qubit
  followed by a CNOT that moves the "excitation" forward) puts exactly `1/n` probability on
  each of the `n` Hamming-weight-1 basis states and zero elsewhere, for every `n` tested —
  confirmed numerically, not asserted from memory of the general Dicke-state algorithm. The
  paper's own text (fetched via ar5iv HTML render) confirms Eq. 9 is the paper's own stated
  special case (not something read into it) and that no fully worked small gate-sequence
  example exists in the paper for the GENERAL (non-uniform, arbitrary branching-path) case
  it introduces — this task therefore targets the maximum-spin special case the paper
  itself states in closed form, not the paper's novel generalization, which the fetched
  text says has no self-contained small worked example to build a checkable task from.
