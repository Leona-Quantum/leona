task_id: babbush-2018-jellium-n128
algorithm: >
  Linear-T qubitization of the 3D spinful uniform electron gas (jellium) Hamiltonian, dual
  (plane-wave) basis (Babbush et al.'s linear-T-complexity construction).
problem_size:
  system: "3D spinful jellium, Wigner-Seitz radius rs=10 Bohr, half filling"
  num_orbitals: 128
hardware_assumptions:
  physical_gate_error_rate: 0.001
  qec_scheme: "surface code"
  surface_code_cycle_time_us: 1
prompt: |
  You are estimating fault-tolerant quantum computing resources for a specific row of a
  published table. Answer using ONLY the assumptions below.

  Algorithm: a linear-T-complexity qubitization circuit (Babbush et al. 2018) for estimating
  the ground-state energy of the 3D spinful uniform electron gas (jellium), dual/plane-wave
  basis, Wigner-Seitz radius rs=10 Bohr, at half filling.

  Problem size: 128 orbitals.

  Hardware / QEC assumptions (use exactly these):
  - Physical gate error rate: 1e-3
  - Surface code, 1 microsecond cycle time
  - Automated (not hand-derived) physical-resource compilation, the paper's own headline
    per-error-rate figures

  Report:
  1. Logical qubit count.
  2. T-gate count.
  3. Total physical qubit count.
  4. Total runtime, in hours.
assumptions:
  - "3D spinful jellium, rs=10 Bohr, half filling, 128 orbitals (Table III, p.23)"
  - "Logical qubits = 210 (Table III, row N=128)"
  - "T-count = 1.9x10^8 (Table III, row N=128)"
  - "Physical gate error rate 1e-3, surface code, 1us cycle time (Table VI inputs, p.31)"
  - "Physical qubits and runtime from Table IX (p.34), \"Electronic structure (jellium)\" \
    row N=128, p=1e-3 column"
quantities_pinned: [logical_qubits, t_count, physical_qubits, runtime_value]
reference:
  logical_qubits: 210
  t_count: 190000000
  physical_qubits: 2900000
  runtime_value: 10
units:
  runtime_value: hours
tolerance_log10:
  logical_qubits: 0.03
  t_count: 0.10
  physical_qubits: 0.15
  runtime_value: 0.15
tolerance_rationale:
  logical_qubits: "Fixed by the algorithm's register layout for a stated orbital count — same reasoning as the sibling Hubbard case in this corpus."
  t_count: "Closed-form linear-T cost formula, not a numerical optimization — same tight band as the sibling Hubbard case."
  physical_qubits: "Automated-compilation output (Table IX) with legitimate implementation variance — same band as the sibling Hubbard case and Kivlichan 2020."
  runtime_value: "Same reasoning as physical_qubits."
source:
  arxiv_id: "1805.03662"
  title: "Encoding Electronic Spectra in Quantum Circuits with Linear T Complexity"
  authors:
    - "Ryan Babbush"
    - "Craig Gidney"
    - "Dominic W. Berry"
    - "Nathan Wiebe"
    - "Jarrod McClean"
    - "Alexandru Paler"
    - "Austin Fowler"
    - "Hartmut Neven"
  venue: "arXiv preprint, 2018 (v2)"
  location: "Table III (p.23, row N=128); Table VI (p.31, inputs); Table IX (p.34, automated physical estimate)"
  url: "https://arxiv.org/abs/1805.03662"
  retrieved: "2026-09-21"
cross_check:
  ran: true
  tool: "Microsoft QDK Python package (`qdk` v1.32.3), `qdk.estimator.LogicalCounts.estimate()`"
  command: >
    LogicalCounts({"numQubits": 210, "tCount": 190_000_000, ...}).estimate({"errorBudget": 0.01,
    "qubitParams": {"name": "qubit_gate_ns_e3"}, "qecScheme": {"name": "surface_code"}})
  inputs:
    numQubits: 210
    tCount: 190000000
    errorBudget: 0.01
    qubitParams: "qubit_gate_ns_e3"
    qecScheme: "surface_code"
  result:
    physicalQubits: 955276
    runtime_seconds: 1748
  agreement: >
    Physical qubits: predicted 955K vs. the paper's 2.9M (Azure predicts ~3x fewer). Runtime:
    predicted 29 minutes vs. the paper's 10 hours (Azure predicts ~20x less time). Same
    direction and similar magnitude of disagreement as this paper's sibling Hubbard case in
    this corpus, consistent with a shared cause (this paper's per-gate clocking assumptions,
    not a per-case anomaly). Recorded as an honest disagreement, not corroboration.
  note: null
notes: null
