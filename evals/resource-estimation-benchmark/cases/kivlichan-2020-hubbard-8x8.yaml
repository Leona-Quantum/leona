    - "Ryan Babbush"
  venue: "arXiv preprint, 2019-2020"
  location: "Section 3.3 \"Surface code resource estimate analysis\", Table 1 (printed p.13), row \"8x8, Anc=4\""
  url: "https://arxiv.org/abs/1902.10673"
  retrieved: "2026-09-21"
cross_check:
  ran: true
  tool: "Microsoft QDK Python package (`qdk` v1.32.3), `qdk.estimator.LogicalCounts.estimate()`"
  command: >
    LogicalCounts({"numQubits": 132, "cczCount": 250_000, ...}).estimate({"errorBudget": 0.01,
    "qubitParams": {"name": "qubit_gate_ns_e3"}, "qecScheme": {"name": "surface_code"}})
  inputs:
    numQubits: 132
    cczCount: 250000
    errorBudget: 0.01
    qubitParams: "qubit_gate_ns_e3"
    qecScheme: "surface_code"
  result:
    physicalQubits: 521156
    runtime_seconds: 6
  agreement: >
    Physical qubits agree within a factor of 1.6 (521K predicted vs. 320K in the paper) —
    reasonable given the two estimators use different code-distance-optimization
    conventions. Runtime disagrees sharply (6 seconds predicted vs. 2,160 seconds / 0.60
    hours in the paper), by roughly 360x. The likely cause: this paper explicitly uses a
    decoder/control latency of 10 microseconds per round, stated in-text as "100 times
    slower than previously assumed" specifically BECAUSE the paper wanted a more
    conservative, realistic runtime than a naive model gives — the generic estimator's
    default clocking has no way to reproduce that deliberately pessimistic, paper-specific
    choice. Recorded as an honest, understood disagreement, not corroboration.
  note: null
notes: null
