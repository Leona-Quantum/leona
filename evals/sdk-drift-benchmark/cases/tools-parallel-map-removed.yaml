task_id: tools-parallel-map-removed
change:
  drift_topic: tools-parallel-map-removed
  old_api: "from qiskit.tools import parallel_map"
  new_api: "from qiskit.utils import parallel_map"
  changed_in_version: "1.0.0"
  release_note_url: "https://quantum.cloud.ibm.com/docs/en/migration-guides/qiskit-1.0-features"
  release_note_quote: "The qiskit.tools module was removed in Qiskit v1.0."
prompt: |
  Using Qiskit, write a function `squares_via_batch_map(values: list) -> list` that uses
  Qiskit's own utility for applying a function across a list of inputs to compute the
  square of every value in `values`, and returns the results as a list in the same order.

  Requirements:
  - Preserve the exact function name and signature.
  - Configure it to use a single worker (no multi-process fan-out): the grading machine
    may not be able to pickle a lambda across separate worker processes, so the result
    must not depend on that being possible.
entry_point: squares_via_batch_map
scaffold: |
  def squares_via_batch_map(values: list) -> list:
      """Use Qiskit's own batch-mapping utility to square every value in `values`."""
canonical_solution: |2
      from qiskit.utils import parallel_map

      return list(parallel_map(lambda x: x * x, values, num_processes=1))
outdated_solution: |2
      from qiskit.tools import parallel_map

      return list(parallel_map(lambda x: x * x, values, num_processes=1))
hidden_test: |
  def check(candidate):
      result = candidate([1, 2, 3, 4])
      assert result == [1, 4, 9, 16], result
expected_failure_pattern: "No module named 'qiskit\\.tools'"
qiskit_pin_at_authoring: "2.5.2"
notes: >
  Verified directly (2026-09-23): `from qiskit.tools import parallel_map` raises
  `ModuleNotFoundError: No module named 'qiskit.tools'`; `qiskit.utils.parallel_map` with a
  lambda over a 4-element list executes correctly and serially (empirically confirmed —
  no multiprocessing-pickling failure at this size). Correction, same day: that held on macOS only. On multi-core Linux (CI)
  `parallel_map` forks worker processes and the lambda cannot be pickled, so the canonical
  failed there; both solutions now pass `num_processes=1`, because the drift this task
  tests is the import path, not parallel execution.
