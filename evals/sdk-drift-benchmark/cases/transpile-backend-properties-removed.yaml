task_id: transpile-backend-properties-removed
change:
  drift_topic: transpile-backend-properties-removed
  old_api: "generate_preset_pass_manager(optimization_level=1, backend=backend, backend_properties=None)"
  new_api: "generate_preset_pass_manager(optimization_level=1, backend=backend)"
  changed_in_version: "2.0.0"
  release_note_url: "https://quantum.cloud.ibm.com/docs/en/migration-guides/qiskit-2.0"
  release_note_quote: "The backend_properties input argument is no longer supported, and the BackendProperties class has been removed."
prompt: |
  Using Qiskit, write a function `preset_pass_manager_stage_names(num_qubits: int) -> list`
  that builds a target-specific compilation pass manager (optimization level 1) for a
  generic simulated backend with `num_qubits` qubits, and returns the list of named
  stages in the resulting pass manager (`list(pm.stages)`).

  Requirements:
  - Preserve the exact function name and signature.
  - Construct the pass manager using only the backend and the optimization level — no
    other configuration input.
entry_point: preset_pass_manager_stage_names
scaffold: |
  def preset_pass_manager_stage_names(num_qubits: int) -> list:
      """Build a preset pass manager for a generic simulated backend and return its
      stage names."""
canonical_solution: |2
      from qiskit.providers.fake_provider import GenericBackendV2
      from qiskit.transpiler import generate_preset_pass_manager

      backend = GenericBackendV2(num_qubits=num_qubits)
      pm = generate_preset_pass_manager(optimization_level=1, backend=backend)
      return list(pm.stages)
outdated_solution: |2
      from qiskit.providers.fake_provider import GenericBackendV2
      from qiskit.transpiler import generate_preset_pass_manager

      backend = GenericBackendV2(num_qubits=num_qubits)
      pm = generate_preset_pass_manager(
          optimization_level=1, backend=backend, backend_properties=None
      )
      return list(pm.stages)
hidden_test: |
  def check(candidate):
      stages = candidate(3)
      assert stages == ["init", "layout", "routing", "translation", "optimization", "scheduling"], stages
expected_failure_pattern: "unexpected keyword argument 'backend_properties'"
qiskit_pin_at_authoring: "2.5.2"
notes: >
  Verified directly (2026-09-23) against qiskit==2.5.2: passing `backend_properties=None`
  raises `TypeError: generate_preset_pass_manager() got an unexpected keyword argument
  'backend_properties'`; the plain call returns a `StagedPassManager` whose
  `list(pm.stages)` is exactly `['init', 'layout', 'routing', 'translation',
  'optimization', 'scheduling']`.
