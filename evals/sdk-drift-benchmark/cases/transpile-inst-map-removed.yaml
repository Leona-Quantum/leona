task_id: transpile-inst-map-removed
change:
  drift_topic: transpile-inst-map-removed
  old_api: "generate_preset_pass_manager(optimization_level=1, backend=backend, inst_map={})"
  new_api: "generate_preset_pass_manager(optimization_level=1, backend=backend)"
  changed_in_version: "2.0.0"
  release_note_url: "https://quantum.cloud.ibm.com/docs/en/migration-guides/qiskit-2.0"
  release_note_quote: "The inst_map argument has been removed without alternative."
prompt: |
  Using Qiskit, write a function `preset_pass_manager_ok(num_qubits: int) -> bool` that
  builds a target-specific compilation pass manager (optimization level 1) for a generic
  simulated backend with `num_qubits` qubits, and returns `True` if construction
  succeeds.

  Requirements:
  - Preserve the exact function name and signature.
  - Construct the pass manager using only the backend and the optimization level — no
    other configuration input.
entry_point: preset_pass_manager_ok
scaffold: |
  def preset_pass_manager_ok(num_qubits: int) -> bool:
      """Build a preset pass manager for a generic simulated backend and return True on
      success."""
canonical_solution: |2
      from qiskit.providers.fake_provider import GenericBackendV2
      from qiskit.transpiler import generate_preset_pass_manager

      backend = GenericBackendV2(num_qubits=num_qubits)
      generate_preset_pass_manager(optimization_level=1, backend=backend)
      return True
outdated_solution: |2
      from qiskit.providers.fake_provider import GenericBackendV2
      from qiskit.transpiler import generate_preset_pass_manager

      backend = GenericBackendV2(num_qubits=num_qubits)
      generate_preset_pass_manager(optimization_level=1, backend=backend, inst_map={})
      return True
hidden_test: |
  def check(candidate):
      assert candidate(3) is True
expected_failure_pattern: "unexpected keyword argument 'inst_map'"
qiskit_pin_at_authoring: "2.5.2"
notes: >
  Verified directly (2026-09-23) against qiskit==2.5.2: passing `inst_map={}` raises
  `TypeError: generate_preset_pass_manager() got an unexpected keyword argument
  'inst_map'`; the plain call succeeds.
