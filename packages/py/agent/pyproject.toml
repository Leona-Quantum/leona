[project]
name = "majorana-agent"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "majorana-contracts",
    "majorana-frameworks",
    "majorana-llm",
    "pydantic>=2.13.5",
]

[tool.uv.sources]
majorana-contracts = { workspace = true }
majorana-frameworks = { workspace = true }
majorana-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_agent"]
