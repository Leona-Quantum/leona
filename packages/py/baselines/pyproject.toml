[project]
name = "majorana-baselines"
version = "0.1.0"
description = "Deterministic classical baselines (brute-force / exact diagonalization) for optimization tasks"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "numpy>=1.26", "majorana-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_baselines"]

[tool.uv.sources]
majorana-contracts = { workspace = true }
