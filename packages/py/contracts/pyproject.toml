[project]
name = "majorana-contracts"
version = "0.1.0"
description = "Source of truth for every cross-boundary type (RunEvent, Plan, Artifact, Run, VerificationRecord, Scope)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_contracts"]
