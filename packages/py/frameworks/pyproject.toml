[project]
name = "majorana-frameworks"
version = "0.1.0"
description = "Framework-native circuit source and optional OpenQASM interchange boundary"
requires-python = ">=3.12"
dependencies = ["majorana-contracts"]

[project.optional-dependencies]
optimizers = [
    "qiskit>=2.5.2,<3",
    "pennylane>=0.45.1,<0.46",
    "pytket>=2.18.1,<3",
    "pyzx>=0.10.5,<0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_frameworks"]

[tool.uv.sources]
majorana-contracts = { workspace = true }
