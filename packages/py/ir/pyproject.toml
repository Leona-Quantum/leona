[project]
name = "majorana-ir"
version = "0.1.0"
description = "Canonical circuit IR v1 + framework connectors + export classification + fingerprints"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "majorana-contracts"]

[project.optional-dependencies]
# Qiskit is only needed for the object-import path (sandbox emits OpenQASM, which
# needs no SDK). Kept optional so the pure IR + classifier install stays light.
qiskit = ["qiskit>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_ir"]

[tool.uv.sources]
majorana-contracts = { workspace = true }
