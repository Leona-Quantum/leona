[project]
name = "majorana-llm"
version = "0.1.0"
description = "LLM client, per-stage model constants, and system prompts for the pipeline"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "majorana-contracts"]

[project.optional-dependencies]
# The real provider client. Kept optional so prompts + FakeLLM install without the
# SDK (which needs an API key to do anything). Provider is Anthropic by default;
# see models.py — the rebuild plan did not pin one, so this is owner-confirmable.
anthropic = ["anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_llm"]

[tool.uv.sources]
majorana-contracts = { workspace = true }
