[project]
name = "majorana-llm"
version = "0.1.0"
description = "LLM client, per-stage model constants, and system prompts for the pipeline"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13.5", "majorana-contracts"]

[project.optional-dependencies]
# Real provider clients. Kept optional so the core package can be imported for
# prompt parsing and adapter tests without a provider SDK. Owner confirmed OpenAI
# + DeepSeek (2026-07-10); DeepSeek speaks the OpenAI wire protocol, so one SDK
# covers both. Anthropic stays as an alternate profile.
openai = ["openai>=3.3.1"]
anthropic = ["anthropic>=1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_llm"]

[tool.uv.sources]
majorana-contracts = { workspace = true }
