[project]
name = "leona-mcp"
version = "0.2.0"
description = "An MCP server over the public Quantum Atlas at leonaqt.com, and, with a token, verified runs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # The official MCP Python SDK, held on the 1.x line. 2.x exists (2.0.0,
    # 2026-07-28) and is maintained in parallel, but it moves to `httpx2`,
    # `mcp-types` and `opentelemetry-api`, none of which this repo carries.
    # 1.x resolves against the `httpx`, `starlette`, `uvicorn`, `pydantic`,
    # `anyio`, `jsonschema` and `pyjwt` already in uv.lock.
    "mcp>=1.27,<2",
    # `server.py` imports `pydantic.Field`/`BaseModel` for the tool parameter
    # schemas. The floor is the one mcp 1.x already requires, so this adds no
    # constraint of its own.
    "pydantic>=2.11,<3",
    # `run_verified` polls `leona_client.Client` (synchronous) off the stdio
    # server's event loop via `anyio.to_thread.run_sync`. Already in uv.lock
    # transitively through `mcp`; named here because this package imports it
    # directly.
    "anyio>=4.4,<5",
    # The one HTTP client (proposal 7 Phase D, ai-ops 349/362): the Atlas fetch
    # (`CatalogClient`) that used to live in this package, plus the
    # authenticated control-plane calls the acting tools below make. Installable
    # standalone the same way this package is — see its own pyproject.toml —
    # which is what keeps `uvx --from ...#subdirectory=packages/py/mcp` working
    # with no other workspace member on disk.
    "leona-client",
]

[project.scripts]
leona-mcp = "leona_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leona_mcp"]

[tool.uv.sources]
# See leona-client's own pyproject.toml for why this resolves for a standalone
# `uvx --from git+...#subdirectory=packages/py/mcp` install too, not only inside
# `uv sync --all-packages`: verified by installing this exact package from a
# `git+file://` URL into a throwaway venv with no local workspace checkout.
leona-client = { workspace = true }
