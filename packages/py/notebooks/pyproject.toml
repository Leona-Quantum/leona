[project]
name = "leona-notebooks"
version = "0.1.0"
description = "Leona Notebooks — spec, authoring format, ipynb compiler, sandbox cell runner, revision ops and curriculum builder for AI-generated Jupyter lessons"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "nbformat>=5.10,<6",
    "pyyaml>=6,<7",
    "majorana-contracts",
    "majorana-sandbox",
    # `%nala`'s control-plane calls (proposal 7 Phase D): `leona_notebooks.jupyter.Client`
    # is now a thin subclass of `leona_client.Client`, generalised out of this
    # module so `leona-mcp`'s acting tools share it too.
    "leona-client",
    # `leona_notebooks.circuits` parses a reader's pasted OpenQASM 3 circuit
    # seed with `qiskit.qasm3.loads` OUTSIDE the sandbox (parsing, not
    # execution — see AGENTS.md). Both packages were, until now, only
    # transitively available here (via majorana-openqasm/majorana-qpu in the
    # worker, or the root workspace's dev group in this checkout) — v1 was
    # bitten by exactly this gap: the curriculum repo it built had qiskit
    # transitively in THIS venv but not in its own standalone lockfile.
    # `qiskit.qasm3.loads` itself needs the separate `qiskit-qasm3-import`
    # package (antlr4-based parser); it is not bundled with qiskit core.
    # Pinned to match packages/py/openqasm/pyproject.toml exactly.
    "qiskit>=2.5.2,<3",
    "qiskit-qasm3-import>=0.6,<0.7",
    # `leona_notebooks.checks` judges check cells with the verification package's
    # simulators, width ceilings and incapacity rules instead of re-implementing them
    # (ai-ops 382, DESIGN §1.2). The worker already depended on both; this makes the
    # notebooks package say so itself. Imported lazily inside the judging functions, so
    # `import leona_notebooks` and the `.nb.py`/`.ipynb` converters stay light.
    "majorana-verification",
]

[project.optional-dependencies]
# Executing a compiled notebook through a real Jupyter kernel (the reader's
# experience) is a validation concern, not a runtime one: the product executes
# cells inside the existing sandbox with no kernel at all.
execute = ["nbclient>=0.10,<1", "ipykernel>=7.3.0,<8"]

[project.scripts]
leona-notebooks = "leona_notebooks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leona_notebooks"]

[tool.uv.sources]
majorana-contracts = { workspace = true }
majorana-sandbox = { workspace = true }
leona-client = { workspace = true }
majorana-verification = { workspace = true }
