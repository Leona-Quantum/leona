# Pipeline state machine + stage executor. Pure: depends only on contracts —
# no DB, no HTTP, no provider SDKs (those live behind the worker's adapters).
[project]
name = "majorana-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["majorana-contracts"]

[tool.uv.sources]
majorana-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_pipeline"]
