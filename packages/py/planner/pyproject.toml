[project]
name = "leona-planner"
version = "0.1.0"
description = "The workflow planner's arithmetic, ported from apps/web/lib/workflow-planner and held equal to it on a grid"
requires-python = ">=3.12"
license = "MIT"
# Pure standard library on purpose: the API imports this to answer `POST /v1/plans`,
# and nothing here needs more than `math` and `json`. The TS planner is the source
# of truth; see AGENTS.md.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leona_planner"]
