[project]
name = "majorana-verification"
version = "0.1.0"
description = "Verification primitives: exact/statistical equivalence, return-contract, QASM-parse"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "numpy>=2.5.2",
    "scipy>=1.18.1",
    "majorana-contracts",
    "majorana-openqasm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_verification"]

[tool.uv.sources]
majorana-contracts = { workspace = true }
majorana-openqasm = { workspace = true }
