[project]
name = "majorana-vqe"
version = "0.1.0"
description = "Pure VQE domain models: components, workflows, scientific experiment specs, canonical Hamiltonians, comparison. No Qiskit/PennyLane/FastAPI/SQLAlchemy imports (ADR-0023/0024/0025)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_vqe"]
