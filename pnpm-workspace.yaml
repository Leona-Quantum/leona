# Refuse any npm version published in the last 24 hours (05-security.md §1
# supply chain, threat 5). Not from the review — semgrep's supply-chain rules
# raised it, and it is the one control that actually addresses how npm
# compromises play out: a maintainer account is taken over, a malicious patch
# version is published, and the damage is done in the hours before anyone
# notices and yanks it. Lockfiles and Dependabot do not help there, because the
# compromised version IS the newest one and the tooling is doing its job.
#
# 24 hours is the window in which those incidents are typically caught and
# pulled. The cost is that a genuinely urgent patch cannot be taken for a day —
# `minimumReleaseAgeExclude` is the escape hatch when that happens, and using it
# should be a deliberate, reviewed line rather than a lowered global.
minimumReleaseAge: 1440

packages:
  - "apps/*"
  - "packages/ts/*"
overrides:
  # THIRD advisory round on this package, and the pin has now walked
  # 3.1.4 -> 3.1.5 -> 3.1.6. Four advisories published against 3.1.5, all CVSS
  # 7.5 and all first patched at 3.1.6 on the 3.x line:
  #
  #   GHSA-f65p-4m7j-42xc  SSRF via malformed IPv6 normalization
  #   GHSA-fph4-wmhf-6fwf  SSRF via repeated hostname percent-decoding
  #   GHSA-jqff-g426-hqxp  host confusion via percent-encoded scheme normalization
  #   GHSA-5jgf-p345-68v8  host confusion via skipped IDN canonicalization on
  #                        scheme-relative references
  #
  # Same family as the GHSA-7p8r-x3mc-p8w7 backslash-authority bug the 3.1.5 pin
  # answered: every one of them is a parse that yields a host an origin check
  # would not expect. The dependency trace is unchanged and was re-run rather
  # than carried over — the only dependent is still ajv@8.20.0, reached through
  # schema-utils (webpack loader-option validation) and ajv-formats/ajv-keywords.
  # That is build tooling: no runtime request path here parses a URL through it,
  # because request-body validation is pydantic in the Python API and generated
  # TS types in the web app, and neither uses ajv.
  #
  # 3.1.7 is the current 3.x head and is also outside every vulnerable range.
  # 3.1.6 is taken instead because it is the exact version the four advisories
  # name as first-patched, which is the smallest change that can be justified
  # line by line — the standard the rest of this file is written to.
  #
  # That this is the third round is the thing worth reading: a URL parser that
  # keeps yielding host-confusion bugs is a standing hazard, not a run of bad
  # luck. It stays acceptable only while the trace above holds. If ajv ever
  # reaches a request path, this pin stops being a build-tooling footnote.
  fast-uri: 3.1.6
  # Not an advisory — a platform constraint, and the only pin here that is not
  # about a CVE.
  #
  # Vercel's Node runtime runs every function with `--no-experimental-require-module`
  # in `execArgv`. Measured, not inferred: a probe route deployed to a preview on
  # 2026-08-24 reported `node v24.18.0` with that flag present and `NODE_OPTIONS`
  # unset. So `require()` of an ES module throws ERR_REQUIRE_ESM there no matter
  # which Node version the project selects, and no `engines` field can change it.
  #
  # jsdom 27 and later depend on `@exodus/bytes`, which is ESM-only, and jsdom is
  # itself `"type": "commonjs"` — so jsdom's own `require()` of that package is
  # the one that throws. jsdom 26 is the last line that reaches encoding through
  # `whatwg-encoding`, which is CommonJS. **jsdom 27+ therefore cannot run in a
  # Vercel function at all**, which makes this a ceiling rather than a stale pin:
  # do not raise it because a newer jsdom is available. Raise it when Vercel
  # drops that flag, and prove that with a probe rather than a release note.
  #
  # This is what took `sanitizeMathHtml` out of the maths render path for eight
  # days (leona 690 shipped it, every page drawing mathematics returned 500,
  # leona 693 withdrew it). `isomorphic-dompurify` uses exactly one jsdom API —
  # `new JSDOM("<!DOCTYPE html>").window` — which has been stable since jsdom
  # 1.x, so holding its copy back costs nothing.
  #
  # **Scoped to that one consumer on purpose.** A tree-wide pin was written
  # first, on the argument that a suite running a different DOM from production
  # hides this class of defect. It does not apply here: the other jsdom consumer
  # is `apps/web/tests/forms/preload.mjs`, which is simulating a BROWSER, and
  # production never runs jsdom for a form. A newer jsdom is a better browser
  # there, and holding it back cost two API adaptations for no safety. The
  # sanitizer's own suite resolves through this override, so the thing that
  # deploys is still the thing that is tested.
  #
  # `apps/web/lib/sanitize-math-runtime.test.ts` reproduces the production
  # runtime directly — it spawns node with the same flag — so a regression here
  # fails CI instead of a deployment.
  isomorphic-dompurify>jsdom: 26.1.0
  # GHSA-5p4m-2wfm-xmqj (CVSS 7.5, published 2026-08-06): `resolveYamlOmap()`
  # enforces key uniqueness with `objectKeys.indexOf()` inside the per-element
  # loop, so resolving an n-entry `!!omap` is O(n²) and blocks the event loop
  # inside `yaml.load()`. `!!omap` is in the DEFAULT schema, so a bare
  # `yaml.load(input)` is affected with no custom configuration. It is the same
  # weakness as CVE-2026-59870, fixed in 5.2.1 and never backported; 4.3.0 was
  # the newest 4.x release when the advisory landed, so this is not a
  # you-are-on-an-old-version finding. Patched at 4.3.1 (and 3.15.1).
  #
  # Traced, as with fast-uri and postcss below. `@redocly/openapi-core` is the
  # only dependent on the tree, reached through openapi-typescript, which is a
  # devDependency of packages/ts/contracts-gen — the contracts codegen reading
  # this repository's own OpenAPI spec at build time. No runtime path parses a
  # user's YAML: nothing in the API or the web app calls js-yaml at all. So the
  # DoS is not reachable, and the bump is taken anyway on the standing rule that
  # "build-time only" is a reason not to panic and not a reason to sit on a
  # known-vulnerable parser.
  #
  # The 4.3.0 pin it replaces arrived inside a broad "refresh security lock"
  # commit (591215e9) with no advisory recorded, which is why this line now
  # carries one. 4.3.1 published 2026-07-31, so it clears `minimumReleaseAge`
  # above without the exclude hatch.
  js-yaml: 4.3.1
  sharp: 0.35.3
  # postcss advisories keep landing on the version Next/Tailwind pull in:
  # GHSA-6g55-p6wh-862q flagged 8.4.31, then GHSA-r28c-9q8g-f849 (CVSS 7.5,
  # source-map path traversal) flagged everything <= 8.5.17. A targeted
  # `8.4.31: x` override can't catch the copy @tailwindcss/postcss resolves by
  # range, so dedupe the whole tree onto the first patched release. All postcss
  # here is 8.x, so each of these is a backward-compatible patch bump.
  #
  # Third round, 2026-08-05: GHSA-fxqj-rqcc-2cmp (CVSS 6.3) is the incomplete-fix
  # follow-up to GHSA-6g55-p6wh-862q and flags everything <= 8.5.22, so 8.5.18
  # was affected again. Patched at 8.5.23.
  #
  # Traced rather than assumed, as with fast-uri above. The advisory needs
  # postcss to process ATTACKER-CONTROLLED CSS with `map: true` and no `from`,
  # and then to serve the resulting source map. Every postcss invocation here is
  # Next/Tailwind compiling this repository's own stylesheets at build time —
  # there is no path by which a user's bytes reach it. So this is not exposure
  # being closed; it is a patch bump taken because "build-time only" is a reason
  # not to panic and not a reason to sit on a known-vulnerable parser.
  postcss: 8.5.23
  # GHSA-2v37-7h3g-55p8: a custom alphabet passed to nanoid's generator loops
  # indefinitely when `size` is zero, hanging the caller. Reached here only
  # through postcss (pinned above), which uses nanoid for source-map ids at
  # build time, so as with postcss itself this is a patch bump taken on the
  # standing rule rather than exposure being closed — no user's bytes reach it.
  #
  # Recorded because the version arithmetic here is a trap. The advisory was
  # published 2026-07-29 naming 3.3.17 as the 3.x fix, and it was RE-SCOPED on
  # 2026-08-13T16:00Z to `fixed: 3.3.18` — so a tree sitting on 3.3.17, which
  # had been correct for two weeks, became a blocking finding with no change on
  # our side. That is what turned every open PR red at once; the gate was
  # working. Read the OSV record live before concluding a nanoid finding is a
  # false positive, and do not trust the GitHub advisory's summary range alone:
  # it lists only `>= 4.0.0, < 5.1.6` and omits the 3.x branch entirely, which
  # makes 3.3.17 look unaffected when OSV says otherwise.
  #
  # 3.3.18 published 2026-08-07, so it clears `minimumReleaseAge` above without
  # the exclude hatch.
  nanoid: 3.3.18
  # brace-expansion DoS, twice over: GHSA-mh99-v99m-4gvg (unbounded expansion
  # length OOMs the process) and then GHSA-rgw5-rvv9-x895, which bypasses the
  # first one's mitigation via unbounded *intermediate* arrays. Both CVSS 7.5.
  # Two copies are on the tree and each needs its own line, because a single
  # unscoped override would jump minimatch@5's copy three majors for no reason:
  #   - 2.x, via minimatch@5 <- @redocly/openapi-core <- openapi-typescript
  #     (contracts codegen). Patched at 2.1.3 / 2.1.4.
  #   - 5.x, via minimatch@10 <- @sentry/bundler-plugin-core's glob, and the
  #     same @redocly path. Patched at 5.0.8 / 5.0.9.
  # Both are patch bumps inside the resolved major, so no consumer sees an API
  # change. This replaces the ALLOWLIST entry that previously accepted the 2.x
  # copy in scripts/check_osv_report.py: that entry was written when 2.1.2 was
  # the last 2.x release and no fix existed for it. Upstream has since shipped
  # 2.1.3 and 2.1.4, so the finding is now upgradable and the acceptance is gone.
  brace-expansion@^2.0.0: 2.1.4
  brace-expansion@^5.0.0: 5.0.9
  # AIKIDO-2026-293837 (MEDIUM): katex < 0.18.2 is vulnerable. rehype-katex@7.0.1
  # and micromark-extension-math@3.1.0 both declare `katex@^0.16.0` and neither
  # has a release that bumps to ^0.18.x, so a parent bump cannot fix this path.
  # Pin the whole tree to 0.18.4 (the version already resolved for the direct dep
  # in apps/web) so both transitive consumers get the patched release.
  katex: 0.18.4
  # AIKIDO-2026-584205 (LOW): jose cryptographic timing side-channel. Patched at
  # 6.2.5. The only consumer on the tree is @workos-inc/authkit-nextjs, which
  # pins jose@^5.10.0 across all published releases (4.3.1, the one we are on,
  # still carries ^5.10.0), so no parent bump can reach the fix — an override is
  # the only path. Selector-scoped to the 5.x range so a future authkit-nextjs
  # that ships jose 6.x or 7.x itself is not silently held back at 6.2.5.
  #
  # jose 6 is ESM-only, which is the real compatibility risk here rather than the
  # timing fix: a CommonJS `require("jose")` under it throws ERR_REQUIRE_ESM.
  # authkit-nextjs 4.3.1 ships ESM (`"type": "module"`, exports map with an
  # `import` condition and no `require` one) and imports jose in three places, so
  # the resolution holds — but that is a claim about a module graph, and a graph
  # that resolves can still fail to validate a token.
  #
  # `apps/web/lib/session-jwt-crypto.test.ts` is the control. Note what it does
  # NOT test: ai-ops#131 proposed a "seal/unseal" test, and that would have
  # proved nothing, because the session COOKIE is sealed by `iron-session`, whose
  # only dependencies are cookie / iron-webcrypto / uncrypto — jose is not among
  # them. The jose surface is the ACCESS TOKEN: `createRemoteJWKSet` and
  # `jwtVerify` at session.js:19/419 and `decodeJwt` at ten call sites.
  #
  # The load-bearing assertion is the one comparing the jose path authkit
  # resolves against the one apps/web resolves. `apps/web` carries jose as a
  # devDependency so the test can import it at all, and with the override removed
  # the other eight assertions still PASS against that private copy while authkit
  # silently drops to 5.10.0 — verified by actually removing the line and
  # re-installing. So the same-copy check is the only thing standing between a
  # reverted override and a green suite over an open advisory.
  #
  # Owner ruled land-now on ai-ops#131, accepting that this synthetic control
  # rather than a real browser sign-in is what gates it: a preview deployment
  # cannot hold a production session cookie, because WorkOS redirect URIs are
  # per-domain.
  #
  # THIS VERSION AND `apps/web`'s `jose` DEVDEPENDENCY MUST MOVE TOGETHER. They
  # are two halves of one control and they live in two different files, so a bump
  # that reads either file alone splits them. That is not hypothetical: Dependabot
  # opened a PR raising the devDependency 6.2.5 -> 6.2.8 and left this line at
  # 6.2.5, which resolved apps/web to one copy of jose and authkit to another and
  # reopened the advisory on the signed-in path while every other assertion in the
  # suite stayed green. The same-copy assertion in `session-jwt-crypto.test.ts`
  # caught it, which is the whole reason that assertion exists — but it catches
  # the split after the fact, so raise both numbers in the same commit.
  jose@^5.0.0: 6.2.10
  # NOT `minimatch@^5 -> 10`, though that is the tempting way to collapse the
  # two lines above into one. minimatch 10 moved from a callable default export
  # to named exports, and @redocly/openapi-core (the only minimatch@5 consumer
  # here) does `const minimatch = require("minimatch")` and then calls it —
  # which throws "m is not a function" under 10. That was verified against the
  # installed file, not inferred: the contracts codegen still passed with the
  # override in place because a plain JSON spec never reaches minimatch's glob
  # path, so the break was latent rather than loud.
# 05-security supply chain: build scripts stay blocked. sharp (next/image) is
# explicitly denied - we do not use image optimization yet; revisit in Phase 3.
allowBuilds:
  '@sentry/cli': false # only used for source-map upload; we don't
  # esbuild (ui-visual render step) ships its platform binary in the @esbuild/<host>
  # optional dep; its own postinstall is only a CLI shim, so the JS build API works with
  # the script blocked. Keep it blocked — supply-chain policy above.
  esbuild: false
  sharp: false
