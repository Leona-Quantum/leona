[project]
name = "majorana-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["majorana-contracts"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
    "import-linter>=2.3",
    "httpx>=0.27",
    "pyyaml>=6",
    # Needed so the framework-parity tests actually RUN rather than skip. Two
    # defects that cost a full candidate budget each — Cirq's QASM header and its
    # multi-qubit measurement operations — were invisible because every Cirq test
    # was an importorskip against a package CI did not install. qiskit is already
    # present transitively via majorana-verification; this closes the other side.
    "cirq-core>=1.4",
    "pennylane>=0.40",
    # The local sandbox double (majorana_sandbox.local) executes generated code with
    # the worker's OWN interpreter, so anything the generation prompt promises the
    # sandbox must be importable here or every local run dies at execution. qiskit_aer
    # is promised by _RUNTIME_LIMITS and used by the Qiskit reference template, but
    # was the one runtime package no dependency pulled in: a local walkthrough burned
    # its whole candidate budget on ModuleNotFoundError before any review ran. Pinned
    # to the version in infra/sandbox/Dockerfile so local execution matches production.
    "qiskit-aer==0.17.2",
    # Amazon Braket is an offline-only framework lane in generated code. Keep the
    # local subprocess double and production sandbox on the same tested SDK. Pin
    # the simulator and its otherwise-unbounded numba dependency too: retaining
    # an old lock selected numba 0.53.1, which cannot install on Python 3.12.
    "amazon-braket-sdk==1.122.0",
    "amazon-braket-default-simulator==1.39.5",
    "numba==0.66.0",
    # Qibo stays on its in-process NumPy backend; optional Qibolab hardware
    # backends are not installed inside the network-locked sandbox.
    "qibo==0.3.4",
    # Qulacs supplies the research-oriented high-performance local simulator.
    # Pin it so the worker's local double and the production image execute the
    # same native extension and circuit API.
    "qulacs==0.6.14",
]

[tool.uv.workspace]
members = ["services/api", "services/worker", "packages/py/*", "evals/harness"]

[tool.uv]
# This repo lives under iCloud-synced ~/Documents; iCloud flags venv .pth files
# UF_HIDDEN and Python 3.13 silently skips hidden .pth files, breaking editable
# installs. Local venv must be .venv.nosync (iCloud-excluded) with a .venv
# symlink; copy link-mode keeps cache inodes from inheriting the flag.
link-mode = "copy"

[tool.uv.sources]
majorana-contracts = { workspace = true }

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["services", "packages/py", "evals/harness"]
asyncio_mode = "auto"

# Authz invariant enforcement (02-architecture.md §4): SQLAlchemy/psycopg are
# importable only by the repository layer + db/orm modules. Second gate:
# scripts/check_raw_queries.py (both run in CI's py job).
[tool.importlinter]
root_packages = ["majorana_api", "majorana_agent", "majorana_contracts", "majorana_worker"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "contracts imports nothing internal"
type = "forbidden"
source_modules = ["majorana_contracts"]
forbidden_modules = ["majorana_api"]

[[tool.importlinter.contracts]]
name = "DB access only inside the repository layer"
type = "forbidden"
source_modules = ["majorana_api", "majorana_agent", "majorana_worker"]
forbidden_modules = ["sqlalchemy", "psycopg", "alembic"]
ignore_imports = [
    "majorana_api.db -> sqlalchemy",
    "majorana_api.orm -> sqlalchemy",
    "majorana_api.repos.* -> sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "agent core stays outside control plane and worker"
type = "forbidden"
source_modules = ["majorana_agent"]
forbidden_modules = ["majorana_api", "majorana_worker", "fastapi", "sqlalchemy", "psycopg"]
