[project]
name = "majorana-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["majorana-contracts"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.14", "import-linter>=2.3", "httpx>=0.27", "pyyaml>=6"]

[tool.uv.workspace]
members = ["services/api", "services/worker", "packages/py/*", "evals/harness"]

[tool.uv]
# This repo lives under iCloud-synced ~/Documents; iCloud flags venv .pth files
# UF_HIDDEN and Python 3.13 silently skips hidden .pth files, breaking editable
# installs. Local venv must be .venv.nosync (iCloud-excluded) with a .venv
# symlink; copy link-mode keeps cache inodes from inheriting the flag.
link-mode = "copy"

[tool.uv.sources]
majorana-contracts = { workspace = true }

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["services", "packages/py", "evals/harness"]
asyncio_mode = "auto"

# Authz invariant enforcement (02-architecture.md §4): SQLAlchemy/psycopg are
# importable only by the repository layer + db/orm modules. Second gate:
# scripts/check_raw_queries.py (both run in CI's py job).
[tool.importlinter]
root_packages = ["majorana_api", "majorana_contracts", "majorana_pipeline", "majorana_worker"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "contracts imports nothing internal"
type = "forbidden"
source_modules = ["majorana_contracts"]
forbidden_modules = ["majorana_api"]

[[tool.importlinter.contracts]]
name = "DB access only inside the repository layer"
type = "forbidden"
source_modules = ["majorana_api", "majorana_pipeline", "majorana_worker"]
forbidden_modules = ["sqlalchemy", "psycopg", "alembic"]
ignore_imports = [
    "majorana_api.db -> sqlalchemy",
    "majorana_api.orm -> sqlalchemy",
    "majorana_api.repos.* -> sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "pipeline stays pure (contracts only)"
type = "forbidden"
source_modules = ["majorana_pipeline"]
forbidden_modules = ["majorana_api", "majorana_worker", "fastapi", "httpx"]
