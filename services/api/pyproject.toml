# FastAPI control plane. Owns db/ (Alembic, seeds) and the repository layer —
# the ONLY code allowed to touch SQLAlchemy (import-linter + scripts/check_raw_queries.py).
[project]
name = "majorana-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "majorana-contracts",
    "alembic>=1.16",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
majorana-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_api"]
