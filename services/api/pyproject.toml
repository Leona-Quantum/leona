# FastAPI control plane. Owns db/ (Alembic, seeds) and the repository layer —
# the ONLY code allowed to touch SQLAlchemy (import-linter + scripts/check_raw_queries.py).
[project]
name = "majorana-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "majorana-contracts",
    "majorana-openqasm",
    "alembic>=1.16",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.35",
    "pyjwt[crypto]>=2.9",
    "sentry-sdk>=2.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[tool.uv.sources]
majorana-contracts = { workspace = true }
majorana-openqasm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_api"]

# The pinned catalog bootstrap manifest (ADR-0019) is the source of truth at the
# repo path below; force-include it into the wheel so the deployed CLI/worker can
# locate it (catalog_bootstrap_manifest.default_manifest_path prefers this copy).
[tool.hatch.build.targets.wheel.force-include]
"catalog_bootstrap/manifest.json" = "majorana_api/catalog_bootstrap/manifest.json"
# Same for the owner attestation policy (Slice C.5): catalog_attestation.
# default_policy_path prefers this copy, and attest-bootstrap cannot run without it.
"catalog_bootstrap/attestation-policy.json" = "majorana_api/catalog_bootstrap/attestation-policy.json"
