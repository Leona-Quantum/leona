# FastAPI control plane. Owns db/ (Alembic, seeds) and the repository layer —
# the ONLY code allowed to touch SQLAlchemy (import-linter + scripts/check_raw_queries.py).
[project]
name = "majorana-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "majorana-contracts",
    "majorana-pipeline",
    "majorana-openqasm",
    "alembic>=1.16",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.35",
    "pyjwt[crypto]>=2.9",
    "sentry-sdk>=2.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[tool.uv.sources]
majorana-contracts = { workspace = true }
majorana-pipeline = { workspace = true }
majorana-openqasm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_api"]
