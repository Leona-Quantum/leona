# Job runner — same image as services/api (Dockerfile there), worker entrypoint.
[project]
name = "majorana-worker"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["majorana-api"]

[tool.uv.sources]
majorana-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_worker"]
