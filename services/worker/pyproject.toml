# Job runner — same image as services/api (Dockerfile there), worker entrypoint.
[project]
name = "majorana-worker"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "majorana-api",
    "majorana-pipeline",
    "majorana-llm",
    "majorana-sandbox",
    "majorana-ir",
    "majorana-verification",
    "majorana-baselines",
]

[project.scripts]
majorana-worker = "majorana_worker.__main__:main"

[tool.uv.sources]
majorana-api = { workspace = true }
majorana-pipeline = { workspace = true }
majorana-llm = { workspace = true }
majorana-sandbox = { workspace = true }
majorana-ir = { workspace = true }
majorana-verification = { workspace = true }
majorana-baselines = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_worker"]
