# Job runner — same image as services/api (Dockerfile there), worker entrypoint.
[project]
name = "majorana-worker"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "majorana-api",
    "majorana-agent",
    "majorana-llm",
    "majorana-sandbox[vercel]",
    "majorana-frameworks",
    "majorana-openqasm",
    "majorana-qpu[ibm]",
    "majorana-verification",
    # The worker decrypts the submitting user's provider credential itself
    # (handlers._qpu_credential_for). It arrives through majorana-api today, but
    # this service imports `cryptography` in its own right, and a dependency you
    # import is a dependency you declare.
    "cryptography>=43",
    # research.py parses the arXiv API's Atom response. Declared for the same
    # reason cryptography is: this service imports it directly.
    "defusedxml>=0.7.1,<1",
]

[project.scripts]
majorana-worker = "majorana_worker.__main__:main"

[tool.uv.sources]
majorana-api = { workspace = true }
majorana-agent = { workspace = true }
majorana-llm = { workspace = true }
majorana-sandbox = { workspace = true }
majorana-frameworks = { workspace = true }
majorana-openqasm = { workspace = true }
majorana-qpu = { workspace = true }
majorana-verification = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_worker"]
